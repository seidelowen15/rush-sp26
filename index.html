  // ============================================================
  // SCHEDULE (personal availability week view)
  // ============================================================

  // Returns the Sunday at the start of the week containing `d`.
  function weekStart(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - x.getDay());
    x.setHours(0, 0, 0, 0);
    return x;
  }

  // Returns YYYY-MM-DD in local timezone for a Date.
  function isoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // Returns an array of 7 Dates representing the days of the week containing `anchor`.
  function weekDays(anchor) {
    const start = weekStart(anchor);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      out.push(d);
    }
    return out;
  }

  // Converts "HH:MM" to minutes-from-midnight.
  function hmToMinutes(s) {
    if (!s) return 0;
    const [h, m] = s.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  // Given a series event and a date, returns the effective instance fields
  // (after applying any per-instance exception). Returns null if skipped.
  function resolveInstance(ev, dateStr) {
    if (ev.exceptions && Object.prototype.hasOwnProperty.call(ev.exceptions, dateStr)) {
      const ex = ev.exceptions[dateStr];
      if (ex === null) return null; // skipped
      return Object.assign({}, ev, ex);
    }
    return ev;
  }

  // Returns an array of {event, date, startMin, endMin, instanceDate, isException}
  // for all instances within [windowStart, windowEnd] (both Dates, inclusive of date).
  function expandSchedule(windowStart, windowEnd) {
    const out = [];
    const ws = new Date(windowStart); ws.setHours(0, 0, 0, 0);
    const we = new Date(windowEnd); we.setHours(23, 59, 59, 999);

    for (const ev of state.scheduleEvents) {
      if (ev.recurrence === 'once' || !ev.recurrence) {
        const d = new Date(ev.date + 'T00:00:00');
        if (d >= ws && d <= we) {
          const resolved = resolveInstance(ev, ev.date);
          if (resolved) {
            out.push({
              event: ev,
              date: new Date(ev.date + 'T00:00:00'),
              startMin: hmToMinutes(resolved.startTime),
              endMin: hmToMinutes(resolved.endTime),
              instanceDate: ev.date,
              title: resolved.title,
              location: resolved.location,
              notes: resolved.notes,
              isOneTime: true,
            });
          }
        }
      } else if (ev.recurrence === 'weekly') {
        const seriesStart = new Date(ev.startDate + 'T00:00:00');
        const seriesEnd = ev.untilDate ? new Date(ev.untilDate + 'T23:59:59') : we;
        const iterStart = seriesStart > ws ? seriesStart : ws;
        const iterEnd = seriesEnd < we ? seriesEnd : we;
        const wds = ev.weekdays || [];
        const cursor = new Date(iterStart);
        cursor.setHours(0, 0, 0, 0);
        while (cursor <= iterEnd) {
          if (wds.includes(cursor.getDay())) {
            const ds = isoDate(cursor);
            const resolved = resolveInstance(ev, ds);
            if (resolved) {
              out.push({
                event: ev,
                date: new Date(cursor),
                startMin: hmToMinutes(resolved.startTime),
                endMin: hmToMinutes(resolved.endTime),
                instanceDate: ds,
                title: resolved.title,
                location: resolved.location,
                notes: resolved.notes,
                isOneTime: false,
              });
            }
          }
          cursor.setDate(cursor.getDate() + 1);
        }
      }
    }
    return out;
  }

  function renderSchedule() {
    const isMobile = window.innerWidth <= 900;
    const wstart = weekStart(state.weekDate);
    const wend = new Date(wstart); wend.setDate(wend.getDate() + 6);
    const days = weekDays(state.weekDate);
    const todayStr = new Date().toDateString();

    const ranges = expandSchedule(wstart, wend);

    // Group by [dayIndex][ownerId] so overlapping events from the same person stack.
    const byDay = [[], [], [], [], [], [], []];
    for (const r of ranges) {
      const idx = Math.floor((r.date - wstart) / 86400000);
      if (idx >= 0 && idx < 7) byDay[idx].push(r);
    }

    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(h);

    const monthLabel = wstart.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Mobile: show one day at a time
    const activeDayIdx = isMobile ? state.mobileScheduleDay : -1;

    const headers = '<div class="sched-day-headers">' +
      '<div class="sched-day-header"></div>' +
      days.map((d, i) => {
        const isToday = d.toDateString() === todayStr;
        const isActive = i === activeDayIdx;
        return '<div class="sched-day-header ' + (isToday ? 'today' : '') + ' ' + (isMobile && !isActive ? '' : 'mobile-active') + '">' +
          '<span class="day-name">' + d.toLocaleDateString('en-US', { weekday: 'short' }) + '</span>' +
          '<span class="day-num">' + d.getDate() + '</span>' +
        '</div>';
      }).join('') +
    '</div>';

    // Build hour rows
    let gridRows = '';
    for (const h of hours) {
      const hourLabel = h === 0 ? '12 AM' : h === 12 ? '12 PM' : h < 12 ? h + ' AM' : (h - 12) + ' PM';
      gridRows += '<div class="sched-hour-label">' + hourLabel + '</div>';
      for (let di = 0; di < 7; di++) {
        const d = days[di];
        const isToday = d.toDateString() === todayStr;
        const isActiveMobile = di === activeDayIdx;
        const hideClass = isMobile && !isActiveMobile ? 'hide-mobile' : '';
        gridRows += '<div class="sched-cell ' + (isToday ? 'today-col' : '') + ' ' + hideClass + '" ' +
          'data-day="' + di + '" data-hour="' + h + '" ' +
          'onclick="openSchedModalAt(\'' + isoDate(d) + '\', \'' + String(h).padStart(2, '0') + ':00\')"></div>';
      }
    }

    // Position event blocks absolutely over the grid.
    // Each cell is 48px tall, hour label column is 56px wide.
    // We'll render events as absolutely positioned divs inside .sched-grid.
    let eventBlocks = '';
    for (let di = 0; di < 7; di++) {
      const dayEvents = byDay[di].slice().sort((a, b) => a.startMin - b.startMin);

      // Compute overlap groups: assign each event a "column index" within its overlap cluster.
      // Simple algorithm: walk events sorted by start; track active columns and free slots.
      const placed = [];
      for (const r of dayEvents) {
        let col = 0;
        while (placed.some(p => p.col === col && p.endMin > r.startMin)) col++;
        placed.push({ r, col, endMin: r.endMin });
      }
      // Total columns used for this day = max col + 1
      const usedCols = placed.reduce((m, p) => Math.max(m, p.col), 0) + 1;

      const isActiveMobile = di === activeDayIdx;
      if (isMobile && !isActiveMobile) continue;

      for (const p of placed) {
        const r = p.r;
        const owner = MEMBERS.find(m => m.id === r.event.ownerId) || MEMBERS[0];
        const startPx = (r.startMin / 60) * 48;
        const heightPx = Math.max(20, ((r.endMin - r.startMin) / 60) * 48);

        // Position horizontally: hour label column is 56px (44 mobile),
        // each day takes (100% - that) / 7 width on desktop, full remaining on mobile day view.
        // We'll use CSS calc with custom properties.
        const labelW = isMobile ? 44 : 56;
        const dayWidthExpr = isMobile
          ? 'calc(100% - ' + labelW + 'px)'
          : 'calc((100% - ' + labelW + 'px) / 7)';
        const dayLeftExpr = isMobile
          ? labelW + 'px'
          : 'calc(' + labelW + 'px + ' + dayWidthExpr + ' * ' + di + ')';

        // Split within a day's column: column p.col of usedCols total.
        const eventLeftInDay = '(' + dayWidthExpr + ' * ' + (p.col / usedCols) + ')';
        const eventWidthInDay = '(' + dayWidthExpr + ' * ' + (1 / usedCols) + ' - 2px)';
        const leftStyle = 'calc(' + dayLeftExpr + ' + ' + eventLeftInDay + ')';

        const recurIcon = !r.isOneTime ? '↻' : '';
        const timeLabel = formatTime12(r.startMin) + ' – ' + formatTime12(r.endMin);

        eventBlocks += '<div class="sched-event" ' +
          'style="top:' + startPx + 'px; height:' + heightPx + 'px; ' +
                 'left:' + leftStyle + '; ' +
                 'width:calc(' + eventWidthInDay + '); ' +
                 'background:' + owner.color + ';" ' +
          'onclick="event.stopPropagation(); openSchedModalEdit(\'' + r.event.id + '\', \'' + r.instanceDate + '\')">' +
          (recurIcon ? '<span class="ev-recur-icon">' + recurIcon + '</span>' : '') +
          '<div class="ev-title">' + escapeHtml(r.title) + '</div>' +
          '<div class="ev-time">' + timeLabel + '</div>' +
        '</div>';
      }
    }

    // Now line (only if today is in this week)
    let nowLine = '';
    const now = new Date();
    if (now >= wstart && now <= new Date(wend.getTime() + 86400000)) {
      const minutesNow = now.getHours() * 60 + now.getMinutes();
      const topPx = (minutesNow / 60) * 48;
      nowLine = '<div class="sched-now-line" style="top:' + topPx + 'px"></div>';
    }

    const weekRangeLabel = wstart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                          ' – ' + new Date(wend).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    const legend = '<div class="sched-legend">' +
      '<span>Owners:</span>' +
      MEMBERS.map(m =>
        '<span class="sched-legend-item">' +
          '<span class="sched-legend-swatch" style="background:' + m.color + '"></span>' +
          escapeHtml(m.name) +
        '</span>'
      ).join('') +
      '<span style="margin-left:auto; opacity: 0.7;">Click an empty slot to add an event</span>' +
    '</div>';

    const mobileDay = days[activeDayIdx >= 0 ? activeDayIdx : 0];
    const mobilePager = '<div class="sched-mobile-pager">' +
      '<button class="btn btn-icon" onclick="schedMobileDay(-1)">‹</button>' +
      '<div class="sched-mobile-day-label">' +
        mobileDay.toLocaleDateString('en-US', { weekday: 'long' }) +
        ' <em>' + mobileDay.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</em>' +
      '</div>' +
      '<button class="btn btn-icon" onclick="schedMobileDay(1)">›</button>' +
    '</div>';

    return '' +
      '<div class="sched-header">' +
        '<div>' +
          '<div class="sched-title">' + monthLabel.split(' ')[0] + ' <em>' + monthLabel.split(' ')[1] + '</em></div>' +
          '<div style="font-family: \'JetBrains Mono\', monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;">' + weekRangeLabel + '</div>' +
        '</div>' +
        '<div class="sched-nav">' +
          '<button class="btn btn-icon" onclick="schedNav(-1)">‹</button>' +
          '<button class="btn" onclick="schedToday()">This week</button>' +
          '<button class="btn btn-icon" onclick="schedNav(1)">›</button>' +
          '<button class="btn primary" onclick="openSchedModalAt()" style="margin-left:6px">+ Add event</button>' +
        '</div>' +
      '</div>' +
      mobilePager +
      legend +
      '<div class="sched-grid-wrap">' +
        headers +
        '<div class="sched-body">' +
          '<div class="sched-grid">' +
            gridRows +
            eventBlocks +
            nowLine +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function formatTime12(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const ampm = h < 12 ? 'a' : 'p';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    const mStr = m === 0 ? '' : ':' + String(m).padStart(2, '0');
    return h12 + mStr + ampm;
  }

    const d = new Date(state.weekDate);
    d.setDate(d.getDate() + dir * 7);
    state.weekDate = d;

    setTimeout(() => {
      const body = document.querySelector('.sched-body');
      if (body) body.scrollTop = 8 * 48;
    }, 50);
  };

    state.weekDate = new Date();
    state.mobileScheduleDay = new Date().getDay();
    render();

      if (body) body.scrollTop = 8 * 48;
    }, 50);

  // -------- Schedule event modal --------

  window.openSchedModalAt = function(dateStr, timeStr) {
    state.editingSchedId = null;
    state.editingSchedInstanceDate = null;
    state.editingSched = { weekdays: [], recurrence: 'once' };

    document.getElementById('schedModalTitle').innerHTML = 'New <em>event</em>';
    document.getElementById('schedModalSub').textContent = 'Block off your time';
    document.getElementById('deleteSchedBtn').style.display = 'none';
    document.getElementById('schedTitle').value = '';
    document.getElementById('schedLocation').value = '';
    document.getElementById('schedNotes').value = '';

    // Pre-fill date/time from click context if given
    const baseDate = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
    const dateInput = isoDate(baseDate);
    document.getElementById('schedOnceDate').value = dateInput;
    document.getElementById('schedStartDate').value = dateInput;
    const untilDefault = new Date(baseDate);
    untilDefault.setMonth(untilDefault.getMonth() + 4);
    document.getElementById('schedUntilDate').value = isoDate(untilDefault);

    document.getElementById('schedStart').value = timeStr || '09:00';
    // Default end = start + 1 hour
    const startMins = hmToMinutes(timeStr || '09:00');
    const endMins = startMins + 60;
    const eh = String(Math.floor(endMins / 60) % 24).padStart(2, '0');
    const em = String(endMins % 60).padStart(2, '0');
    document.getElementById('schedEnd').value = eh + ':' + em;

    state.editingSched.weekdays = [baseDate.getDay()];

    renderSchedRecurChips();
    renderSchedWeekdayChips();
    updateSchedRecurVisibility();

    document.getElementById('schedModal').classList.add('active');
    setTimeout(() => document.getElementById('schedTitle').focus(), 50);
  };

  window.openSchedModalEdit = function(eventId, instanceDate) {
    const ev = state.scheduleEvents.find(e => e.id === eventId);
    if (!ev) return;

    // If recurring, ask "this one or all?" first
    if (ev.recurrence === 'weekly') {
      state._pendingEditEvent = ev;
      state._pendingEditInstance = instanceDate;
      document.getElementById('recurChoiceTitle').textContent = 'Edit recurring event';
      document.getElementById('recurChoiceSub').textContent = 'This event repeats weekly. What do you want to change?';
      document.getElementById('recurChoiceModal').classList.add('active');
      return;
    }
    openSchedModalForReal(ev, instanceDate, false);
  };

  window.recurChoicePicked = function(choice) {
    closeRecurChoice();
    const ev = state._pendingEditEvent;
    const inst = state._pendingEditInstance;
    if (!ev) return;
    if (choice === 'one') {
      openSchedModalForReal(ev, inst, true);  // editing exception
    } else {
      openSchedModalForReal(ev, inst, false);
    }
  };

  window.closeRecurChoice = function() {
    document.getElementById('recurChoiceModal').classList.remove('active');
  };

  function openSchedModalForReal(ev, instanceDate, isExceptionEdit) {
    state.editingSchedId = ev.id;
    state.editingSchedInstanceDate = isExceptionEdit ? instanceDate : null;

    // If editing an exception, surface the resolved (overridden) fields
    const resolved = isExceptionEdit ? resolveInstance(ev, instanceDate) : ev;
    if (!resolved) return; // skipped occurrence — shouldn't happen, can't edit it

    state.editingSched = {
      weekdays: (ev.weekdays || []).slice(),
      recurrence: isExceptionEdit ? 'once' : (ev.recurrence || 'once'),
    };

    document.getElementById('schedModalTitle').innerHTML = isExceptionEdit
      ? 'Edit <em>this occurrence</em>'
      : 'Edit <em>event</em>';
    document.getElementById('schedModalSub').textContent = isExceptionEdit
      ? 'Changing only ' + new Date(instanceDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })
      : (ev.ownerId === state.currentUser ? 'Your event' : 'Owned by another member — you can\'t edit');
    document.getElementById('deleteSchedBtn').style.display = ev.ownerId === state.currentUser ? 'inline-flex' : 'none';

    document.getElementById('schedTitle').value = resolved.title || '';
    document.getElementById('schedStart').value = resolved.startTime || '09:00';
    document.getElementById('schedEnd').value = resolved.endTime || '10:00';
    document.getElementById('schedLocation').value = resolved.location || '';
    document.getElementById('schedNotes').value = resolved.notes || '';

    if (isExceptionEdit) {
      document.getElementById('schedOnceDate').value = instanceDate;
    } else if (ev.recurrence === 'weekly') {
      document.getElementById('schedStartDate').value = ev.startDate || '';
      document.getElementById('schedUntilDate').value = ev.untilDate || '';
    } else {
      document.getElementById('schedOnceDate').value = ev.date || isoDate(new Date());
    }

    // Lock recurrence selection if not the owner
    const lockEdit = ev.ownerId !== state.currentUser;
    renderSchedRecurChips(lockEdit);
    renderSchedWeekdayChips(lockEdit);
    updateSchedRecurVisibility();

    if (lockEdit) {
      // Disable inputs
      ['schedTitle', 'schedStart', 'schedEnd', 'schedLocation', 'schedNotes', 'schedOnceDate', 'schedStartDate', 'schedUntilDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      });
    } else {
      ['schedTitle', 'schedStart', 'schedEnd', 'schedLocation', 'schedNotes', 'schedOnceDate', 'schedStartDate', 'schedUntilDate'].forEach(id => {
        const el = document.getElementById(id);

  window.toggleSchedWeekday = function(i) {
    const arr = state.editingSched.weekdays;
    const idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(i);
    renderSchedWeekdayChips();
  };

  window.saveSched = async function() {
    const title = document.getElementById('schedTitle').value.trim();
    const startTime = document.getElementById('schedStart').value;
    const endTime = document.getElementById('schedEnd').value;
    const location = document.getElementById('schedLocation').value.trim();
    const notes = document.getElementById('schedNotes').value.trim();

    if (!title) { toast('Please enter a title.', 'error'); document.getElementById('schedTitle').focus(); return; }
    if (!startTime || !endTime) { toast('Please pick start and end times.', 'error'); return; }
    if (hmToMinutes(endTime) <= hmToMinutes(startTime)) {
      toast('End time must be after start time.', 'error');
      return;
    }

    const isExceptionEdit = !!state.editingSchedInstanceDate;

    if (isExceptionEdit) {
      // Apply or update an exception for the editing instance date
      const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
      if (!ev) { toast('Original event not found.', 'error'); return; }
      ev.exceptions = ev.exceptions || {};
      ev.exceptions[state.editingSchedInstanceDate] = {
        title, startTime, endTime, location, notes,
      };
      ev.updatedAt = Date.now();
      await persist('schedule_events', state.scheduleEvents);
      toast('Updated just this occurrence', 'success');
      closeSchedModal();
      render();
      return;
    }

    if (state.editingSched.recurrence === 'weekly') {
      if (state.editingSched.weekdays.length === 0) {
        toast('Pick at least one weekday.', 'error');
        return;
      }
    }

    if (state.editingSchedId) {
      // Editing whole series
      const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
      if (!ev) { toast('Event not found.', 'error'); return; }
      if (ev.ownerId !== state.currentUser) {
        toast('You can only edit your own events.', 'error');
        return;
      }
      ev.title = title;
      ev.startTime = startTime;
      ev.endTime = endTime;
      ev.location = location;
      ev.notes = notes;
      ev.recurrence = state.editingSched.recurrence;
      if (state.editingSched.recurrence === 'weekly') {
        ev.weekdays = state.editingSched.weekdays.slice();
        ev.startDate = document.getElementById('schedStartDate').value;
        ev.untilDate = document.getElementById('schedUntilDate').value || null;
        delete ev.date;
      } else {
        ev.date = document.getElementById('schedOnceDate').value;
        delete ev.weekdays;
        delete ev.startDate;
        delete ev.untilDate;
      }
      ev.updatedAt = Date.now();
    } else {
      // Creating new
      const newEv = {
        id: 'se_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        ownerId: state.currentUser,
        title, startTime, endTime, location, notes,
        recurrence: state.editingSched.recurrence,
        exceptions: {},
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      if (state.editingSched.recurrence === 'weekly') {
        newEv.weekdays = state.editingSched.weekdays.slice();
        newEv.startDate = document.getElementById('schedStartDate').value;
        newEv.untilDate = document.getElementById('schedUntilDate').value || null;
      } else {
        newEv.date = document.getElementById('schedOnceDate').value;
      }
      state.scheduleEvents.push(newEv);
    }
    await persist('schedule_events', state.scheduleEvents);
    toast('Saved', 'success');
    closeSchedModal();
    render();
  };

  window.deleteCurrentSched = async function() {
    if (!state.editingSchedId) return;
    const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
    if (!ev) return;
    if (ev.ownerId !== state.currentUser) {
      toast('You can only delete your own events.', 'error');
      return;
    }
    if (state.editingSchedInstanceDate) {
      // Deleting just this occurrence — mark as exception null (skip)
      if (!confirm('Skip just this occurrence of "' + ev.title + '"?')) return;
      ev.exceptions = ev.exceptions || {};
      ev.exceptions[state.editingSchedInstanceDate] = null;
      ev.updatedAt = Date.now();
      await persist('schedule_events', state.scheduleEvents);
      toast('Skipped this occurrence', 'default');
    } else {
      if (!confirm('Delete the entire ' + (ev.recurrence === 'weekly' ? 'recurring series' : 'event') + '? This cannot be undone.')) return;
      state.scheduleEvents = state.scheduleEvents.filter(e => e.id !== state.editingSchedId);
      await persist('schedule_events', state.scheduleEvents);
      toast('Deleted', 'default');
    }
    closeSchedModal();
    render();
  };

  // ============================================================
  // CONFLICT DETECTION (for rush event modal)
  // ============================================================
  // Given a date string (YYYY-MM-DD) and start/end time strings,
  // returns an array of {memberName, eventTitle, timeRange} conflicts.
  function detectConflicts(dateStr, startTime, endTime) {
    if (!dateStr || !startTime || !endTime) return [];
    const startMin = hmToMinutes(startTime);
    const endMin = hmToMinutes(endTime);
    if (endMin <= startMin) return [];
    const d = new Date(dateStr + 'T00:00:00');
    const ranges = expandSchedule(d, d);

    const conflicts = [];
    for (const r of ranges) {
      if (r.startMin < endMin && r.endMin > startMin) {
        const owner = MEMBERS.find(m => m.id === r.event.ownerId);
        conflicts.push({
          memberName: owner ? owner.name : 'Someone',
          memberColor: owner ? owner.color : '#6B7280',
          eventTitle: r.title,
          timeRange: formatTime12(r.startMin) + ' – ' + formatTime12(r.endMin),
        });
      }
    }
    return conflicts;
  }

  function renderConflictsArea() {
    const area = document.getElementById('eventConflictArea');
    if (!area) return;
    const dateStr = document.getElementById('eventDate').value;
    const startTime = document.getElementById('eventStart').value;
    const endTime = document.getElementById('eventEnd').value;
    const conflicts = detectConflicts(dateStr, startTime, endTime);
    if (conflicts.length === 0) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = '<div class="conflict-banner">' +
      '<div class="conflict-banner-title">⚠ Schedule conflicts</div>' +
      '<div class="conflict-list">' +
        conflicts.map(c =>
          '<div class="conflict-item">' +
            '<span class="conflict-item-name" style="color:' + c.memberColor + '">' + escapeHtml(c.memberName) + '</span>' +
            ' is not available — <em>' + escapeHtml(c.eventTitle) + '</em> (' + c.timeRange + ')' +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>';
  }

  // Hook conflict detection to rush event modal inputs (wired up after openEventModal opens)
  function attachConflictListeners() {
    ['eventDate', 'eventStart', 'eventEnd'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.removeEventListener('input', renderConflictsArea);
      el.addEventListener('input', renderConflictsArea);
      el.removeEventListener('change', renderConflictsArea);
      el.addEventListener('change', renderConflictsArea);
    });
  }

  // ============================================================
  // UTILS
  // ============================================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    const day = Math.floor(hr / 24);
    if (day < 7) return day + 'd ago';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function toDateInputValue(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  function toTimeInputValue(d) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function eventEndTime(e) { return new Date(e.endISO || e.startISO).getTime(); }

  function formatEventShort(e) {
    if (!e.hasTime) return e.title;
    const d = new Date(e.startISO);
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(':00', '').toLowerCase().replace(' ', '');
    return timeStr + ' ' + e.title;
  }

  function formatEventTime(e) {
    const d = new Date(e.startISO);
    const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (!e.hasTime) return dateStr.toUpperCase();
    const startStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let timeStr = startStr;
    if (e.endISO) {
      const endStr = new Date(e.endISO).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      timeStr = startStr + ' – ' + endStr;
    }
    return (dateStr + ' · ' + timeStr).toUpperCase();
  }

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      state.editingNoteId = null;

      state.editingSchedId = null;

    }

      if (document.getElementById('noteModal').classList.contains('active')) { e.preventDefault(); saveNote(); }
      else if (document.getElementById('eventModal').classList.contains('active')) { e.preventDefault(); saveEvent(); }
      else if (document.getElementById('taskModal').classList.contains('active')) { e.preventDefault(); saveTask(); }
      else if (document.getElementById('candidateModal').classList.contains('active')) { e.preventDefault(); saveCandidate(); }
      else if (document.getElementById('schedModal').classList.contains('active')) { e.preventDefault(); saveSched(); }

  // ============================================================
  // BROTHERS  (Phase 0, chair-facing only)
  //
  // Bypasses the Storage(key)->JSONB-blob layer used by the other
  // entities, because public.brothers has real typed columns
  // (psu_id, demographics, etc.) -- querying by structured fields
  // is the whole point of having that schema.
  //
  // Demographics (gender, ethnicity, hometown_*, international) are
  // rendered ONLY inside renderBrotherProfile below. Do NOT factor
  // that block out into a reusable component -- when nametags or the
  // demographic flyer ship, they will query a brothers_public view
  // that excludes demographics at the SELECT layer.
  // ============================================================
  async function loadBrothers() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('brothers')
        .select('id, psu_id, first_name, last_name, preferred_name, pronouns, psu_email, personal_email, phone, status, pledge_class, pledge_class_code, role, gender, ethnicity, hometown_city, hometown_state, international, major_primary, major_secondary, minor_primary, minor_secondary, year_in_school, semester_number, contact_preference, address, birthday, internal_notes, verified_at')
        .order('last_name', { ascending: true, nullsFirst: false })
        .order('first_name', { ascending: true, nullsFirst: false });
      if (error) throw error;
      state.brothers = data || [];
      state.brothersLoaded = true;
    } catch (e) {
      console.error('loadBrothers failed', e);
      state.brothers = [];
      state.brothersLoaded = true;
    }
  }

  // ============================================================
  // v1.1 — ROLE CATEGORIZATION (replaces the previous isExecRole regex,
  // which over-matched "Rush Chair" and "THON Chair" into exec). Exec is
  // now an exact-match whitelist. Rush = Rush Chair + PM. Chairs = every
  // other non-null role; Rush Chair also appears here per locked decision.
  // Brothers = role IS NULL.
  // ============================================================
  const ROLE_CATEGORIES = {
    exec:   ['President', 'VPF', 'VPO', 'VPP', 'VPCC', 'VPM', 'Secretary'],
    rush:   ['Rush Chair', 'PM'],
    chairs: ['Rush Chair', 'DPE', 'DPA', 'Nib Ed', 'THON Chair', 'THON FR',
             'Director of Database', 'FDC', 'PR', 'Merch', 'Social',
             'Bylaws', 'Special Events', 'Webmaster', 'DEI', 'Housing',
             'Philanthropic', 'Professional'],
  };

  function categorize(role) {
    if (!role) return 'brothers';
    if (ROLE_CATEGORIES.exec.indexOf(role) !== -1)   return 'exec';
    if (ROLE_CATEGORIES.rush.indexOf(role) !== -1)   return 'rush';
    if (ROLE_CATEGORIES.chairs.indexOf(role) !== -1) return 'chairs';
    return 'chairs';  // unknown non-null role -> chairs (safer than hiding)
  }

  function roleBadgeClass(role) {
    if (role === 'PM') return 'role-pm';
    if (categorize(role) === 'exec') return 'role-exec';
    return '';
  }

  // Back-compat: isExecRole retained as a thin alias in case any future
  // chat reintroduces a caller. Always prefer categorize() / roleBadgeClass().
  function isExecRole(r) { return categorize(r) === 'exec'; }

  function renderBrothers() {
    const f = state.brotherFilter;
    const all = state.brothers;
    const pcCodes = Array.from(new Set(all.map(b => b.pledge_class_code).filter(Boolean))).sort();

    const filtered = all.filter(b => {
      if (f.pc !== 'all' && b.pledge_class_code !== f.pc) return false;
      // v1.1: 4-way role categorization
      if (f.role === 'exec'     && categorize(b.role) !== 'exec') return false;
      if (f.role === 'rush'     && ROLE_CATEGORIES.rush.indexOf(b.role)   === -1) return false;
      if (f.role === 'chairs'   && ROLE_CATEGORIES.chairs.indexOf(b.role) === -1) return false;
      if (f.role === 'brothers' && b.role) return false;
      if (f.status !== 'all' && (b.status || 'active') !== f.status) return false;
      if (f.search) {
        const q = f.search.trim().toLowerCase();
        const hay = [b.first_name, b.last_name, b.preferred_name, b.psu_id, b.major_primary, b.address]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    return '' +
      '<div class="brothers-toolbar">' +
        '<input type="search" class="field-input search" placeholder="Search name, PSU ID, major, address..." ' +
          'value="' + escapeHtml(f.search) + '" oninput="setBrotherFilter(\'search\', this.value)">' +
        '<select class="field-select" onchange="setBrotherFilter(\'pc\', this.value)">' +
          '<option value="all"' + (f.pc === 'all' ? ' selected' : '') + '>All pledge classes</option>' +
          pcCodes.map(c => '<option value="' + escapeHtml(c) + '"' + (f.pc === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>').join('') +
        '</select>' +
        '<select class="field-select" onchange="setBrotherFilter(\'role\', this.value)">' +
          '<option value="all"'      + (f.role === 'all'      ? ' selected' : '') + '>All roles</option>' +
          '<option value="exec"'     + (f.role === 'exec'     ? ' selected' : '') + '>Exec</option>' +
          '<option value="rush"'     + (f.role === 'rush'     ? ' selected' : '') + '>Rush</option>' +
          '<option value="chairs"'   + (f.role === 'chairs'   ? ' selected' : '') + '>Chairs</option>' +
          '<option value="brothers"' + (f.role === 'brothers' ? ' selected' : '') + '>Brothers</option>' +
        '</select>' +
        // v1.1: status filter UI removed — defaults to 'active', state field retained for future alumni surfacing.
        '<span class="brothers-count">' + filtered.length + ' of ' + all.length + '</span>' +
      '</div>' +
      (!state.brothersLoaded
        ? '<div class="empty-state"><div class="ornament">◍</div><div style="font-family:\'Playfair Display\',serif; font-size:20px; font-style:italic;">Loading the chapter...</div></div>'
        : filtered.length === 0
          ? '<div class="empty-state"><div class="ornament">◍</div>' +
              '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; margin-bottom:8px;">No brothers match these filters</div>' +
              '<div style="font-size:13px;">Loosen a filter or clear the search.</div>' +
            '</div>'
          : renderBrothersTable(filtered));
  }

  function renderBrothersTable(rows) {
    return '<table class="brothers-table">' +
      '<thead><tr>' +
        '<th>Name</th><th>PSU ID</th><th>Pledge class</th><th>Role</th><th>Status</th><th>Major</th>' +
      '</tr></thead><tbody>' +
      rows.map(b => {
        const nameRaw = ((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')).trim();
        const name = nameRaw ? escapeHtml(nameRaw) : '<span style="color:var(--fg-muted)">(unnamed)</span>';
        const roleBadge = b.role
          ? '<span class="brother-badge ' + (roleBadgeClass(b.role)) + '">' +
              escapeHtml(b.role) +
              (b.role === 'PM' ? ' · chair-only' : '') +
            '</span>'
          : '';
        const status = b.status || 'unknown';
        return '<tr onclick="openBrotherModal(\'' + b.id + '\')">' +
          '<td class="brother-name">' + name + '</td>' +
          '<td class="brother-psu">' + escapeHtml(b.psu_id || '—') + '</td>' +
          '<td>' + escapeHtml(b.pledge_class || '—') + '</td>' +
          '<td>' + roleBadge + '</td>' +
          '<td><span class="brother-badge status-' + status + '">' + status + '</span></td>' +
          '<td>' + escapeHtml(b.major_primary || '—') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table>';
  }

  function renderBrotherProfileRow(key, value, opts) {
    if (value === null || value === undefined || value === '') return '';
    const tag = opts && opts.tag ? ' <span class="chair-only-tag">' + opts.tag + '</span>' : '';
    return '<div class="brother-profile-row">' +
      '<div class="key">' + escapeHtml(key) + '</div>' +
      '<div>' + escapeHtml(String(value)) + tag + '</div>' +
    '</div>';
  }

  function renderBrotherProfile(b) {
    // Demographics block is rendered INLINE here, intentionally not
    // factored into a reusable helper. PNM-facing slices must query
    // a brothers_public view that excludes these columns.
    const hasDemographics = b.gender || b.ethnicity || b.hometown_city || b.hometown_state || b.international != null;
    const demoBlock = hasDemographics
      ? '<div class="brother-demographics-block">' +
          '<div class="demographics-label">demographics · chair-only</div>' +
          renderBrotherProfileRow('Gender', b.gender) +
          renderBrotherProfileRow('Ethnicity', b.ethnicity) +
          renderBrotherProfileRow('Hometown', [b.hometown_city, b.hometown_state].filter(Boolean).join(', ')) +
          renderBrotherProfileRow('International', b.international === true ? 'yes' : b.international === false ? 'no' : null) +
        '</div>'
      : '';

    const internalNotesBlock = b.internal_notes
      ? '<div class="brother-internal-notes"><strong>Internal notes:</strong> ' + escapeHtml(b.internal_notes) + '</div>'
      : '';

    const verifiedDisplay = b.verified_at
      ? new Date(b.verified_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : 'never';

    return '' +
      renderBrotherProfileRow('PSU ID', b.psu_id) +
      renderBrotherProfileRow('Pronouns', b.pronouns) +
      renderBrotherProfileRow('PSU email', b.psu_email) +
      renderBrotherProfileRow('Personal email', b.personal_email) +
      renderBrotherProfileRow('Phone', b.phone) +
      renderBrotherProfileRow('Pledge class', b.pledge_class) +
      renderBrotherProfileRow('Role', b.role, b.role === 'PM' ? { tag: 'hidden on PNM views' } : null) +
      renderBrotherProfileRow('Status', b.status) +
      renderBrotherProfileRow('Major', [b.major_primary, b.major_secondary].filter(Boolean).join(' / ')) +
      renderBrotherProfileRow('Minor', [b.minor_primary, b.minor_secondary].filter(Boolean).join(' / ')) +
      renderBrotherProfileRow('Year', b.year_in_school) +
      renderBrotherProfileRow('Semester #', b.semester_number) +
      renderBrotherProfileRow('Contact pref', b.contact_preference) +
      renderBrotherProfileRow('Address', b.address) +
      renderBrotherProfileRow('Birthday', b.birthday) +
      renderBrotherProfileRow('Verified', verifiedDisplay) +
      renderNametagHistoryRow(b.id) +
      demoBlock +
      internalNotesBlock;
  }

  window.setBrotherFilter = function(key, value) {
    state.brotherFilter = Object.assign({}, state.brotherFilter, { [key]: value });
    render();
    if (key === 'search') {
      const el = document.querySelector('.brothers-toolbar .search');

  window.openBrotherModal = function(id) {

    document.getElementById('brotherModalTitle').textContent = display;

    document.getElementById('brotherModalBody').innerHTML = renderBrotherProfile(b);

  };

  window.closeBrotherModal = function() {
    document.getElementById('brotherModal').classList.remove('active');
    state.viewingBrotherId = null;

  // ============================================================
  // NAMETAGS  (Phase 0 item #2, chair-facing only)
  //
  // Three things working together:
  //   1. NAMETAG_ROLE_WHITELIST -- single source of truth for which
  //      roles surface on PNM-facing nametags. Locked decision: PM is
  //      NOT in this set, exec board + Rush Chair only.
  //   2. NAMETAG_TEMPLATES -- JSON-driven card layouts. Add a key to
  //      ship a new template; no renderer changes needed.
  //   3. renderNametagCardHTML -- one function produces the card DOM
  //      used for BOTH the live preview AND the html2canvas snapshot
  //      fed into jsPDF. No drift between what you see and what prints.

  // ----- Data -----
  async function loadNametagPrints() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('nametag_prints')
        .select('id, brother_id, event_label, template_name, printed_at, printed_by, notes')
        .order('printed_at', { ascending: false });
      if (error) throw error;
      state.nametagPrints = data || [];
      state.nametagPrintsLoaded = true;
    } catch (e) {
      console.error('loadNametagPrints failed', e);
      state.nametagPrints = [];
      state.nametagPrintsLoaded = true;
    }
  }

  async function recordNametagPrints(brotherIds, eventLabel, templateName) {
    if (!sb || brotherIds.length === 0) return;
    const rows = brotherIds.map(id => ({
      brother_id: id,
      event_label: eventLabel,
      template_name: templateName,
      printed_by: state.currentUser || null,
    }));
    const { error } = await sb.from('nametag_prints').insert(rows);
    if (error) {
      console.error('recordNametagPrints failed', error);
      toast('Saved PDF but failed to log prints — check console.', 'error');
      return;
    }
    await loadNametagPrints();
  }

  // ----- Helpers -----
  // v1.1: unit conversion for custom dimensions input.
  function toInches(val, unit) {
    var n = Number(val);
    if (!isFinite(n) || n <= 0) return 0;
    if (unit === 'cm') return n / 2.54;
    if (unit === 'ft') return n * 12;
    if (unit === 'm')  return n * 39.3700787;
    return n;  // 'in' default
  }

  function getActiveDimensions() {
    const ov = state.nametagOverrides;
    const base = AVERY_PRESETS[ov.averyPreset] || AVERY_PRESETS['5395'];
    if (ov.averyPreset === 'custom' && ov.dimensions) {
      const wIn = toInches(ov.dimensions.w, ov.dimensionUnit);
      const hIn = toInches(ov.dimensions.h, ov.dimensionUnit);
      // Auto-calc cols/rows so a 4x6 index card doesn't get jammed into a 2x4 layout.
      // Page dims and margins come from the 5395 base; chairs printing on letter
      // paper get sensible counts. Custom paper sizes are v1.2.
      const usableW = base.pageW - 2 * base.marginLeft;
      const usableH = base.pageH - 2 * base.marginTop;
      const cols = wIn > 0 ? Math.max(1, Math.floor(usableW / wIn)) : 1;
      const rows = hIn > 0 ? Math.max(1, Math.floor(usableH / hIn)) : 1;
      // Recompute card gaps so the remaining slack is distributed evenly.
      const cardGapX = cols > 1 ? Math.max(0, (usableW - cols * wIn) / (cols - 1)) : 0;
      const cardGapY = rows > 1 ? Math.max(0, (usableH - rows * hIn) / (rows - 1)) : 0;
      return Object.assign({}, base, { cardW: wIn, cardH: hIn, cols: cols, rows: rows, cardGapX: cardGapX, cardGapY: cardGapY });
    }
    return base;
  }

  function getDisplayName(b, style) {
    // v1.1: 7 styles. `f` honors preferred_name when set; `fOriginal` keeps
    // the legal first name so styles that explicitly want both (nickname-
    // style, initials-only) can access it.
    const f = b.preferred_name || b.first_name || '';
    const fOriginal = b.first_name || '';
    const l = b.last_name || '';
    switch (style) {
      case 'first':              return f;
      case 'preferred':          return b.preferred_name || fOriginal;
      case 'full-name':          return f + (l ? ' ' + l : '');
      case 'last-only':          return l;
      case 'initials-only':
        return (fOriginal[0] ? fOriginal[0] + '.' : '') + (l[0] ? l[0] + '.' : '');
      case 'nickname-style':
        if (b.preferred_name && b.preferred_name !== b.first_name) {
          return fOriginal + ' \u201c' + b.preferred_name + '\u201d' + (l ? ' ' + l : '');
        }
        return fOriginal + (l ? ' ' + l : '');
      case 'first-last-initial':
      default:                   return f + (l ? ' ' + l[0] + '.' : '');
    }
  }

  function isPrintedForEvent(brotherId, label) {
    const target = (label || '').trim();
    if (!target) return false;
    return state.nametagPrints.some(p => p.brother_id === brotherId && p.event_label === target);
  }

  function getNametagPrintsForBrother(brotherId) {
    return state.nametagPrints.filter(p => p.brother_id === brotherId);
  }

  function getKnownEventLabels() {
    const set = new Set(state.nametagPrints.map(p => p.event_label).filter(Boolean));
    return Array.from(set).sort();
  }

  function getNametagFilteredBrothers() {
    const f = state.nametagFilter;
    return state.brothers.filter(b => {
      if (f.pc !== 'all' && b.pledge_class_code !== f.pc) return false;
      // v1.1: 4-way role categorization
      if (f.role === 'exec'     && categorize(b.role) !== 'exec') return false;
      if (f.role === 'rush'     && ROLE_CATEGORIES.rush.indexOf(b.role)   === -1) return false;
      if (f.role === 'chairs'   && ROLE_CATEGORIES.chairs.indexOf(b.role) === -1) return false;
      if (f.role === 'brothers' && b.role) return false;
      if (f.status !== 'all' && (b.status || 'active') !== f.status) return false;
      if (f.search) {
        const q = f.search.trim().toLowerCase();
        const hay = [b.first_name, b.last_name, b.preferred_name, b.psu_id, b.major_primary]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function getNametagPrintPlan() {
    // Real-time plan: drives the generate-bar count display, not just executed at PDF time.
    const label = state.nametagEventLabel.trim();
    const toPrint = [];
    const skipped = [];
    state.nametagSelected.forEach(id => {
      if (label && isPrintedForEvent(id, label) && !state.nametagReprint.has(id)) skipped.push(id);
      else toPrint.push(id);
    });
    return { toPrint, skipped };
  }

  // Redesign: the preview pager cycles through selected brothers when any are
  // selected, otherwise the filtered set. Single source of truth for both the
  // preview pane and the prev/next handler.
  function getNametagPreviewPool() {
    var selectedIds = Array.from(state.nametagSelected);
    if (selectedIds.length) {
      return selectedIds
        .map(function(id){ return state.brothers.find(function(b){ return b.id === id; }); })
        .filter(Boolean);
    }
    return getNametagFilteredBrothers();
  }

  // ----- Card renderer (single source of truth) -----
  function renderNametagCardHTML(brother, templateKey) {
    // Redesign: templateKey defaults to the active template, so existing call
    // sites (renderNametagCardHTML(b)) keep working. The template strip passes
    // an explicit key to render each template's miniature.
    const tmpl = NAMETAG_TEMPLATES[templateKey || state.nametagTemplate] || NAMETAG_TEMPLATES['generic'];
    const ov = state.nametagOverrides;
    const dims = getActiveDimensions();
    const bg = ov.bgColor || tmpl.bg;
    const accent = ov.accentColor || tmpl.accent;
    const accentSec = tmpl.accentSecondary || accent;
    const nameStyle = ov.nameStyle || tmpl.nameStyle;
    // v1.1: font override (section 4)
    const nameFont = ov.nameFont || tmpl.nameFont;
    const roleVisible = ov.roleVisible === 'hide' ? false : shouldShowRoleOnNametag(brother.role);

    const displayName = getDisplayName(brother, nameStyle);
    const pc = brother.pledge_class_code || '';
    const role = roleVisible ? brother.role : '';
    const meta = [pc, role].filter(Boolean).join(' \u00b7 ');

    // v1.1: 7 accentStyle variants (4 new — hairline-border, split-corners,
    // header-band, border-frame). Padding adjusted per variant so name + meta
    // never collide with decorative regions.
    let accentEl = '';
    let padding = '0.35in 0.3in 0.3in';
    if (tmpl.accentStyle === 'top-stripe') {
      accentEl = '<div style="position:absolute; top:0; left:0; right:0; height:0.18in; background:' + accent + ';"></div>';
    } else if (tmpl.accentStyle === 'left-bar') {
      accentEl = '<div style="position:absolute; top:0; bottom:0; left:0; width:0.16in; background:' + accent + ';"></div>';
      padding = '0.25in 0.3in 0.25in 0.45in';
    } else if (tmpl.accentStyle === 'hairline-border') {
      accentEl = '<div style="position:absolute; inset:0; border:1px solid ' + accent + '; border-radius:2px; pointer-events:none;"></div>';
    } else if (tmpl.accentStyle === 'split-corners') {
      accentEl = '<div style="position:absolute; top:0; left:0; width:0.7in; height:0.18in; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; bottom:0; right:0; width:0.7in; height:0.18in; background:' + accentSec + ';"></div>';
    } else if (tmpl.accentStyle === 'header-band') {
      accentEl = '<div style="position:absolute; top:0; left:0; right:0; height:0.36in; background:' + accent + ';' +
                 ' display:flex; align-items:center; justify-content:center;' +
                 ' color:#FFFFFF; font-family:' + tmpl.metaFont + '; font-size:0.14in;' +
                 ' letter-spacing:0.22em;">\u0391\u039a\u03a8</div>';
      padding = '0.55in 0.3in 0.3in';
    } else if (tmpl.accentStyle === 'border-frame') {
      accentEl = '<div style="position:absolute; inset:0.08in; border:0.02in double ' + accent + '; pointer-events:none;"></div>';
      padding = '0.4in 0.32in 0.36in';
    } else if (tmpl.accentStyle === 'double-rule') {
      // Editorial: two thin hairlines framing the name, top and bottom.
      accentEl = '<div style="position:absolute; top:0.24in; left:0.5in; right:0.5in; height:0.015in; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; bottom:0.24in; left:0.5in; right:0.5in; height:0.015in; background:' + accent + ';"></div>';
      padding = '0.42in 0.3in 0.42in';
    } else if (tmpl.accentStyle === 'side-rails') {
      // Two vertical rails (accent left, secondary right) hugging the edges.
      accentEl = '<div style="position:absolute; top:0.18in; bottom:0.18in; left:0.17in; width:0.025in; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; top:0.18in; bottom:0.18in; right:0.17in; width:0.025in; background:' + accentSec + ';"></div>';
      padding = '0.3in 0.44in';
    } else if (tmpl.accentStyle === 'corner-ticks') {
      // L-shaped brackets in two opposite corners — formal, framed feel.
      var ct = '0.025in', cl = '0.3in', co = '0.13in';
      accentEl = '<div style="position:absolute; top:' + co + '; left:' + co + '; width:' + cl + '; height:' + ct + '; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; top:' + co + '; left:' + co + '; width:' + ct + '; height:' + cl + '; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; bottom:' + co + '; right:' + co + '; width:' + cl + '; height:' + ct + '; background:' + accent + ';"></div>' +
                 '<div style="position:absolute; bottom:' + co + '; right:' + co + '; width:' + ct + '; height:' + cl + '; background:' + accent + ';"></div>';
      padding = '0.36in 0.36in';
    } else {  // 'bottom-line' (default / generic)
      accentEl = '<div style="position:absolute; bottom:0; left:0.4in; right:0.4in; height:0.04in; background:' + accent + ';"></div>';
    }
    const nameSize = (nameStyle === 'first' || nameStyle === 'last-only') ? '0.65in' :
                     (nameStyle === 'initials-only')                       ? '0.85in' :
                                                                              '0.5in';

    // v1.1: event-on-card overlay (section 7). Bottom-left, low opacity, in
    // meta font. Only renders when checkbox is on AND an event label is set.
    const eventOverlay = (ov.showEventOnCard && state.nametagEventLabel && state.nametagEventLabel.trim())
      ? '<div style="position:absolute; bottom:0.12in; left:0.18in;' +
          ' font-family:' + tmpl.metaFont + '; font-size:0.08in;' +
          ' letter-spacing:0.18em; text-transform:uppercase;' +
          ' color:' + accent + '; opacity:0.45;">' + escapeHtml(state.nametagEventLabel.trim()) + '</div>'
      : '';

    return '<div class="nametag-card" style="position:relative;' +
      ' width:' + dims.cardW + 'in; height:' + dims.cardH + 'in;' +
      ' background:' + bg + '; box-sizing:border-box;' +
      ' padding:' + padding + ';' +
      ' display:flex; flex-direction:column; justify-content:center; align-items:center;' +
      ' text-align:center; font-family:' + tmpl.metaFont + '; color:' + accent + '; overflow:hidden;">' +
      accentEl +
      '<div style="font-family:' + nameFont + '; font-weight:' + tmpl.nameWeight + ';' +
      ' font-size:' + nameSize + '; line-height:1; letter-spacing:-0.01em;' +
      ' color:#0F1419; margin-bottom:0.08in;">' + escapeHtml(displayName) + '</div>' +
      '<div style="font-size:0.13in; letter-spacing:0.15em; text-transform:uppercase; color:' + accent + ';">' +
      escapeHtml(meta) + '</div>' +
      (tmpl.showAkpsi
        ? '<div style="position:absolute; bottom:0.12in; right:0.18in;' +
          ' font-family:' + tmpl.metaFont + '; font-size:0.1in;' +
          ' letter-spacing:0.2em; color:' + accent + '; opacity:0.7;">\u0391\u039a\u03a8</div>'
        : '') +
      eventOverlay +
    '</div>';
  }

  // ----- View rendering -----
  // ============================================================
  // 8. PRINT HISTORY SUB-NAV  (v1.1)
  // ============================================================
  // renderNametagsView becomes a dispatcher between two sub-views.
  // Generate = the existing UI (template strip, overrides, picker, preview).
  // History  = read-only print log grouped by event_label.
  // Both share state.nametagSubview; defaults to 'generate'.
  function renderNametagsView() {
    var sub = state.nametagSubview || 'generate';
    return '<div class="nametag-subnav">' +
      '<button class="subnav-tab' + (sub === 'generate' ? ' active' : '') + '" onclick="setNametagSubview(\'generate\')">Generate</button>' +
      '<button class="subnav-tab' + (sub === 'history' ? ' active' : '') + '" onclick="setNametagSubview(\'history\')">Print History</button>' +
    '</div>' +
    (sub === 'history' ? renderNametagHistoryView() : renderNametagGenerateView());
  }

  function renderNametagGenerateView() {
    return '<div class="nametag-layout">' +
      '<div class="nametag-picker-pane">' +
        renderNametagTemplateStrip() +
        renderNametagOverridesPanel() +
        renderNametagPicker() +
      '</div>' +
      '<div class="nametag-preview-pane">' +
        renderNametagPreviewPane() +
        renderNametagGenerateBar() +
      '</div>' +
    '</div>';
  }

  function renderNametagHistoryView() {
    var prints = state.nametagPrints || [];
    var f = state.nametagHistoryFilter || { search: '', event_label: 'all', template_name: 'all' };

    // Filter
    var filteredPrints = prints.filter(function(p) {
      if (f.event_label !== 'all' && p.event_label !== f.event_label) return false;
      if (f.template_name !== 'all' && p.template_name !== f.template_name) return false;
      if (f.search) {
        var b = state.brothers.find(function(x) { return x.id === p.brother_id; });
        var name = b ? ((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')).trim() : '';
        var pcCode = b ? (b.pledge_class_code || '') : '';
        var hay = [name, p.event_label, pcCode, p.template_name, p.printed_by].filter(Boolean).join(' ').toLowerCase();
        if (hay.indexOf(f.search.trim().toLowerCase()) === -1) return false;
      }
      return true;
    });

    // Group by event_label
    var groups = {};
    filteredPrints.forEach(function(p) {
      if (!groups[p.event_label]) groups[p.event_label] = [];
      groups[p.event_label].push(p);
    });
    var groupKeys = Object.keys(groups).sort(function(a, b) {
      var maxA = Math.max.apply(null, groups[a].map(function(p) { return new Date(p.printed_at).getTime(); }));
      var maxB = Math.max.apply(null, groups[b].map(function(p) { return new Date(p.printed_at).getTime(); }));
      return maxB - maxA;
    });

    // Filter dropdown sources (from full prints set, not filtered)
    var allEventLabels = Array.from(new Set(prints.map(function(p) { return p.event_label; }).filter(Boolean))).sort();
    var allTemplates = Array.from(new Set(prints.map(function(p) { return p.template_name; }).filter(Boolean))).sort();

    return '<div class="nametag-history">' +
      '<div class="brothers-toolbar">' +
        '<input type="search" class="field-input search" placeholder="Search brother, event, PC, template, chair..." ' +
          'value="' + escapeHtml(f.search) + '" oninput="setNametagHistoryFilter(\'search\', this.value)">' +
        '<select class="field-select" onchange="setNametagHistoryFilter(\'event_label\', this.value)">' +
          '<option value="all"' + (f.event_label === 'all' ? ' selected' : '') + '>All events</option>' +
          allEventLabels.map(function(el) {
            return '<option value="' + escapeHtml(el) + '"' + (f.event_label === el ? ' selected' : '') + '>' + escapeHtml(el) + '</option>';
          }).join('') +
        '</select>' +
        '<select class="field-select" onchange="setNametagHistoryFilter(\'template_name\', this.value)">' +
          '<option value="all"' + (f.template_name === 'all' ? ' selected' : '') + '>All templates</option>' +
          allTemplates.map(function(tn) {
            return '<option value="' + escapeHtml(tn) + '"' + (f.template_name === tn ? ' selected' : '') + '>' + escapeHtml(tn) + '</option>';
          }).join('') +
        '</select>' +
        '<span class="brothers-count">' + filteredPrints.length + ' print' + (filteredPrints.length === 1 ? '' : 's') + '</span>' +
      '</div>' +
      (filteredPrints.length === 0
        ? '<div class="empty-state-polished">' +
            '<div class="empty-glyph">\u25c7</div>' +
            '<div class="empty-text">' + (prints.length === 0 ? 'No nametag prints yet.' : 'No prints match these filters.') + '</div>' +
          '</div>'
        : groupKeys.map(function(evLabel) {
            var entries = groups[evLabel];
            var sorted = entries.slice().sort(function(a, b) { return new Date(b.printed_at) - new Date(a.printed_at); });
            var latest = sorted[0];
            var earliest = sorted[sorted.length - 1];
            var dateRange = sorted.length === 1
              ? new Date(latest.printed_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
              : new Date(earliest.printed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' — ' +
                new Date(latest.printed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            var expanded = state.nametagHistoryExpanded && state.nametagHistoryExpanded.has(evLabel);
            var safeKey = evLabel.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
            return '<div class="history-group' + (expanded ? ' expanded' : '') + '">' +

  // ----- PDF generation -----
  async function generateNametagPDF() {
    if (!window.jspdf || !window.html2canvas) {
      toast('PDF libraries not loaded — refresh the page and try again.', 'error');
      return;
    }
    var eventLabel = state.nametagEventLabel.trim();
    if (!eventLabel) {
      toast('Set an event label before generating.', 'error');
      return;
    }
    var plan = getNametagPrintPlan();
    if (plan.toPrint.length === 0) {
      toast('Nothing to print. Select brothers, or toggle Reprint on already-printed rows.', 'error');
      return;
    }

    state.nametagGenerating = true;
    render();

    if (window.NAMETAG_DEBUG) {
      console.warn('[nametag] NAMETAG_DEBUG is on — PDF will preview only, no prints logged.');
    }

    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      var jsPDF = window.jspdf.jsPDF;
      var dims = getActiveDimensions();
      var doc = new jsPDF({ unit: 'in', format: [dims.pageW, dims.pageH], orientation: 'portrait' });
      var perPage = dims.cols * dims.rows;

      var stage = document.createElement('div');
      stage.style.cssText = 'position:absolute; left:-9999px; top:0;';
      document.body.appendChild(stage);

      for (var i = 0; i < plan.toPrint.length; i++) {
        var b = state.brothers.find(function(x) { return x.id === plan.toPrint[i]; });
        if (!b) continue;
        stage.innerHTML = renderNametagCardHTML(b);
        var cardEl = stage.firstElementChild;
        if (window.NAMETAG_DEBUG) {
          var _dbgRect = cardEl.getBoundingClientRect();
          console.log('[nametag]', i, 'cardEl rect:', _dbgRect.width.toFixed(1) + 'x' + _dbgRect.height.toFixed(1));
        }
        // eslint-disable-next-line no-await-in-loop
        var canvas = await window.html2canvas(cardEl, { scale: 3, backgroundColor: '#ffffff', logging: false, useCORS: true });
        if (window.NAMETAG_DEBUG) {
          var _dbgUrl = canvas.toDataURL('image/png');
          console.log('[nametag]', i, 'canvas:', canvas.width + 'x' + canvas.height, '· dataURL len:', _dbgUrl.length, '· prefix:', _dbgUrl.slice(0, 22));
        }
        var posInPage = i % perPage;
        if (posInPage === 0 && i > 0) doc.addPage();
        var col = posInPage % dims.cols;
        var row = Math.floor(posInPage / dims.cols);
        var x = dims.marginLeft + col * (dims.cardW + dims.cardGapX);
        var y = dims.marginTop  + row * (dims.cardH + dims.cardGapY);
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, dims.cardW, dims.cardH);
      }
      stage.remove();

      var safeLabel = eventLabel.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
      var today = new Date().toISOString().slice(0, 10);

      if (window.NAMETAG_DEBUG) {
        // Debug path: preview in new tab for visual verification. No save-to-
        // disk, no print log, no selection clear — chair can iterate freely.
        doc.output('dataurlnewwindow');
        toast('Preview opened · NAMETAG_DEBUG on, no prints logged.', 'default');
      } else {
        doc.save('nametags_' + safeLabel + '_' + today + '.pdf');
        await recordNametagPrints(plan.toPrint, eventLabel, NAMETAG_TEMPLATES[state.nametagTemplate].label);
        state.nametagSelected.clear();
        state.nametagReprint.clear();
        toast('Printed ' + plan.toPrint.length + ' nametag' + (plan.toPrint.length === 1 ? '' : 's') +
              (plan.skipped.length ? ' · skipped ' + plan.skipped.length + ' already-printed' : ''));
      }
    } catch (e) {
      console.error('PDF generation failed', e);
      toast('PDF generation failed — check console.', 'error');
    } finally {
      state.nametagGenerating = false;
      render();
    }
  }

  // ============================================================
  // PHASE 0 #4 — MASTER TO-DO LIST (parametric)
  //
  // Two new typed-table reads (task_templates, chapter_dates), one
  // Templates sub-view inside Tasks, one read-only Chapter Dates
  // editor. Generated tasks land in the existing state.tasks JSONB
  // store with a `templateId` marker — no schema change to tasks.
  //
  // Templates are READ-ONLY in v1 (CRUD ships in v1.1). Iterate seed
  // content via SQL re-runs.
  // ============================================================

  const PHASE_LABELS = {
    'pre_rush':  'Pre-rush',
    'pre_bfc':   'Pre-BFC',
    'rush_week': 'Rush week',
    'selection': 'Selection',
    'post_rush': 'Post-rush',
  };

  // Phase → primary anchor key. Used by current-phase detection.
  const PHASE_ANCHOR = {
    'pre_rush':  'soft_launch',
    'pre_bfc':   'bfc_mixer',
    'rush_week': 'rush_week_start',
    'selection': 'selection_start',
    'post_rush': null,  // trailing phase, no anchor
  };

  async function loadTaskTemplates() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('task_templates')
        .select('id, phase, title, description, days_offset, anchor_date_key, default_assignee, priority, category, created_at')
        .order('phase', { ascending: true })
        .order('days_offset', { ascending: true });
      if (error) throw error;
      state.taskTemplates = data || [];
      state.taskTemplatesLoaded = true;
    } catch (e) {
      console.error('loadTaskTemplates failed', e);
      state.taskTemplates = [];
      state.taskTemplatesLoaded = true;
    }
  }

  async function loadChapterDates() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('chapter_dates')
        .select('id, key, label, iso_date, description, updated_at, updated_by')
        .order('iso_date', { ascending: true, nullsFirst: false });
      if (error) throw error;
      state.chapterDates = data || [];
      state.chapterDatesLoaded = true;
    } catch (e) {
      console.error('loadChapterDates failed', e);
      state.chapterDates = [];
      state.chapterDatesLoaded = true;
    }
  }

  function getChapterDatesByKey() {
    const byKey = {};
    (state.chapterDates || []).forEach(function(d) { byKey[d.key] = d; });
    return byKey;
  }

  // v1.0 of #4: merges live chapter_dates with the JS fallback so a
  // fresh deploy (chapter_dates empty) still has the countdown working.
  function getDashboardDates() {
    const byKey = getChapterDatesByKey();
    function pick(fb, key) {
      const live = byKey[key];
      return {
        label: (live && live.label) || fb.label,
        iso:   (live && live.iso_date) || fb.iso,
        icon:  fb.icon,
        sub:   fb.sub,
      };
    }
    return {
      softLaunch:   pick(DASHBOARD_DATES_FALLBACK.softLaunch,   'soft_launch'),
      hardDeadline: pick(DASHBOARD_DATES_FALLBACK.hardDeadline, 'hard_deadline'),
      bfcMixer:     pick(DASHBOARD_DATES_FALLBACK.bfcMixer,     'bfc_mixer'),
    };
  }

  function computeDueDate(iso, offset) {
    if (!iso) return null;
    // iso like '2026-08-15'. Set to 23:59:59 to match existing saveTask convention.
    const d = new Date(iso + 'T23:59:59');
    d.setDate(d.getDate() + Number(offset || 0));
    return d;
  }

  function getTemplateCalculatedDue(template, byKey) {
    const anchor = byKey[template.anchor_date_key];
    if (!anchor || !anchor.iso_date) return null;
    return computeDueDate(anchor.iso_date, template.days_offset);
  }

  function findTaskForTemplate(templateId) {
    return (state.tasks || []).find(function(t) { return t.templateId === templateId; });
  }

  function getCurrentRushPhase() {
    const byKey = getChapterDatesByKey();
    let anyAnchorPinned = false;
    Object.keys(byKey).forEach(function(k) { if (byKey[k] && byKey[k].iso_date) anyAnchorPinned = true; });
    if (!anyAnchorPinned) return null;
    const order = ['pre_rush', 'pre_bfc', 'rush_week', 'selection'];
    const todayMs = Date.now();
    for (let i = 0; i < order.length; i++) {
      const akey = PHASE_ANCHOR[order[i]];
      const a = akey ? byKey[akey] : null;
      if (!a || !a.iso_date) continue;
      const aMs = new Date(a.iso_date + 'T23:59:59').getTime();
      if (todayMs <= aMs) return order[i];
    }
    return 'post_rush';
  }

  function ensureTemplatesExpansionInitialized() {
    if (state.taskTemplatesExpanded) return;
    // v2 (Diff 3): expand current phase + any phase containing overdue tasks
    const current = getCurrentRushPhase();
    const expanded = new Set(current ? [current] : []);
    const overdueByPhase = {};
    (state.tasks || []).forEach(function(t) {
      if (!t.templateId || t.status === 'done' || !t.dueISO) return;
      if (new Date(t.dueISO).getTime() >= Date.now()) return;
      const tmpl = (state.taskTemplates || []).find(function(x) { return x.id === t.templateId; });
      if (tmpl) overdueByPhase[tmpl.phase] = true;
    });
    Object.keys(overdueByPhase).forEach(function(p) { expanded.add(p); });
    state.taskTemplatesExpanded = expanded;
  }

  function getPhaseStats(phaseTemplates, byKey) {
    const stats = { total: phaseTemplates.length, generated: 0, drifted: 0, anchorless: 0 };
    phaseTemplates.forEach(function(t) {
      const calc = getTemplateCalculatedDue(t, byKey);
      if (!calc) { stats.anchorless++; return; }
      const existing = findTaskForTemplate(t.id);
      if (!existing) return;
      stats.generated++;
      if (!existing.dueISO) return;
      const taskMs = new Date(existing.dueISO).getTime();
      if (Math.abs(taskMs - calc.getTime()) > 86400000) stats.drifted++;
    });
    return stats;
  }

  // Urgency dropdown → days-offset map (matches taskUrgency tier boundaries).
  // Future = +180d ("indefinite future anchor" per spec).
  const QUICK_ADD_URGENCY_DAYS = {
    today: 0, tomorrow: 1, week: 7, thismonth: 30, laterrush: 90, future: 180
  };

  window.submitQuickAddTask = async function() {
    const titleEl    = document.getElementById('quickAddTitle');
    const urgencyEl  = document.getElementById('quickAddUrgency');
    const assigneeEl = document.getElementById('quickAddAssignee');
    const priorityEl = document.getElementById('quickAddPriority');
    const categoryEl = document.getElementById('quickAddCategory');
    if (!titleEl) return;
    const title = (titleEl.value || '').trim();
    if (!title) {
      toast('Enter a task title.', 'error');
      titleEl.focus();
      return;
    }
    const urgencyKey = urgencyEl ? urgencyEl.value : 'week';
    const days = QUICK_ADD_URGENCY_DAYS[urgencyKey] != null ? QUICK_ADD_URGENCY_DAYS[urgencyKey] : 7;
    const dueDate = new Date();
    dueDate.setDate(dueDate.getDate() + days);
    dueDate.setHours(23, 59, 59, 999);
    const dueISO = dueDate.toISOString();
    const newTask = {
      id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      text: title,
      assigneeId: assigneeEl ? assigneeEl.value : state.currentUser,
      categoryId: categoryEl && categoryEl.value ? categoryEl.value : null,
      status: 'open',
      priority: priorityEl ? priorityEl.value : 'med',
      notes: '',
      dueISO: dueISO,
      dueISOMovedAt: Date.now(),
      authorId: state.currentUser,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    state.tasks.push(newTask);
    try {
      await persist('tasks', state.tasks);
    } catch (err) {
      state.tasks = state.tasks.filter(function(x) { return x.id !== newTask.id; });
      render();
      console.error('[quickadd] persist failed', err);
      toast('Save failed - reverted', 'error');
      return;
    }
    toast('Task added.', 'success');
    if (titleEl) titleEl.value = '';
    render();
  };

  function renderTemplatesView() {
    ensureTemplatesExpansionInitialized();
    const templates = state.taskTemplates || [];
    const byKey = getChapterDatesByKey();
    const f = state.taskTemplateFilter || { search: '', phase: 'all', category: 'all' };

    const allCategories = Array.from(new Set(templates.map(function(t) { return t.category; }).filter(Boolean))).sort();
    const filtered = templates.filter(function(t) {
      if (f.phase !== 'all' && t.phase !== f.phase) return false;
      if (f.category !== 'all' && t.category !== f.category) return false;
      if (f.search) {
        const q = f.search.trim().toLowerCase();
        const hay = [t.title, t.description, t.category, t.default_assignee].filter(Boolean).join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    // Group by phase, preserving phase order
    const phaseOrder = ['pre_rush', 'pre_bfc', 'rush_week', 'selection', 'post_rush'];
    const grouped = {};
    phaseOrder.forEach(function(p) { grouped[p] = []; });
    filtered.forEach(function(t) { if (grouped[t.phase]) grouped[t.phase].push(t); });

    // Generate plan: count non-excluded, anchored templates that aren't already generated
    let plan = { canGenerate: 0, skipExisting: 0, skipAnchorless: 0, skipExcluded: 0 };
    templates.forEach(function(t) {
      if (state.taskTemplatesExcluded.has(t.id)) { plan.skipExcluded++; return; }
      const calc = getTemplateCalculatedDue(t, byKey);
      if (!calc) { plan.skipAnchorless++; return; }
      if (findTaskForTemplate(t.id)) { plan.skipExisting++; return; }
      plan.canGenerate++;
    });
    const generateDisabled = plan.canGenerate === 0;

    return '<div class="templates-view">' +
      renderQuickAddTaskBar() +
      renderChapterDatesEditor() +
      '<div class="templates-section">' +
        '<div class="templates-section-head">' +
          '<div class="section-title" style="font-family:\'Playfair Display\',serif; font-size:17px; font-weight:700; color:var(--navy);">Task templates</div>' +
        '</div>' +
        '<div class="brothers-toolbar">' +
          '<input type="search" class="field-input search" placeholder="Search templates..." ' +
            'value="' + escapeHtml(f.search) + '" oninput="setTaskTemplateFilter(\'search\', this.value)">' +
          '<select class="field-select" onchange="setTaskTemplateFilter(\'phase\', this.value)">' +
            '<option value="all"' + (f.phase === 'all' ? ' selected' : '') + '>All phases</option>' +
            phaseOrder.map(function(p) {
              return '<option value="' + p + '"' + (f.phase === p ? ' selected' : '') + '>' + escapeHtml(PHASE_LABELS[p]) + '</option>';
            }).join('') +
          '</select>' +
          '<select class="field-select" onchange="setTaskTemplateFilter(\'category\', this.value)">' +
            '<option value="all"' + (f.category === 'all' ? ' selected' : '') + '>All categories</option>' +
            allCategories.map(function(c) {
              return '<option value="' + escapeHtml(c) + '"' + (f.category === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
            }).join('') +
          '</select>' +
          '<span class="brothers-count">' + filtered.length + ' template' + (filtered.length === 1 ? '' : 's') + '</span>' +
        '</div>' +
        // v2 (Diff 3): manual Generate removed. Tasks auto-sync continuously.

        (templates.length === 0
          ? '<div class="empty-state-polished">' +
              '<div class="empty-glyph">◌</div>' +
              '<div class="empty-text">No templates yet — seed via 0006_seed_initial_templates.sql.</div>' +
            '</div>'
          : phaseOrder.map(function(p) { return renderPhaseGroup(p, grouped[p], byKey); }).join('')) +
      '</div>' +
    '</div>';
  }

  function renderPhaseGroup(phaseId, templates, byKey) {
    if (!templates.length) return '';
    const expanded = state.taskTemplatesExpanded && state.taskTemplatesExpanded.has(phaseId);
    const stats = getPhaseStats(templates, byKey);
    const isCurrent = getCurrentRushPhase() === phaseId;
    return '<div class="phase-group' + (expanded ? ' expanded' : '') + (isCurrent ? ' current-phase' : '') + '">' +
      '<div class="phase-group-head" onclick="togglePhaseExpanded(\'' + phaseId + '\')">' +
        '<span class="history-chevron">' + (expanded ? '▾' : '▸') + '</span>' +
        '<div class="phase-group-title">' + escapeHtml(PHASE_LABELS[phaseId]) +
          (isCurrent ? ' <span class="phase-current-badge">current</span>' : '') +
        '</div>' +
        '<div class="phase-group-meta">' +
          stats.total + ' template' + (stats.total === 1 ? '' : 's') +
          (stats.generated ? ' · ' + stats.generated + ' generated' : '') +
          (stats.drifted   ? ' · <span class="phase-drift">' + stats.drifted + ' drifted</span>' : '') +
          (stats.anchorless ? ' · <span class="phase-anchorless">' + stats.anchorless + ' missing anchor</span>' : '') +
        '</div>' +
      '</div>' +
      (expanded
        ? '<div class="phase-group-body">' +
            templates.map(function(t) { return renderTemplateRow(t, byKey); }).join('') +
            (state.taskTemplateAddingForPhase === phaseId
              ? renderTemplateEditForm({ phase: phaseId, days_offset: 0, priority: 'med' }, 'add')
              : '<button class="add-template-btn" onclick="openAddTemplate(\'' + phaseId + '\')">+ Add template to ' + escapeHtml(PHASE_LABELS[phaseId]) + '</button>') +
          '</div>'
        : '') +
    '</div>';
  }

  function renderTemplateRow(t, byKey) {
    // v2 (Diff 3): click row to expand inline edit form. Removed excluded
    // checkbox (auto-sync replaces Generate). Removed "generated" badge
    // (hide marker from chairs per v2 spec). Anchor-missing + priority
    // badges retained.
    const calc = getTemplateCalculatedDue(t, byKey);
    const anchor = byKey[t.anchor_date_key];
    const dueDisplay = calc
      ? calc.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
      : '—';
    const anchorLabel = anchor ? anchor.label : t.anchor_date_key;
    const offsetSign = t.days_offset === 0 ? 'on' : (t.days_offset > 0 ? '+' + t.days_offset + 'd after' : t.days_offset + 'd before');
    const offsetExpr = offsetSign + ' ' + anchorLabel;
    const assigneeLabel = (function() {
      if (!t.default_assignee) return '—';
      if (t.default_assignee === 'all') return 'All chairs';
      const m = MEMBERS.find(function(x) { return x.id === t.default_assignee; });
      return m ? m.name : t.default_assignee;
    })();
    const isEditing = state.taskEditingTemplateId === t.id;
    // priority badge: hide 'med' default (v2 spec), show only high/low
    const priorityBadge =
      t.priority === 'high' ? ' <span class="template-priority high">high</span>' :
      t.priority === 'low'  ? ' <span class="template-priority low">low</span>'  : '';
    // anchor-missing is the only retained status badge; generated/drifted markers removed
    const anchorBadge = !calc ? ' <span class="template-status anchor-missing">anchor missing</span>' : '';
