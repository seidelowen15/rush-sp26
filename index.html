  // -------- Schedule event modal --------

  window.openSchedModalAt = function(dateStr, timeStr) {
    state.editingSchedId = null;
    state.editingSchedInstanceDate = null;
    state.editingSched = { weekdays: [], recurrence: 'once' };

    document.getElementById('schedModalTitle').innerHTML = 'New <em>event</em>';
    document.getElementById('schedModalSub').textContent = 'Block off your time';
    document.getElementById('deleteSchedBtn').style.display = 'none';
    document.getElementById('schedTitle').value = '';
    document.getElementById('schedLocation').value = '';
    document.getElementById('schedNotes').value = '';

    // Pre-fill date/time from click context if given
    const baseDate = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
    const dateInput = isoDate(baseDate);
    document.getElementById('schedOnceDate').value = dateInput;
    document.getElementById('schedStartDate').value = dateInput;
    const untilDefault = new Date(baseDate);
    untilDefault.setMonth(untilDefault.getMonth() + 4);
    document.getElementById('schedUntilDate').value = isoDate(untilDefault);

    document.getElementById('schedStart').value = timeStr || '09:00';
    // Default end = start + 1 hour
    const startMins = hmToMinutes(timeStr || '09:00');
    const endMins = startMins + 60;
    const eh = String(Math.floor(endMins / 60) % 24).padStart(2, '0');
    const em = String(endMins % 60).padStart(2, '0');
    document.getElementById('schedEnd').value = eh + ':' + em;

    state.editingSched.weekdays = [baseDate.getDay()];

    renderSchedRecurChips();
    renderSchedWeekdayChips();
    updateSchedRecurVisibility();

    document.getElementById('schedModal').classList.add('active');
    setTimeout(() => document.getElementById('schedTitle').focus(), 50);
  };

  window.openSchedModalEdit = function(eventId, instanceDate) {
    const ev = state.scheduleEvents.find(e => e.id === eventId);
    if (!ev) return;

    // If recurring, ask "this one or all?" first
    if (ev.recurrence === 'weekly') {
      state._pendingEditEvent = ev;
      state._pendingEditInstance = instanceDate;
      document.getElementById('recurChoiceTitle').textContent = 'Edit recurring event';
      document.getElementById('recurChoiceSub').textContent = 'This event repeats weekly. What do you want to change?';
      document.getElementById('recurChoiceModal').classList.add('active');
      return;
    }
    openSchedModalForReal(ev, instanceDate, false);
  };

  window.recurChoicePicked = function(choice) {
    closeRecurChoice();
    const ev = state._pendingEditEvent;
    const inst = state._pendingEditInstance;
    if (!ev) return;
    if (choice === 'one') {
      openSchedModalForReal(ev, inst, true);  // editing exception
    } else {
      openSchedModalForReal(ev, inst, false);
    }
  };

  window.closeRecurChoice = function() {
    document.getElementById('recurChoiceModal').classList.remove('active');
  };

  function openSchedModalForReal(ev, instanceDate, isExceptionEdit) {
    state.editingSchedId = ev.id;
    state.editingSchedInstanceDate = isExceptionEdit ? instanceDate : null;

    // If editing an exception, surface the resolved (overridden) fields
    const resolved = isExceptionEdit ? resolveInstance(ev, instanceDate) : ev;
    if (!resolved) return; // skipped occurrence — shouldn't happen, can't edit it

    state.editingSched = {
      weekdays: (ev.weekdays || []).slice(),
      recurrence: isExceptionEdit ? 'once' : (ev.recurrence || 'once'),
    };

    document.getElementById('schedModalTitle').innerHTML = isExceptionEdit
      ? 'Edit <em>this occurrence</em>'
      : 'Edit <em>event</em>';
    document.getElementById('schedModalSub').textContent = isExceptionEdit
      ? 'Changing only ' + new Date(instanceDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })
      : (ev.ownerId === state.currentUser ? 'Your event' : 'Owned by another member — you can\'t edit');
    document.getElementById('deleteSchedBtn').style.display = ev.ownerId === state.currentUser ? 'inline-flex' : 'none';

    document.getElementById('schedTitle').value = resolved.title || '';
    document.getElementById('schedStart').value = resolved.startTime || '09:00';
    document.getElementById('schedEnd').value = resolved.endTime || '10:00';
    document.getElementById('schedLocation').value = resolved.location || '';
    document.getElementById('schedNotes').value = resolved.notes || '';

    if (isExceptionEdit) {
      document.getElementById('schedOnceDate').value = instanceDate;
    } else if (ev.recurrence === 'weekly') {
      document.getElementById('schedStartDate').value = ev.startDate || '';
      document.getElementById('schedUntilDate').value = ev.untilDate || '';
    } else {
      document.getElementById('schedOnceDate').value = ev.date || isoDate(new Date());
    }

    // Lock recurrence selection if not the owner
    const lockEdit = ev.ownerId !== state.currentUser;
    renderSchedRecurChips(lockEdit);
    renderSchedWeekdayChips(lockEdit);
    updateSchedRecurVisibility();

    if (lockEdit) {
      // Disable inputs
      ['schedTitle', 'schedStart', 'schedEnd', 'schedLocation', 'schedNotes', 'schedOnceDate', 'schedStartDate', 'schedUntilDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      });
    } else {
      ['schedTitle', 'schedStart', 'schedEnd', 'schedLocation', 'schedNotes', 'schedOnceDate', 'schedStartDate', 'schedUntilDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      });
    }

    document.getElementById('schedModal').classList.add('active');
  }

  window.closeSchedModal = function() {
    document.getElementById('schedModal').classList.remove('active');
    state.editingSchedId = null;
    state.editingSchedInstanceDate = null;
  };

  function renderSchedRecurChips(locked) {
    const opts = [
      { id: 'once', label: 'Just once' },
      { id: 'weekly', label: 'Every week' },
    ];
    const container = document.getElementById('schedRecurChips');
    container.innerHTML = opts.map(o =>
      '<button class="chip ' + (state.editingSched.recurrence === o.id ? 'selected' : '') + '" ' +
              (locked ? 'disabled style="opacity:0.5; cursor:not-allowed"' : 'onclick="pickSchedRecur(\'' + o.id + '\')"') + '>' +
        o.label +
      '</button>'
    ).join('');
  }

  function renderSchedWeekdayChips(locked) {
    const labels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const container = document.getElementById('schedWeekdayChips');
    container.innerHTML = labels.map((l, i) =>
      '<button class="weekday-chip ' + (state.editingSched.weekdays.includes(i) ? 'selected' : '') + '" ' +
              (locked ? 'disabled style="opacity:0.5; cursor:not-allowed"' : 'onclick="toggleSchedWeekday(' + i + ')"') + '>' +
        l +
      '</button>'
    ).join('');
  }

  function updateSchedRecurVisibility() {
    const isWeekly = state.editingSched.recurrence === 'weekly';
    document.getElementById('schedOnceRow').style.display = isWeekly ? 'none' : 'block';
    document.getElementById('schedWeeklyRow').style.display = isWeekly ? 'block' : 'none';
  }

  window.pickSchedRecur = function(id) {
    state.editingSched.recurrence = id;
    renderSchedRecurChips();
    updateSchedRecurVisibility();
  };

  window.toggleSchedWeekday = function(i) {
    const arr = state.editingSched.weekdays;
    const idx = arr.indexOf(i);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(i);
    renderSchedWeekdayChips();
  };

  window.saveSched = async function() {
    const title = document.getElementById('schedTitle').value.trim();
    const startTime = document.getElementById('schedStart').value;
    const endTime = document.getElementById('schedEnd').value;
    const location = document.getElementById('schedLocation').value.trim();
    const notes = document.getElementById('schedNotes').value.trim();

    if (!title) { toast('Please enter a title.', 'error'); document.getElementById('schedTitle').focus(); return; }
    if (!startTime || !endTime) { toast('Please pick start and end times.', 'error'); return; }
    if (hmToMinutes(endTime) <= hmToMinutes(startTime)) {
      toast('End time must be after start time.', 'error');
      return;
    }

    const isExceptionEdit = !!state.editingSchedInstanceDate;

    if (isExceptionEdit) {
      // Apply or update an exception for the editing instance date
      const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
      if (!ev) { toast('Original event not found.', 'error'); return; }
      ev.exceptions = ev.exceptions || {};
      ev.exceptions[state.editingSchedInstanceDate] = {
        title, startTime, endTime, location, notes,
      };
      ev.updatedAt = Date.now();
      await persist('schedule_events', state.scheduleEvents);
      toast('Updated just this occurrence', 'success');
      closeSchedModal();
      render();
      return;
    }

    if (state.editingSched.recurrence === 'weekly') {
      if (state.editingSched.weekdays.length === 0) {
        toast('Pick at least one weekday.', 'error');
        return;
      }
    }

    if (state.editingSchedId) {
      // Editing whole series
      const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
      if (!ev) { toast('Event not found.', 'error'); return; }
      if (ev.ownerId !== state.currentUser) {
        toast('You can only edit your own events.', 'error');
        return;
      }
      ev.title = title;
      ev.startTime = startTime;
      ev.endTime = endTime;
      ev.location = location;
      ev.notes = notes;
      ev.recurrence = state.editingSched.recurrence;
      if (state.editingSched.recurrence === 'weekly') {
        ev.weekdays = state.editingSched.weekdays.slice();
        ev.startDate = document.getElementById('schedStartDate').value;
        ev.untilDate = document.getElementById('schedUntilDate').value || null;
        delete ev.date;
      } else {
        ev.date = document.getElementById('schedOnceDate').value;
        delete ev.weekdays;
        delete ev.startDate;
        delete ev.untilDate;
      }
      ev.updatedAt = Date.now();
    } else {
      // Creating new
      const newEv = {
        id: 'se_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        ownerId: state.currentUser,
        title, startTime, endTime, location, notes,
        recurrence: state.editingSched.recurrence,
        exceptions: {},
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      if (state.editingSched.recurrence === 'weekly') {
        newEv.weekdays = state.editingSched.weekdays.slice();
        newEv.startDate = document.getElementById('schedStartDate').value;
        newEv.untilDate = document.getElementById('schedUntilDate').value || null;
      } else {
        newEv.date = document.getElementById('schedOnceDate').value;
      }
      state.scheduleEvents.push(newEv);
    }
    await persist('schedule_events', state.scheduleEvents);
    toast('Saved', 'success');
    closeSchedModal();
    render();
  };

  window.deleteCurrentSched = async function() {
    if (!state.editingSchedId) return;
    const ev = state.scheduleEvents.find(e => e.id === state.editingSchedId);
    if (!ev) return;
    if (ev.ownerId !== state.currentUser) {
      toast('You can only delete your own events.', 'error');
      return;
    }
    if (state.editingSchedInstanceDate) {
      // Deleting just this occurrence — mark as exception null (skip)
      if (!confirm('Skip just this occurrence of "' + ev.title + '"?')) return;
      ev.exceptions = ev.exceptions || {};
      ev.exceptions[state.editingSchedInstanceDate] = null;
      ev.updatedAt = Date.now();
      await persist('schedule_events', state.scheduleEvents);
      toast('Skipped this occurrence', 'default');
    } else {
      if (!confirm('Delete the entire ' + (ev.recurrence === 'weekly' ? 'recurring series' : 'event') + '? This cannot be undone.')) return;
      state.scheduleEvents = state.scheduleEvents.filter(e => e.id !== state.editingSchedId);
      await persist('schedule_events', state.scheduleEvents);
      toast('Deleted', 'default');
    }
    closeSchedModal();
    render();
  };

  // ============================================================
  // CONFLICT DETECTION (for rush event modal)
  // ============================================================
  // Given a date string (YYYY-MM-DD) and start/end time strings,
  // returns an array of {memberName, eventTitle, timeRange} conflicts.
  function detectConflicts(dateStr, startTime, endTime) {
    if (!dateStr || !startTime || !endTime) return [];
    const startMin = hmToMinutes(startTime);
    const endMin = hmToMinutes(endTime);
    if (endMin <= startMin) return [];
    const d = new Date(dateStr + 'T00:00:00');
    const ranges = expandSchedule(d, d);

    const conflicts = [];
    for (const r of ranges) {
      if (r.startMin < endMin && r.endMin > startMin) {
        const owner = MEMBERS.find(m => m.id === r.event.ownerId);
        conflicts.push({
          memberName: owner ? owner.name : 'Someone',
          memberColor: owner ? owner.color : '#6B7280',
          eventTitle: r.title,
          timeRange: formatTime12(r.startMin) + ' – ' + formatTime12(r.endMin),
        });
      }
    }
    return conflicts;
  }

  function renderConflictsArea() {
    const area = document.getElementById('eventConflictArea');
    if (!area) return;
    const dateStr = document.getElementById('eventDate').value;
    const startTime = document.getElementById('eventStart').value;
    const endTime = document.getElementById('eventEnd').value;
    const conflicts = detectConflicts(dateStr, startTime, endTime);
    if (conflicts.length === 0) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = '<div class="conflict-banner">' +
      '<div class="conflict-banner-title">⚠ Schedule conflicts</div>' +
      '<div class="conflict-list">' +
        conflicts.map(c =>
          '<div class="conflict-item">' +
            '<span class="conflict-item-name" style="color:' + c.memberColor + '">' + escapeHtml(c.memberName) + '</span>' +
            ' is not available — <em>' + escapeHtml(c.eventTitle) + '</em> (' + c.timeRange + ')' +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>';
  }

  // Hook conflict detection to rush event modal inputs (wired up after openEventModal opens)
  function attachConflictListeners() {
    ['eventDate', 'eventStart', 'eventEnd'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.removeEventListener('input', renderConflictsArea);
      el.addEventListener('input', renderConflictsArea);
      el.removeEventListener('change', renderConflictsArea);
      el.addEventListener('change', renderConflictsArea);
    });
  }

  // ============================================================
  // UTILS
  // ============================================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    const day = Math.floor(hr / 24);
    if (day < 7) return day + 'd ago';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function toDateInputValue(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  function toTimeInputValue(d) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function eventEndTime(e) { return new Date(e.endISO || e.startISO).getTime(); }

  function formatEventShort(e) {
    if (!e.hasTime) return e.title;
    const d = new Date(e.startISO);
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(':00', '').toLowerCase().replace(' ', '');
    return timeStr + ' ' + e.title;
  }

  function formatEventTime(e) {
    const d = new Date(e.startISO);
    const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (!e.hasTime) return dateStr.toUpperCase();
    const startStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let timeStr = startStr;
    if (e.endISO) {
      const endStr = new Date(e.endISO).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      timeStr = startStr + ' – ' + endStr;
    }
    return (dateStr + ' · ' + timeStr).toUpperCase();
  }

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      state.editingNoteId = null;
      state.editingEventId = null;
      state.editingTaskId = null;
      state.editingCandId = null;
      state.editingSchedId = null;
      state.editingSchedInstanceDate = null;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      if (document.getElementById('noteModal').classList.contains('active')) { e.preventDefault(); saveNote(); }
      else if (document.getElementById('eventModal').classList.contains('active')) { e.preventDefault(); saveEvent(); }
      else if (document.getElementById('taskModal').classList.contains('active')) { e.preventDefault(); saveTask(); }
      else if (document.getElementById('candidateModal').classList.contains('active')) { e.preventDefault(); saveCandidate(); }
      else if (document.getElementById('schedModal').classList.contains('active')) { e.preventDefault(); saveSched(); }
    }
  });

  // ============================================================
  // BROTHERS  (Phase 0, chair-facing only)
  //
  // Bypasses the Storage(key)->JSONB-blob layer used by the other
  // entities, because public.brothers has real typed columns
  // (psu_id, demographics, etc.) -- querying by structured fields
  // is the whole point of having that schema.
  //
  // Demographics (gender, ethnicity, hometown_*, international) are
  // rendered ONLY inside renderBrotherProfile below. Do NOT factor
  // that block out into a reusable component -- when nametags or the
  // demographic flyer ship, they will query a brothers_public view
  // that excludes demographics at the SELECT layer.
  // ============================================================
  async function loadBrothers() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('brothers')
        .select('id, psu_id, first_name, last_name, preferred_name, pronouns, psu_email, personal_email, phone, status, pledge_class, pledge_class_code, role, gender, ethnicity, hometown_city, hometown_state, international, major_primary, major_secondary, minor_primary, minor_secondary, year_in_school, semester_number, contact_preference, address, birthday, internal_notes, verified_at')
        .order('last_name', { ascending: true, nullsFirst: false })
        .order('first_name', { ascending: true, nullsFirst: false });
      if (error) throw error;
      state.brothers = data || [];
      state.brothersLoaded = true;
    } catch (e) {
      console.error('loadBrothers failed', e);
      state.brothers = [];
      state.brothersLoaded = true;
    }
  }

  function isExecRole(r) {
    if (!r) return false;
    const x = String(r).toLowerCase();
    return /(president|vp|chair|treasurer|secretary|founder)/.test(x);
  }

  function renderBrothers() {
    const f = state.brotherFilter;
    const all = state.brothers;
    const pcCodes = Array.from(new Set(all.map(b => b.pledge_class_code).filter(Boolean))).sort();

    const filtered = all.filter(b => {
      if (f.pc !== 'all' && b.pledge_class_code !== f.pc) return false;
      if (f.role === 'exec' && !isExecRole(b.role)) return false;
      if (f.role === 'pm' && b.role !== 'PM') return false;
      if (f.role === 'brother' && (isExecRole(b.role) || b.role === 'PM')) return false;
      if (f.status !== 'all' && (b.status || 'active') !== f.status) return false;
      if (f.search) {
        const q = f.search.trim().toLowerCase();
        const hay = [b.first_name, b.last_name, b.preferred_name, b.psu_id, b.major_primary, b.address]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    return '' +
      '<div class="brothers-toolbar">' +
        '<input type="search" class="field-input search" placeholder="Search name, PSU ID, major, address..." ' +
          'value="' + escapeHtml(f.search) + '" oninput="setBrotherFilter(\'search\', this.value)">' +
        '<select class="field-select" onchange="setBrotherFilter(\'pc\', this.value)">' +
          '<option value="all"' + (f.pc === 'all' ? ' selected' : '') + '>All pledge classes</option>' +
          pcCodes.map(c => '<option value="' + escapeHtml(c) + '"' + (f.pc === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>').join('') +
        '</select>' +
        '<select class="field-select" onchange="setBrotherFilter(\'role\', this.value)">' +
          '<option value="all"' + (f.role === 'all' ? ' selected' : '') + '>All roles</option>' +
          '<option value="exec"' + (f.role === 'exec' ? ' selected' : '') + '>Exec</option>' +
          '<option value="pm"' + (f.role === 'pm' ? ' selected' : '') + '>PM</option>' +
          '<option value="brother"' + (f.role === 'brother' ? ' selected' : '') + '>Brother</option>' +
        '</select>' +
        '<select class="field-select" onchange="setBrotherFilter(\'status\', this.value)">' +
          '<option value="all"' + (f.status === 'all' ? ' selected' : '') + '>All statuses</option>' +
          '<option value="active"' + (f.status === 'active' ? ' selected' : '') + '>Active</option>' +
          '<option value="on_leave"' + (f.status === 'on_leave' ? ' selected' : '') + '>On leave</option>' +
          '<option value="alumnus"' + (f.status === 'alumnus' ? ' selected' : '') + '>Alumnus</option>' +
          '<option value="graduated"' + (f.status === 'graduated' ? ' selected' : '') + '>Graduated</option>' +
          '<option value="unknown"' + (f.status === 'unknown' ? ' selected' : '') + '>Unknown</option>' +
        '</select>' +
        '<span class="brothers-count">' + filtered.length + ' of ' + all.length + '</span>' +
      '</div>' +
      (!state.brothersLoaded
        ? '<div class="empty-state"><div class="ornament">◍</div><div style="font-family:\'Playfair Display\',serif; font-size:20px; font-style:italic;">Loading the chapter...</div></div>'
        : filtered.length === 0
          ? '<div class="empty-state"><div class="ornament">◍</div>' +
              '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; margin-bottom:8px;">No brothers match these filters</div>' +
              '<div style="font-size:13px;">Loosen a filter or clear the search.</div>' +
            '</div>'
          : renderBrothersTable(filtered));
  }

  function renderBrothersTable(rows) {
    return '<table class="brothers-table">' +
      '<thead><tr>' +
        '<th>Name</th><th>PSU ID</th><th>Pledge class</th><th>Role</th><th>Status</th><th>Major</th>' +
      '</tr></thead><tbody>' +
      rows.map(b => {
        const nameRaw = ((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')).trim();
        const name = nameRaw ? escapeHtml(nameRaw) : '<span style="color:var(--fg-muted)">(unnamed)</span>';
        const roleBadge = b.role
          ? '<span class="brother-badge ' + (b.role === 'PM' ? 'role-pm' : isExecRole(b.role) ? 'role-exec' : '') + '">' +
              escapeHtml(b.role) +
              (b.role === 'PM' ? ' · chair-only' : '') +
            '</span>'
          : '';
        const status = b.status || 'unknown';
        return '<tr onclick="openBrotherModal(\'' + b.id + '\')">' +
          '<td class="brother-name">' + name + '</td>' +
          '<td class="brother-psu">' + escapeHtml(b.psu_id || '—') + '</td>' +
          '<td>' + escapeHtml(b.pledge_class || '—') + '</td>' +
          '<td>' + roleBadge + '</td>' +
          '<td><span class="brother-badge status-' + status + '">' + status + '</span></td>' +
          '<td>' + escapeHtml(b.major_primary || '—') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table>';
  }

  function renderBrotherProfileRow(key, value, opts) {
    if (value === null || value === undefined || value === '') return '';
    const tag = opts && opts.tag ? ' <span class="chair-only-tag">' + opts.tag + '</span>' : '';
    return '<div class="brother-profile-row">' +
      '<div class="key">' + escapeHtml(key) + '</div>' +
      '<div>' + escapeHtml(String(value)) + tag + '</div>' +
    '</div>';
  }

  function renderBrotherProfile(b) {
    // Demographics block is rendered INLINE here, intentionally not
    // factored into a reusable helper. PNM-facing slices must query
    // a brothers_public view that excludes these columns.
    const hasDemographics = b.gender || b.ethnicity || b.hometown_city || b.hometown_state || b.international != null;
    const demoBlock = hasDemographics
      ? '<div class="brother-demographics-block">' +
          '<div class="demographics-label">demographics · chair-only</div>' +
          renderBrotherProfileRow('Gender', b.gender) +
          renderBrotherProfileRow('Ethnicity', b.ethnicity) +
          renderBrotherProfileRow('Hometown', [b.hometown_city, b.hometown_state].filter(Boolean).join(', ')) +
          renderBrotherProfileRow('International', b.international === true ? 'yes' : b.international === false ? 'no' : null) +
        '</div>'
      : '';

    const internalNotesBlock = b.internal_notes
      ? '<div class="brother-internal-notes"><strong>Internal notes:</strong> ' + escapeHtml(b.internal_notes) + '</div>'
      : '';

    const verifiedDisplay = b.verified_at
      ? new Date(b.verified_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : 'never';

    return '' +
      renderBrotherProfileRow('PSU ID', b.psu_id) +
      renderBrotherProfileRow('Pronouns', b.pronouns) +
      renderBrotherProfileRow('PSU email', b.psu_email) +
      renderBrotherProfileRow('Personal email', b.personal_email) +
      renderBrotherProfileRow('Phone', b.phone) +
      renderBrotherProfileRow('Pledge class', b.pledge_class) +
      renderBrotherProfileRow('Role', b.role, b.role === 'PM' ? { tag: 'hidden on PNM views' } : null) +
      renderBrotherProfileRow('Status', b.status) +
      renderBrotherProfileRow('Major', [b.major_primary, b.major_secondary].filter(Boolean).join(' / ')) +
      renderBrotherProfileRow('Minor', [b.minor_primary, b.minor_secondary].filter(Boolean).join(' / ')) +
      renderBrotherProfileRow('Year', b.year_in_school) +
      renderBrotherProfileRow('Semester #', b.semester_number) +
      renderBrotherProfileRow('Contact pref', b.contact_preference) +
      renderBrotherProfileRow('Address', b.address) +
      renderBrotherProfileRow('Birthday', b.birthday) +
      renderBrotherProfileRow('Verified', verifiedDisplay) +
      renderNametagHistoryRow(b.id) +
      demoBlock +
      internalNotesBlock;
  }

  window.setBrotherFilter = function(key, value) {
    state.brotherFilter = Object.assign({}, state.brotherFilter, { [key]: value });
    render();
    if (key === 'search') {
      const el = document.querySelector('.brothers-toolbar .search');
      if (el) {
        el.focus();
        el.setSelectionRange(value.length, value.length);
      }
    }
  };

  window.openBrotherModal = function(id) {
    const b = state.brothers.find(x => x.id === id);
    if (!b) return;
    state.viewingBrotherId = id;
    const display = ((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')).trim() || '(unnamed)';
    document.getElementById('brotherModalTitle').textContent = display;
    document.getElementById('brotherModalSub').textContent = (b.pledge_class || 'No pledge class') + ' · chair-visible profile';
    document.getElementById('brotherModalBody').innerHTML = renderBrotherProfile(b);
    document.getElementById('brotherModal').classList.add('active');
  };

  window.closeBrotherModal = function() {
    document.getElementById('brotherModal').classList.remove('active');
    state.viewingBrotherId = null;
  };

  // ============================================================
  // NAMETAGS  (Phase 0 item #2, chair-facing only)
  //
  // Three things working together:
  //   1. NAMETAG_ROLE_WHITELIST -- single source of truth for which
  //      roles surface on PNM-facing nametags. Locked decision: PM is
  //      NOT in this set, exec board + Rush Chair only.
  //   2. NAMETAG_TEMPLATES -- JSON-driven card layouts. Add a key to
  //      ship a new template; no renderer changes needed.
  //   3. renderNametagCardHTML -- one function produces the card DOM
  //      used for BOTH the live preview AND the html2canvas snapshot
  //      fed into jsPDF. No drift between what you see and what prints.
  //
  // Demographics never touch this slice -- card consumes name + PC +
  // (whitelisted role) only.
  // ============================================================

  const NAMETAG_ROLE_WHITELIST = new Set([
    'President', 'VPF', 'VPO', 'VPP', 'VPCC', 'VPM', 'Secretary', 'Rush Chair'
  ]);

  function shouldShowRoleOnNametag(role) {
    return !!role && NAMETAG_ROLE_WHITELIST.has(role);
  }

  const AVERY_PRESETS = {
    '5395': {
      label: 'Avery 5395 — 8 per page',
      cardW: 3.375, cardH: 2.333,
      pageW: 8.5, pageH: 11,
      cols: 2, rows: 4,
      marginTop: 0.5, marginLeft: 0.75,
      cardGapX: 0.125, cardGapY: 0.167,
    },
  };

  const NAMETAG_TEMPLATES = {
    'bfc-mixer': {
      label: 'BFC Mixer',
      bg: '#FAF6EC', accent: '#0A2463',
      nameFont: "'Playfair Display', serif", nameWeight: 700,
      nameStyle: 'first-last-initial',
      metaFont: "'JetBrains Mono', monospace",
      accentStyle: 'top-stripe',
      showAkpsi: true, showPC: true,
    },
    'speed-dating': {
      label: 'Speed Dating',
      bg: '#FFFFFF', accent: '#D4A64A',
      nameFont: "'Inter', sans-serif", nameWeight: 700,
      nameStyle: 'first',
      metaFont: "'JetBrains Mono', monospace",
      accentStyle: 'left-bar',
      showAkpsi: true, showPC: true,
    },
    'generic': {
      label: 'Generic',
      bg: '#FFFFFF', accent: '#0A2463',
      nameFont: "'Inter', sans-serif", nameWeight: 600,
      nameStyle: 'first-last-initial',
      metaFont: "'JetBrains Mono', monospace",
      accentStyle: 'bottom-line',
      showAkpsi: true, showPC: true,
    },
  };

  // ----- Data -----
  async function loadNametagPrints() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('nametag_prints')
        .select('id, brother_id, event_label, template_name, printed_at, printed_by, notes')
        .order('printed_at', { ascending: false });
      if (error) throw error;
      state.nametagPrints = data || [];
      state.nametagPrintsLoaded = true;
    } catch (e) {
      console.error('loadNametagPrints failed', e);
      state.nametagPrints = [];
      state.nametagPrintsLoaded = true;
    }
  }

  async function recordNametagPrints(brotherIds, eventLabel, templateName) {
    if (!sb || brotherIds.length === 0) return;
    const rows = brotherIds.map(id => ({
      brother_id: id,
      event_label: eventLabel,
      template_name: templateName,
      printed_by: state.currentUser || null,
    }));
    const { error } = await sb.from('nametag_prints').insert(rows);
    if (error) {
      console.error('recordNametagPrints failed', error);
      toast('Saved PDF but failed to log prints — check console.', 'error');
      return;
    }
    await loadNametagPrints();
  }

  // ----- Helpers -----
  function getActiveDimensions() {
    const ov = state.nametagOverrides;
    const base = AVERY_PRESETS[ov.averyPreset] || AVERY_PRESETS['5395'];
    if (ov.dimensions) {
      return Object.assign({}, base, { cardW: ov.dimensions.wIn, cardH: ov.dimensions.hIn });
    }
    return base;
  }

  function getDisplayName(b, style) {
    const f = b.preferred_name || b.first_name || '';
    const l = b.last_name || '';
    if (style === 'first') return f;
    if (style === 'preferred') return b.preferred_name || f;
    return f + (l ? ' ' + l[0] + '.' : '');
  }

  function isPrintedForEvent(brotherId, label) {
    const target = (label || '').trim();
    if (!target) return false;
    return state.nametagPrints.some(p => p.brother_id === brotherId && p.event_label === target);
  }

  function getNametagPrintsForBrother(brotherId) {
    return state.nametagPrints.filter(p => p.brother_id === brotherId);
  }

  function getKnownEventLabels() {
    const set = new Set(state.nametagPrints.map(p => p.event_label).filter(Boolean));
    return Array.from(set).sort();
  }

  function getNametagFilteredBrothers() {
    const f = state.nametagFilter;
    return state.brothers.filter(b => {
      if (f.pc !== 'all' && b.pledge_class_code !== f.pc) return false;
      if (f.role === 'exec' && !isExecRole(b.role)) return false;
      if (f.role === 'pm' && b.role !== 'PM') return false;
      if (f.role === 'brother' && (isExecRole(b.role) || b.role === 'PM')) return false;
      if (f.status !== 'all' && (b.status || 'active') !== f.status) return false;
      if (f.search) {
        const q = f.search.trim().toLowerCase();
        const hay = [b.first_name, b.last_name, b.preferred_name, b.psu_id, b.major_primary]
          .filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function getNametagPrintPlan() {
    // Real-time plan: drives the generate-bar count display, not just executed at PDF time.
    const label = state.nametagEventLabel.trim();
    const toPrint = [];
    const skipped = [];
    state.nametagSelected.forEach(id => {
      if (label && isPrintedForEvent(id, label) && !state.nametagReprint.has(id)) skipped.push(id);
      else toPrint.push(id);
    });
    return { toPrint, skipped };
  }

  // ----- Card renderer (single source of truth) -----
  function renderNametagCardHTML(brother) {
    const tmpl = NAMETAG_TEMPLATES[state.nametagTemplate] || NAMETAG_TEMPLATES['generic'];
    const ov = state.nametagOverrides;
    const dims = getActiveDimensions();
    const bg = ov.bgColor || tmpl.bg;
    const accent = ov.accentColor || tmpl.accent;
    const nameStyle = ov.nameStyle || tmpl.nameStyle;
    const roleVisible = ov.roleVisible === 'hide' ? false : shouldShowRoleOnNametag(brother.role);

    const displayName = getDisplayName(brother, nameStyle);
    const pc = brother.pledge_class_code || '';
    const role = roleVisible ? brother.role : '';
    const meta = [pc, role].filter(Boolean).join(' · ');

    let accentEl = '';
    let padding = '0.35in 0.3in 0.3in';
    if (tmpl.accentStyle === 'top-stripe') {
      accentEl = '<div style="position:absolute; top:0; left:0; right:0; height:0.18in; background:' + accent + ';"></div>';
    } else if (tmpl.accentStyle === 'left-bar') {
      accentEl = '<div style="position:absolute; top:0; bottom:0; left:0; width:0.16in; background:' + accent + ';"></div>';
      padding = '0.25in 0.3in 0.25in 0.45in';
    } else {
      accentEl = '<div style="position:absolute; bottom:0; left:0.4in; right:0.4in; height:0.04in; background:' + accent + ';"></div>';
    }
    const nameSize = nameStyle === 'first' ? '0.65in' : '0.5in';

    return '<div class="nametag-card" style="position:relative;' +
      ' width:' + dims.cardW + 'in; height:' + dims.cardH + 'in;' +
      ' background:' + bg + '; box-sizing:border-box;' +
      ' padding:' + padding + ';' +
      ' display:flex; flex-direction:column; justify-content:center; align-items:center;' +
      ' text-align:center; font-family:' + tmpl.metaFont + '; color:' + accent + '; overflow:hidden;">' +
      accentEl +
      '<div style="font-family:' + tmpl.nameFont + '; font-weight:' + tmpl.nameWeight + ';' +
      ' font-size:' + nameSize + '; line-height:1; letter-spacing:-0.01em;' +
      ' color:#0F1419; margin-bottom:0.08in;">' + escapeHtml(displayName) + '</div>' +
      '<div style="font-size:0.13in; letter-spacing:0.15em; text-transform:uppercase; color:' + accent + ';">' +
      escapeHtml(meta) + '</div>' +
      (tmpl.showAkpsi
        ? '<div style="position:absolute; bottom:0.12in; right:0.18in;' +
          ' font-family:' + tmpl.metaFont + '; font-size:0.1in;' +
          ' letter-spacing:0.2em; color:' + accent + '; opacity:0.7;">ΑΚΨ</div>'
        : '') +
    '</div>';
  }

  // ----- View rendering -----
  function renderNametagsView() {
    return '<div class="nametag-layout">' +
      '<div class="nametag-picker-pane">' +
        renderNametagTemplateStrip() +
        renderNametagOverridesPanel() +
        renderNametagPicker() +
      '</div>' +
      '<div class="nametag-preview-pane">' +
        renderNametagPreviewPane() +
        renderNametagGenerateBar() +
      '</div>' +
    '</div>';
  }

  function renderNametagTemplateStrip() {
    return '<div class="nametag-template-strip">' +
      Object.entries(NAMETAG_TEMPLATES).map(function(entry) {
        var key = entry[0]; var tmpl = entry[1];
        var sel = state.nametagTemplate === key;
        return '<button class="nametag-template-chip' + (sel ? ' selected' : '') + '" ' +
          'onclick="setNametagTemplate(\'' + key + '\')" ' +
          'style="--chip-accent:' + tmpl.accent + '; --chip-bg:' + tmpl.bg + ';">' +
          '<div class="chip-swatch"></div>' +
          '<div class="chip-label">' + escapeHtml(tmpl.label) + '</div>' +
        '</button>';
      }).join('') +
    '</div>';
  }

  function renderNametagOverridesPanel() {
    var ov = state.nametagOverrides;
    var tmpl = NAMETAG_TEMPLATES[state.nametagTemplate];
    return '<div class="nametag-overrides-panel">' +
      '<div class="overrides-label">Overrides (this print job only)</div>' +
      '<div class="overrides-grid">' +
        '<label class="override-field">' +
          '<span class="field-label">Dimensions</span>' +
          '<select class="field-select" onchange="setNametagOverride(\'averyPreset\', this.value)">' +
            '<option value="5395"' + (ov.averyPreset === '5395' ? ' selected' : '') + '>Avery 5395 (3.375 × 2.333 in)</option>' +
          '</select>' +
        '</label>' +
        '<label class="override-field">' +
          '<span class="field-label">Name style</span>' +
          '<select class="field-select" onchange="setNametagOverride(\'nameStyle\', this.value)">' +
            '<option value=""' + (!ov.nameStyle ? ' selected' : '') + '>Template default (' + escapeHtml(tmpl.nameStyle) + ')</option>' +
            '<option value="first"' + (ov.nameStyle === 'first' ? ' selected' : '') + '>First only</option>' +
            '<option value="first-last-initial"' + (ov.nameStyle === 'first-last-initial' ? ' selected' : '') + '>First L.</option>' +
            '<option value="preferred"' + (ov.nameStyle === 'preferred' ? ' selected' : '') + '>Preferred</option>' +
          '</select>' +
        '</label>' +
        '<label class="override-field">' +
          '<span class="field-label">Role display</span>' +
          '<select class="field-select" onchange="setNametagOverride(\'roleVisible\', this.value)">' +
            '<option value="auto"' + (ov.roleVisible === 'auto' ? ' selected' : '') + '>Auto (whitelist)</option>' +
            '<option value="hide"' + (ov.roleVisible === 'hide' ? ' selected' : '') + '>Hide for all</option>' +
          '</select>' +
        '</label>' +
        '<label class="override-field">' +
          '<span class="field-label">Background</span>' +
          '<input type="color" class="field-input" value="' + (ov.bgColor || tmpl.bg) + '" ' +
            'oninput="setNametagOverride(\'bgColor\', this.value)">' +
        '</label>' +
        '<label class="override-field">' +
          '<span class="field-label">Accent</span>' +
          '<input type="color" class="field-input" value="' + (ov.accentColor || tmpl.accent) + '" ' +
            'oninput="setNametagOverride(\'accentColor\', this.value)">' +
        '</label>' +
        '<button class="btn small" onclick="resetNametagOverrides()" style="align-self:end;">Reset overrides</button>' +
      '</div>' +
    '</div>';
  }

  function renderNametagPicker() {
    var f = state.nametagFilter;
    var filtered = getNametagFilteredBrothers();
    var allPcCodes = Array.from(new Set(state.brothers.map(function(b){return b.pledge_class_code;}).filter(Boolean))).sort();
    var eventLabel = state.nametagEventLabel.trim();

    return '<div class="nametag-picker">' +
      '<div class="brothers-toolbar">' +
        '<input type="search" class="field-input search" placeholder="Search name, PSU ID, major..." ' +
          'value="' + escapeHtml(f.search) + '" oninput="setNametagFilter(\'search\', this.value)">' +
        '<select class="field-select" onchange="setNametagFilter(\'pc\', this.value)">' +
          '<option value="all"' + (f.pc === 'all' ? ' selected' : '') + '>All PCs</option>' +
          allPcCodes.map(function(c){return '<option value="' + escapeHtml(c) + '"' + (f.pc === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';}).join('') +
        '</select>' +
        '<select class="field-select" onchange="setNametagFilter(\'role\', this.value)">' +
          '<option value="all"' + (f.role === 'all' ? ' selected' : '') + '>All roles</option>' +
          '<option value="exec"' + (f.role === 'exec' ? ' selected' : '') + '>Exec</option>' +
          '<option value="pm"' + (f.role === 'pm' ? ' selected' : '') + '>PM</option>' +
          '<option value="brother"' + (f.role === 'brother' ? ' selected' : '') + '>Brother</option>' +
        '</select>' +
        '<select class="field-select" onchange="setNametagFilter(\'status\', this.value)">' +
          '<option value="active"' + (f.status === 'active' ? ' selected' : '') + '>Active</option>' +
          '<option value="all"' + (f.status === 'all' ? ' selected' : '') + '>All statuses</option>' +
          '<option value="on_leave"' + (f.status === 'on_leave' ? ' selected' : '') + '>On leave</option>' +
          '<option value="alumnus"' + (f.status === 'alumnus' ? ' selected' : '') + '>Alumnus</option>' +
        '</select>' +
        '<span class="brothers-count">' + filtered.length + ' brothers</span>' +
      '</div>' +
      '<div class="nametag-picker-actions">' +
        '<button class="btn small" onclick="selectAllVisibleForNametag()">Select all visible</button>' +
        '<button class="btn small" onclick="clearNametagSelection()">Clear selection</button>' +
        '<span class="selection-count">' + state.nametagSelected.size + ' selected</span>' +
      '</div>' +
      '<table class="brothers-table nametag-picker-table">' +
        '<thead><tr>' +
          '<th style="width:34px"></th>' +
          '<th>Name</th><th>PC</th><th>Role</th>' +
          '<th>' + (eventLabel ? 'Status for "' + escapeHtml(eventLabel) + '"' : 'Print history') + '</th>' +
        '</tr></thead><tbody>' +
        filtered.map(function(b) {
          var selected = state.nametagSelected.has(b.id);
          var printedHere = eventLabel && isPrintedForEvent(b.id, eventLabel);
          var reprint = state.nametagReprint.has(b.id);
          var nameRaw = ((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')).trim();
          var name = nameRaw ? escapeHtml(nameRaw) : '<span style="color:var(--fg-muted)">(unnamed)</span>';
          var roleCell = b.role
            ? '<span class="brother-badge ' + (b.role === 'PM' ? 'role-pm' : isExecRole(b.role) ? 'role-exec' : '') + '">' + escapeHtml(b.role) + '</span>'
            : '';
          var statusCell = '';
          if (eventLabel) {
            if (printedHere && !reprint) {
              statusCell = '<span class="nametag-printed-badge">✓ printed</span>' +
                ' <button class="nametag-reprint-toggle" onclick="event.stopPropagation(); toggleReprintForBrother(\'' + b.id + '\')">Reprint</button>';
            } else if (printedHere && reprint) {
              statusCell = '<span class="nametag-reprint-on">↺ will reprint</span>' +
                ' <button class="nametag-reprint-toggle" onclick="event.stopPropagation(); toggleReprintForBrother(\'' + b.id + '\')">Cancel</button>';
            } else {
              statusCell = '<span style="color:var(--fg-muted); font-size:11px;">—</span>';
            }
          } else {
            var total = getNametagPrintsForBrother(b.id).length;
            statusCell = total
              ? '<span style="font-size:11px; color:var(--fg-muted);">' + total + ' prior print' + (total === 1 ? '' : 's') + '</span>'
              : '<span style="color:var(--fg-muted); font-size:11px;">—</span>';
          }
          return '<tr class="' + (selected ? 'selected-row' : '') + '" onclick="toggleBrotherSelectionForNametag(\'' + b.id + '\')">' +
            '<td><input type="checkbox" class="nametag-checkbox" ' + (selected ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleBrotherSelectionForNametag(\'' + b.id + '\')"></td>' +
            '<td class="brother-name">' + name + '</td>' +
            '<td>' + escapeHtml(b.pledge_class_code || '—') + '</td>' +
            '<td>' + roleCell + '</td>' +
            '<td>' + statusCell + '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table>' +
    '</div>';
  }

  function renderNametagPreviewPane() {
    if (!state.brothersLoaded) {
      return '<div class="nametag-preview-empty">Loading brothers…</div>';
    }
    var filtered = getNametagFilteredBrothers();
    var previewId = state.nametagPreviewBrotherId;
    if (!previewId || !state.brothers.find(function(b){return b.id === previewId;})) {
      var firstSelected = Array.from(state.nametagSelected)[0];
      previewId = firstSelected || (filtered[0] && filtered[0].id);
    }
    var b = state.brothers.find(function(x){return x.id === previewId;});
    if (!b) {
      return '<div class="nametag-preview-empty">' +
        '<div style="font-family:\'Playfair Display\',serif; font-style:italic;">Pick a brother to preview</div>' +
        '<div style="font-size:11px; margin-top:6px;">Click any row in the picker.</div>' +
      '</div>';
    }
    return '<div class="nametag-preview-label">Preview · ' + escapeHtml((b.preferred_name || b.first_name || '') + ' ' + (b.last_name || '')) + '</div>' +
      '<div class="nametag-preview-card">' +
        renderNametagCardHTML(b) +
      '</div>' +
      '<div class="nametag-preview-help">Updates in real time as you change template/overrides. Click a row to preview that brother.</div>';
  }

  function renderNametagGenerateBar() {
    var plan = getNametagPrintPlan();
    var label = state.nametagEventLabel.trim();
    var knownLabels = getKnownEventLabels();
    var canGenerate = label.length > 0 && plan.toPrint.length > 0 && !state.nametagGenerating;
    return '<div class="nametag-generate-bar">' +
      '<label class="override-field">' +
        '<span class="field-label">Event label (required)</span>' +
        '<input type="text" class="field-input" list="nametag-event-labels" ' +
          'placeholder="e.g. BFC Mixer 2026" ' +
          'value="' + escapeHtml(state.nametagEventLabel) + '" ' +
          'oninput="setNametagEventLabel(this.value)">' +
        '<datalist id="nametag-event-labels">' +
          knownLabels.map(function(l){return '<option value="' + escapeHtml(l) + '"></option>';}).join('') +
        '</datalist>' +
      '</label>' +
      '<div class="nametag-print-plan">' +
        '<div class="plan-line"><strong>' + plan.toPrint.length + '</strong> to print</div>' +
        (plan.skipped.length
          ? '<div class="plan-line plan-skipped">' + plan.skipped.length + ' skipped (already printed)</div>'
          : '<div class="plan-line" style="color:var(--fg-muted)">0 skipped</div>') +
      '</div>' +
      '<button class="btn primary nametag-generate-btn" ' +
        (canGenerate ? '' : 'disabled ') +
        'onclick="generateNametagPDF()">' +
        (state.nametagGenerating ? 'Generating…' : 'Generate PDF') +
      '</button>' +
    '</div>';
  }

  function renderNametagHistoryRow(brotherId) {
    var prints = getNametagPrintsForBrother(brotherId);
    if (prints.length === 0) return '';
    var latest = prints[0]; // sorted DESC by printed_at in loader
    var latestDate = new Date(latest.printed_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    return '<div class="brother-profile-row">' +
      '<div class="key">Nametag prints</div>' +
      '<div>' + prints.length + ' total · most recent: ' + escapeHtml(latest.event_label) + ' (' + latestDate + ')</div>' +
    '</div>';
  }

  // ----- PDF generation -----
  async function generateNametagPDF() {
    if (!window.jspdf || !window.html2canvas) {
      toast('PDF libraries not loaded — refresh the page and try again.', 'error');
      return;
    }
    var eventLabel = state.nametagEventLabel.trim();
    if (!eventLabel) {
      toast('Set an event label before generating.', 'error');
      return;
    }
    var plan = getNametagPrintPlan();
    if (plan.toPrint.length === 0) {
      toast('Nothing to print. Select brothers, or toggle Reprint on already-printed rows.', 'error');
      return;
    }

    state.nametagGenerating = true;
    render();

    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      var jsPDF = window.jspdf.jsPDF;
      var dims = getActiveDimensions();
      var doc = new jsPDF({ unit: 'in', format: [dims.pageW, dims.pageH], orientation: 'portrait' });
      var perPage = dims.cols * dims.rows;

      var stage = document.createElement('div');
      stage.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden;';
      document.body.appendChild(stage);

      for (var i = 0; i < plan.toPrint.length; i++) {
        var b = state.brothers.find(function(x) { return x.id === plan.toPrint[i]; });
        if (!b) continue;
        stage.innerHTML = renderNametagCardHTML(b);
        var cardEl = stage.firstElementChild;
        // eslint-disable-next-line no-await-in-loop
        var canvas = await window.html2canvas(cardEl, { scale: 3, backgroundColor: null, logging: false });
        var posInPage = i % perPage;
        if (posInPage === 0 && i > 0) doc.addPage();
        var col = posInPage % dims.cols;
        var row = Math.floor(posInPage / dims.cols);
        var x = dims.marginLeft + col * (dims.cardW + dims.cardGapX);
        var y = dims.marginTop  + row * (dims.cardH + dims.cardGapY);
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, dims.cardW, dims.cardH);
      }
      stage.remove();

      var safeLabel = eventLabel.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
      var today = new Date().toISOString().slice(0, 10);
      doc.save('nametags_' + safeLabel + '_' + today + '.pdf');

      await recordNametagPrints(plan.toPrint, eventLabel, NAMETAG_TEMPLATES[state.nametagTemplate].label);

      state.nametagSelected.clear();
      state.nametagReprint.clear();
      toast('Printed ' + plan.toPrint.length + ' nametag' + (plan.toPrint.length === 1 ? '' : 's') +
            (plan.skipped.length ? ' · skipped ' + plan.skipped.length + ' already-printed' : ''));
    } catch (e) {
      console.error('PDF generation failed', e);
      toast('PDF generation failed — check console.', 'error');
    } finally {
      state.nametagGenerating = false;
      render();
    }
  }

  // ----- Window-exposed handlers -----
  window.setNametagFilter = function(key, value) {
    state.nametagFilter = Object.assign({}, state.nametagFilter, { [key]: value });
    render();
    if (key === 'search') {
      var el = document.querySelector('.nametag-picker .brothers-toolbar .search');
      if (el) { el.focus(); el.setSelectionRange(value.length, value.length); }
    }
  };

  window.setNametagTemplate = function(key) {
    if (!NAMETAG_TEMPLATES[key]) return;
    state.nametagTemplate = key;
    state.nametagOverrides.bgColor = null;
    state.nametagOverrides.accentColor = null;
    render();
  };

  window.setNametagOverride = function(key, value) {
    if (value === '') value = null;
    state.nametagOverrides = Object.assign({}, state.nametagOverrides, { [key]: value });
    render();
  };

  window.resetNametagOverrides = function() {
    state.nametagOverrides = { averyPreset: '5395', dimensions: null, nameStyle: null, roleVisible: 'auto', bgColor: null, accentColor: null };
    render();
  };

  window.toggleBrotherSelectionForNametag = function(id) {
    if (state.nametagSelected.has(id)) state.nametagSelected.delete(id);
    else state.nametagSelected.add(id);
    state.nametagPreviewBrotherId = id;
    render();
  };

  window.selectAllVisibleForNametag = function() {
    getNametagFilteredBrothers().forEach(function(b) { state.nametagSelected.add(b.id); });
    render();
  };

  window.clearNametagSelection = function() {
    state.nametagSelected.clear();
    state.nametagReprint.clear();
    render();
  };

  window.toggleReprintForBrother = function(id) {
    if (state.nametagReprint.has(id)) state.nametagReprint.delete(id);
    else state.nametagReprint.add(id);
    render();
  };

  window.setNametagEventLabel = function(value) {
    state.nametagEventLabel = value;
    render();
    var el = document.querySelector('.nametag-generate-bar input[type="text"]');
    if (el) { el.focus(); el.setSelectionRange(value.length, value.length); }
  };

  window.setNametagPreviewBrother = function(id) {
    state.nametagPreviewBrotherId = id;
    render();
  };


  if (sb) init();
</script>
</body>
</html>
