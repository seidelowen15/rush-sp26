  window.switchView = function(v) { state.currentView = v; render(); };

  window.logout = function() {
    state.currentUser = null;
    sessionStorage.removeItem('rush26_user');
    render();
  };

  // ============================================================
  // HEADER
  // ============================================================
  function renderHeader() {
    const titles = {
      dashboard: ['Home', ''],
      notes: ['Notes', '& ideas'],
      calendar: ['Calendar', ''],
      schedule: ['Schedule', '& events'],
      tasks: ['Tasks', '& to-dos'],
      candidates: ['Candidates', ''],
      brothers: ['Brothers', '& chapter'],
      nametags: ['Nametags', '& print'],
    };
    const parts = titles[state.currentView];
    const main = parts[0], em = parts[1];
    const today = new Date();
    const dateStr = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    return '' +
      '<div class="page-header">' +
        '<h1 class="page-title">' + main + (em ? ' <em>' + em + '</em>' : '') + '</h1>' +
        '<div class="page-meta">' +
          '<div>' + dateStr + '</div>' +
          '<div class="live"><span class="live-dot"></span> live · synced</div>' +
        '</div>' +
      '</div>';
  }

  // ============================================================
  // DASHBOARD
  // ============================================================
  function renderDashboard() {
    const me = MEMBERS.find(m => m.id === state.currentUser);
    const openTasks = state.tasks.filter(t => t.status !== 'done').length;
    const myTasks = state.tasks.filter(t => (t.assigneeId === state.currentUser || t.assigneeId === 'all') && t.status !== 'done').length;
    const doneTasks = state.tasks.filter(t => t.status === 'done').length;
    const activeCands = state.candidates.filter(c => c.status !== 'rejected').length;
    const now = Date.now();
    const upcomingEvents = state.events
      .filter(e => eventEndTime(e) >= now - 3600000)
      .sort((a, b) => new Date(a.startISO) - new Date(b.startISO))
      .slice(0, 4);
    const pinnedNotes = state.notes.filter(n => n.pinned).slice(0, 2);
    const recentNotes = state.notes.slice().filter(n => !n.pinned).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 5);
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

    const pinnedBanner = pinnedNotes.length > 0 ?
      '<div class="pinned-banner">' +
        '<div class="pinned-banner-title">✦ Pinned · ' + pinnedNotes.length + ' note' + (pinnedNotes.length > 1 ? 's' : '') + '</div>' +
        pinnedNotes.map(n =>
          '<div style="cursor:pointer; padding:4px 0;" onclick="openNoteEditor(\'' + n.id + '\')">' +
            '<h3>' + escapeHtml(n.title || 'Untitled') + '</h3>' +
            '<p>' + escapeHtml((n.body || '').slice(0, 120)) + ((n.body || '').length > 120 ? '…' : '') + '</p>' +
          '</div>'
        ).join('') +
      '</div>' : '';

    return '' +
      '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; color:var(--fg-soft); margin-bottom:22px;">' +
        greeting + ', ' + (me ? escapeHtml(me.name) : '') + '.' +
      '</div>' +
      pinnedBanner +
      '<div class="stat-row">' +
        '<div class="stat-card"><div class="stat-label">Candidates</div><div class="stat-value">' + activeCands + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">My open tasks</div><div class="stat-value"><em>' + myTasks + '</em></div></div>' +
        '<div class="stat-card"><div class="stat-label">Team open</div><div class="stat-value">' + openTasks + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">Done</div><div class="stat-value">' + doneTasks + '</div></div>' +
      '</div>' +
      '<div class="dash-grid">' +
        '<div class="section-card">' +
          '<div class="section-title">Recent notes <button class="btn small" onclick="switchView(\'notes\')">View all →</button></div>' +
          (recentNotes.length === 0
            ? '<div style="color:var(--fg-muted); font-style:italic; font-family:Playfair Display,serif; padding: 16px 0;">No notes yet.</div>'
            : recentNotes.map(n => {
                const author = MEMBERS.find(m => m.id === n.authorId);
                return '<div class="recent-item" onclick="openNoteEditor(\'' + n.id + '\')">' +
                  '<div style="min-width:0; flex:1;">' +
                    '<div class="recent-title">' + escapeHtml(n.title || 'Untitled') + '</div>' +
                    '<div class="recent-meta" style="margin-top:4px">' + (author ? escapeHtml(author.name) : '—') + ' · ' + timeAgo(n.updatedAt) + '</div>' +
                  '</div>' +
                  '<div style="font-family:\'Playfair Display\',serif; font-size:22px; color:var(--gold); opacity:0.5;">→</div>' +
                '</div>';
              }).join('')) +
        '</div>' +
        '<div class="section-card">' +
          '<div class="section-title">Coming up <button class="btn small" onclick="switchView(\'calendar\')">→</button></div>' +
          (upcomingEvents.length === 0
            ? '<div style="color:var(--fg-muted); font-style:italic; font-family:Playfair Display,serif;">Nothing scheduled.</div>'
            : upcomingEvents.map(e => {
                const d = new Date(e.startISO);
                const cat = state.eventCategories.find(c => c.id === e.categoryId) || state.eventCategories[0];
                return '<div class="recent-item" onclick="openEventModal(null, \'' + e.id + '\')">' +
                  '<div style="display:flex; gap:12px; align-items:center; min-width:0;">' +
                    '<div style="text-align:center; min-width:40px;">' +
                      '<div style="font-family:\'JetBrains Mono\',monospace; font-size:9px; color:var(--fg-muted); text-transform:uppercase;">' + d.toLocaleDateString('en-US',{month:'short'}) + '</div>' +
                      '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-weight:700; color:' + (cat ? cat.color : '#0A2463') + ';">' + d.getDate() + '</div>' +
                    '</div>' +
                    '<div style="min-width:0;">' +
                      '<div class="recent-title" style="font-size:14px">' + escapeHtml(e.title) + '</div>' +
                      '<div class="recent-meta" style="margin-top:2px;">' + formatEventTime(e) + (e.location ? ' · ' + escapeHtml(e.location) : '') + '</div>' +
                    '</div>' +
                  '</div>' +
                '</div>';
              }).join('')) +
        '</div>' +
      '</div>';
  }

  // ============================================================
  // NOTES
  // ============================================================
  function renderNotesView() {
    const query = state.notesSearchQuery.toLowerCase().trim();
    let filtered = state.notes;
    if (query) {
      filtered = filtered.filter(n =>
        (n.title || '').toLowerCase().includes(query) ||
        (n.body || '').toLowerCase().includes(query) ||
        (n.tags || []).some(t => t.toLowerCase().includes(query))
      );
    }
    filtered = filtered.slice().sort((a, b) => {
      if (!!b.pinned - !!a.pinned !== 0) return !!b.pinned - !!a.pinned;
      return b.updatedAt - a.updatedAt;
    });

    return '' +
      '<div class="toolbar">' +
        '<input type="text" class="search-input" id="searchInput" placeholder="Search notes, tags, content…" value="' + escapeHtml(state.notesSearchQuery) + '" oninput="handleNoteSearch(this.value)" />' +
        '<div class="view-switcher">' +
          '<button class="view-switch-btn ' + (state.notesViewMode === 'grid' ? 'active' : '') + '" onclick="setNoteView(\'grid\')">Grid</button>' +
          '<button class="view-switch-btn ' + (state.notesViewMode === 'list' ? 'active' : '') + '" onclick="setNoteView(\'list\')">List</button>' +
        '</div>' +
        '<button class="btn primary" onclick="openNoteEditor()">+ New note</button>' +
      '</div>' +
      (state.notesViewMode === 'grid'
        ? '<div class="notes-grid">' + renderNotesGrid(filtered) + '</div>'
        : '<div class="notes-list">' + renderNotesList(filtered) + '</div>');
  }

  function renderNotesGrid(notes) {
    if (notes.length === 0) {
      return '<div class="empty-state" style="grid-column: 1/-1;">' +
        '<div class="ornament">✎</div>' +
        '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; margin-bottom:8px;">No notes yet</div>' +
        '<div style="font-size:13px;">Create the first one — it\'ll show up for the whole committee.</div>' +
      '</div>';
    }
    return notes.map(n => {
      const author = MEMBERS.find(m => m.id === n.authorId);
      const tags = (n.tags || []).slice(0, 3);
      return '<div class="note-card" data-color="' + (n.color || 'navy') + '" onclick="openNoteEditor(\'' + n.id + '\')">' +
        '<button class="note-pin ' + (n.pinned ? 'pinned' : '') + '" onclick="event.stopPropagation(); togglePin(\'' + n.id + '\')" title="' + (n.pinned ? 'Unpin' : 'Pin') + '">' + (n.pinned ? '★' : '☆') + '</button>' +
        '<div class="note-title">' + escapeHtml(n.title || 'Untitled') + '</div>' +
        '<div class="note-preview">' + escapeHtml(n.body || 'No content…') + '</div>' +
        (tags.length > 0 ? '<div class="note-tags">' + tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + ((n.tags || []).length > 3 ? '<span class="tag">+' + (n.tags.length - 3) + '</span>' : '') + '</div>' : '') +
        '<div class="note-footer">' +
          '<div class="note-author">' +
            (author ? '<div class="mini-avatar" style="background:' + author.color + '">' + author.name[0] + '</div>' + escapeHtml(author.name) : '—') +
          '</div>' +
          '<div>' + timeAgo(n.updatedAt) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderNotesList(notes) {
    if (notes.length === 0) {
      return '<div class="empty-state"><div class="ornament">✎</div><div>No notes yet</div></div>';
    }
    return '<div class="list-row header"><div></div><div>Title</div><div>Tags</div><div>Author</div><div>Updated</div><div></div></div>' +
      notes.map(n => {
        const author = MEMBERS.find(m => m.id === n.authorId);
        const colorMap = { navy: 'var(--navy)', gold: 'var(--gold)', crimson: 'var(--danger)', sage: 'var(--success)', ink: 'var(--fg)' };
        const color = colorMap[n.color] || 'var(--navy)';
        const tags = (n.tags || []).slice(0, 2);
        return '<div class="list-row" onclick="openNoteEditor(\'' + n.id + '\')">' +
          '<div class="list-color-dot" style="background:' + color + '"></div>' +
          '<div><div class="list-title">' + (n.pinned ? '★ ' : '') + escapeHtml(n.title || 'Untitled') + '</div></div>' +
          '<div style="display:flex; gap:4px; flex-wrap:wrap;">' + tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace; font-size:11px; color:var(--fg-muted);">' + (author ? escapeHtml(author.name) : '—') + '</div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace; font-size:10px; color:var(--fg-muted); text-transform:uppercase; letter-spacing:0.08em;">' + timeAgo(n.updatedAt) + '</div>' +
          '<div style="color:var(--fg-muted); text-align:right;">→</div>' +
        '</div>';
      }).join('');
  }

  window.setNoteView = function(mode) { state.notesViewMode = mode; render(); };

  window.handleNoteSearch = function(q) {
    state.notesSearchQuery = q;
    const qLow = q.toLowerCase().trim();
    const notes = state.notes
      .filter(n => !qLow || (n.title || '').toLowerCase().includes(qLow) || (n.body || '').toLowerCase().includes(qLow) || (n.tags || []).some(t => t.toLowerCase().includes(qLow)))
      .sort((a, b) => (!!b.pinned - !!a.pinned) || (b.updatedAt - a.updatedAt));
    const grid = document.querySelector('.notes-grid');
    const list = document.querySelector('.notes-list');
    if (grid) grid.innerHTML = renderNotesGrid(notes);
    if (list) list.innerHTML = renderNotesList(notes);
  };

  window.togglePin = async function(id) {
    const n = state.notes.find(x => x.id === id);
    if (!n) return;
    n.pinned = !n.pinned;
    await persist('notes', state.notes);
    render();
  };

  window.openNoteEditor = function(id) {
    state.editingNoteId = id || null;
    const note = id ? state.notes.find(n => n.id === id) : null;
    document.getElementById('editorTitle').value = note?.title || '';
    document.getElementById('editorBody').value = note?.body || '';
    state.editingColor = note?.color || 'navy';
    state.editingNoteTags = (note?.tags || []).slice();

    document.querySelectorAll('#colorPicker .color-swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.color === state.editingColor);
      s.onclick = () => {
        state.editingColor = s.dataset.color;
        document.querySelectorAll('#colorPicker .color-swatch').forEach(x => x.classList.remove('selected'));
        s.classList.add('selected');
      };
    });
    renderEditorTags();
    document.getElementById('deleteNoteBtn').style.display = id ? 'inline-flex' : 'none';
    document.getElementById('noteModal').classList.add('active');
    setTimeout(() => document.getElementById('editorTitle').focus(), 50);
  };

  function renderEditorTags() {
    const row = document.getElementById('editorTagRow');
    row.innerHTML = '<span class="toolbar-label">Tags:</span>' +
      state.editingNoteTags.map((t, i) =>
        '<span class="tag removable" onclick="removeNoteTag(' + i + ')">' + escapeHtml(t) + '<span class="chip-remove">✕</span></span>'
      ).join('') +
      '<input type="text" class="tag-input" id="newTagInput" placeholder="+ tag" maxlength="20" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addNoteTag();}" />' +
      '<button class="btn small" onclick="addNoteTag()">Add</button>';
  }

  window.addNoteTag = function() {
    const input = document.getElementById('newTagInput');
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    if (state.editingNoteTags.includes(val)) {
      toast('Tag already added', 'default');
      input.value = '';
      return;
    }
    state.editingNoteTags.push(val);
    input.value = '';
    renderEditorTags();
    setTimeout(() => document.getElementById('newTagInput')?.focus(), 10);
  };

  window.removeNoteTag = function(i) {
    state.editingNoteTags.splice(i, 1);
    renderEditorTags();
  };

  window.closeNoteEditor = function() {
    document.getElementById('noteModal').classList.remove('active');
    state.editingNoteId = null;
  };

  window.saveNote = async function() {
    const title = document.getElementById('editorTitle').value.trim();
    const body = document.getElementById('editorBody').value.trim();
    if (!title && !body) { closeNoteEditor(); return; }

    if (state.editingNoteId) {
      const note = state.notes.find(n => n.id === state.editingNoteId);
      if (note) {
        note.title = title;
        note.body = body;
        note.color = state.editingColor;
        note.tags = state.editingNoteTags.slice();
        note.updatedAt = Date.now();
        note.lastEditedBy = state.currentUser;
      }
    } else {
      state.notes.unshift({
        id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title, body,
        color: state.editingColor,
        tags: state.editingNoteTags.slice(),
        pinned: false,
        authorId: state.currentUser,
        lastEditedBy: state.currentUser,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
    }
    await persist('notes', state.notes);
    toast('Note saved', 'success');
    closeNoteEditor();
    render();
  };

  window.deleteCurrentNote = async function() {
    if (!state.editingNoteId) return;
    if (!confirm('Delete this note? It will be removed for the committee.')) return;
    state.notes = state.notes.filter(n => n.id !== state.editingNoteId);
    await persist('notes', state.notes);
    toast('Note deleted', 'default');
    closeNoteEditor();
    render();
  };

  // ============================================================
  // CALENDAR
  // ============================================================
  function renderCalendar() {
    const d = state.calendarDate;
    const year = d.getFullYear();
    const month = d.getMonth();
    const monthName = d.toLocaleDateString('en-US', { month: 'long' });
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const todayStr = new Date().toDateString();

    const cells = [];
    for (let i = startWeekday - 1; i >= 0; i--) {
      cells.push({ date: new Date(year, month - 1, daysInPrev - i), otherMonth: true });
    }
    for (let i = 1; i <= daysInMonth; i++) {
      cells.push({ date: new Date(year, month, i), otherMonth: false });
    }
    while (cells.length % 7 !== 0 || cells.length < 42) {
      const last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getTime() + 86400000), otherMonth: true });
      if (cells.length >= 42) break;
    }

    const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const filteredEvents = state.calendarFilterCategory === 'all'
      ? state.events
      : state.events.filter(e => e.categoryId === state.calendarFilterCategory);

    return '' +
      '<div class="calendar-header">' +
        '<div class="calendar-month">' + monthName + ' <em>' + year + '</em></div>' +
        '<div class="calendar-nav">' +
          '<button class="btn btn-icon" onclick="calNav(-1)">‹</button>' +
          '<button class="btn" onclick="calToday()">Today</button>' +
          '<button class="btn btn-icon" onclick="calNav(1)">›</button>' +
          '<button class="btn primary" onclick="openEventModal()" style="margin-left:6px">+ Event</button>' +
        '</div>' +
      '</div>' +
      '<div class="legend">' +
        '<span>Filter:</span>' +
        '<button class="chip ' + (state.calendarFilterCategory === 'all' ? 'selected' : '') + '" onclick="setCalFilter(\'all\')">All</button>' +
        state.eventCategories.map(c =>
          '<button class="chip ' + (state.calendarFilterCategory === c.id ? 'selected' : '') + '" onclick="setCalFilter(\'' + c.id + '\')" style="' + (state.calendarFilterCategory === c.id ? 'background:' + c.color + '; border-color:' + c.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.calendarFilterCategory === c.id ? 'var(--paper)' : c.color) + '"></span>' + escapeHtml(c.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="calendar-grid">' +
        dayHeaders.map(h => '<div class="cal-day-header">' + h + '</div>').join('') +
        cells.map(c => {
          const dateKey = c.date.toDateString();
          const dayEvents = filteredEvents.filter(e => new Date(e.startISO).toDateString() === dateKey)
                             .sort((a, b) => new Date(a.startISO) - new Date(b.startISO));
          const isToday = dateKey === todayStr;
          const dateIso = c.date.toISOString();
          return '<div class="cal-cell ' + (c.otherMonth ? 'other-month' : '') + ' ' + (isToday ? 'today' : '') + '" onclick="openEventModal(\'' + dateIso + '\')">' +
            '<div class="cal-date">' + c.date.getDate() + '</div>' +
            dayEvents.slice(0, 3).map(e => {
              const cat = state.eventCategories.find(cc => cc.id === e.categoryId) || state.eventCategories[0];
              return '<div class="cal-event" style="background:' + (cat ? cat.color : '#0A2463') + '" onclick="event.stopPropagation(); openEventModal(null, \'' + e.id + '\')">' + escapeHtml(formatEventShort(e)) + '</div>';
            }).join('') +
            (dayEvents.length > 3 ? '<div style="font-size:9px; color:var(--fg-muted); font-family:\'JetBrains Mono\',monospace;">+' + (dayEvents.length - 3) + '</div>' : '') +
          '</div>';
        }).join('') +
      '</div>' +
      '<div style="margin-top: 14px; font-family:\'JetBrains Mono\',monospace; font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.12em;">Click a day to add · click an event to edit</div>';
  }

  window.openEventModal = function(dateIso, eventId) {

    state.editingEventId = eventId || null;

    document.getElementById('eventModalTitle').innerHTML = existing ? 'Edit <em>event</em>' : 'New <em>event</em>';

      document.getElementById('eventEnd').value = existing.endISO && existing.hasTime ? toTimeInputValue(new Date(existing.endISO)) : '';

      document.getElementById('eventNotes').value = existing.notes || '';
      state.editingEvent.categoryId = existing.categoryId || 'rush';

      document.getElementById('eventNotes').value = '';

  window.addEventCategory = async function() {
    const input = document.getElementById('newEventCatName');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    // Prevent duplicates (case-insensitive)
    if (state.eventCategories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      toast('Category "' + name + '" already exists', 'error');
      input.select();
      return;
    }
    const newCat = { id: 'ec_' + Date.now(), name, color: state.newEventCatColor, builtin: false };
    state.eventCategories.push(newCat);
    state.editingEvent.categoryId = newCat.id;
    await persist('event_cats', state.eventCategories);
    input.value = '';
    renderEventCategoryChips();
    toast('Added "' + name + '"', 'success');
  };

  window.removeEventCategory = async function(id) {
    if (!confirm('Remove this category? Events using it will move to "Rush".')) return;
    state.eventCategories = state.eventCategories.filter(c => c.id !== id);
    state.events.forEach(e => { if (e.categoryId === id) e.categoryId = 'rush'; });
    if (state.editingEvent.categoryId === id) state.editingEvent.categoryId = 'rush';
    await persist('event_cats', state.eventCategories);
    await persist('events', state.events);
    renderEventCategoryChips();
  };

  window.saveEvent = async function() {
    const title = document.getElementById('eventTitle').value.trim();
    const dateStr = document.getElementById('eventDate').value;
    const startStr = document.getElementById('eventStart').value;
    const endStr = document.getElementById('eventEnd').value;
    const location = document.getElementById('eventLocation').value.trim();
    const notes = document.getElementById('eventNotes').value.trim();

    if (!title) { toast('Please enter an event name.', 'error'); document.getElementById('eventTitle').focus(); return; }
    if (!dateStr) { toast('Please pick a date.', 'error'); document.getElementById('eventDate').focus(); return; }

    const hasTime = !!startStr;
    const startISO = hasTime
      ? new Date(dateStr + 'T' + startStr).toISOString()
      : new Date(dateStr + 'T00:00:00').toISOString();
    const endISO = (hasTime && endStr) ? new Date(dateStr + 'T' + endStr).toISOString() : null;

    if (state.editingEventId) {
      const ev = state.events.find(e => e.id === state.editingEventId);
      if (ev) Object.assign(ev, { title, startISO, endISO, hasTime, location, notes, categoryId: state.editingEvent.categoryId, updatedAt: Date.now() });
    } else {
      state.events.push({
        id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title, startISO, endISO, hasTime, location, notes,
        categoryId: state.editingEvent.categoryId,
        createdBy: state.currentUser,
        createdAt: Date.now(), updatedAt: Date.now(),
      });
    }
    await persist('events', state.events);
    toast('Event saved', 'success');
    closeEventModal();
    render();
  };

  window.deleteCurrentEvent = async function() {
    if (!state.editingEventId) return;
    if (!confirm('Delete this event?')) return;
    state.events = state.events.filter(e => e.id !== state.editingEventId);
    await persist('events', state.events);
    toast('Event deleted', 'default');
    closeEventModal();
    render();
  };

  // ============================================================
  // TASKS
  // ============================================================
  function renderTasks() {
    const filteredTasks = state.tasks.filter(t => {
      if (state.taskFilterAssignee !== 'all') {
        // When filtering by a specific person, include their individually-assigned tasks
        // AND tasks assigned to "All" (since those apply to everyone).
        if (t.assigneeId !== state.taskFilterAssignee && t.assigneeId !== 'all') return false;
      }
      if (state.taskFilterCategory !== 'all' && t.categoryId !== state.taskFilterCategory) return false;
      return true;
    });

    const columns = [
      { id: 'todo', title: 'To do', filter: t => t.status === 'todo' },
      { id: 'progress', title: 'In progress', filter: t => t.status === 'progress' },
      { id: 'done', title: 'Done', filter: t => t.status === 'done' },
    ];

    return '' +
      '<div class="toolbar">' +
        '<button class="btn primary" onclick="openTaskModal()">+ New task</button>' +
      '</div>' +
      '<div class="legend">' +
        '<span>Assignee:</span>' +
        '<button class="chip ' + (state.taskFilterAssignee === 'all' ? 'selected' : '') + '" onclick="setTaskFilter(\'assignee\',\'all\')">Everyone</button>' +
        MEMBERS.map(m =>
          '<button class="chip ' + (state.taskFilterAssignee === m.id ? 'selected' : '') + '" onclick="setTaskFilter(\'assignee\',\'' + m.id + '\')" style="' + (state.taskFilterAssignee === m.id ? 'background:' + m.color + '; border-color:' + m.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.taskFilterAssignee === m.id ? 'var(--paper)' : m.color) + '"></span>' + escapeHtml(m.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="legend">' +
        '<span>Category:</span>' +
        '<button class="chip ' + (state.taskFilterCategory === 'all' ? 'selected' : '') + '" onclick="setTaskFilter(\'category\',\'all\')">All</button>' +
        state.taskCategories.map(c =>
          '<button class="chip ' + (state.taskFilterCategory === c.id ? 'selected' : '') + '" onclick="setTaskFilter(\'category\',\'' + c.id + '\')" style="' + (state.taskFilterCategory === c.id ? 'background:' + c.color + '; border-color:' + c.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.taskFilterCategory === c.id ? 'var(--paper)' : c.color) + '"></span>' + escapeHtml(c.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="tasks-layout">' +
        columns.map(col => {
          const items = filteredTasks.filter(col.filter).sort((a, b) => {
            const prio = { high: 0, normal: 1, low: 2 };
            return (prio[a.priority || 'normal'] - prio[b.priority || 'normal']) || (b.createdAt - a.createdAt);
          });
          return '<div class="task-column">' +
            '<div class="task-column-header">' +
              '<div class="task-column-title">' + col.title + '</div>' +
              '<div class="task-count">' + items.length + '</div>' +
            '</div>' +
            items.map(t => renderTaskCard(t, col.id)).join('') +
            (items.length === 0 ? '<div style="color:var(--fg-muted); font-style:italic; font-family:Playfair Display,serif; font-size:14px; padding:16px 0; text-align:center;">Nothing here.</div>' : '') +
          '</div>';
        }).join('') +
      '</div>';
  }

  function renderTaskCard(t, colId) {
    const isAll = t.assigneeId === 'all';
    const assignee = isAll ? null : MEMBERS.find(m => m.id === t.assigneeId);
    const cat = state.taskCategories.find(c => c.id === t.categoryId) || state.taskCategories[0];
    const accentColor = cat ? cat.color : '#6B7280';

    let dueChip = '';
    if (t.dueISO && t.status !== 'done') {
      const due = new Date(t.dueISO);
      const now = new Date();
      const diffDays = Math.round((due - now) / 86400000);
      const dueLabel = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      if (diffDays < 0) dueChip = '<span class="task-chip overdue">⚠ Overdue · ' + dueLabel + '</span>';
      else if (diffDays <= 2) dueChip = '<span class="task-chip due-soon">Due ' + dueLabel + '</span>';
      else dueChip = '<span class="task-chip">Due ' + dueLabel + '</span>';
    }

    const priorityChip = t.priority === 'high' ? '<span class="task-chip priority-high">‼ High</span>' : '';

    const assigneeChip = isAll
      ? '<span class="task-chip assignee" style="background:var(--gold-dark)">✦ All</span>'
      : (assignee ? '<span class="task-chip assignee" style="background:' + assignee.color + '">' + escapeHtml(assignee.name) + '</span>' : '');

    return '<div class="task-item ' + (t.status === 'done' ? 'done' : '') + '">' +
      '<div class="task-accent" style="background:' + accentColor + '"></div>' +
      '<div class="task-checkbox" onclick="toggleTaskDone(\'' + t.id + '\')">' + (t.status === 'done' ? '✓' : '') + '</div>' +
      '<div class="task-content">' +
        '<div class="task-text" onclick="openTaskModal(\'' + t.id + '\')">' + escapeHtml(t.text) + '</div>' +
        '<div class="task-meta-row">' +
          assigneeChip +
          (cat ? '<span class="task-chip"><span style="width:7px;height:7px;border-radius:50%;background:' + cat.color + ';display:inline-block"></span>' + escapeHtml(cat.name) + '</span>' : '') +
          priorityChip +
          dueChip +
        '</div>' +
        '<div class="task-footer">' +
          '<span>' + timeAgo(t.createdAt) + '</span>' +
          '<div style="display:flex; gap:4px;">' +
            (colId === 'todo' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'progress\')">Start</button>' : '') +
            (colId === 'progress' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'todo\')">← Back</button><button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'done\')">Done ✓</button>' : '') +
            (colId === 'done' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'progress\')">Reopen</button>' : '') +
            '<button class="task-action-btn" onclick="openTaskModal(\'' + t.id + '\')">Edit</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

    render();

  // ============================================================
  // SCHEDULE (personal availability week view)
  // ============================================================

  // Returns the Sunday at the start of the week containing `d`.
  function weekStart(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - x.getDay());
    x.setHours(0, 0, 0, 0);
    return x;
  }

  // Returns YYYY-MM-DD in local timezone for a Date.
  function isoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  // Returns an array of 7 Dates representing the days of the week containing `anchor`.
  function weekDays(anchor) {
    const start = weekStart(anchor);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      out.push(d);
    }
    return out;
  }

  // Converts "HH:MM" to minutes-from-midnight.
  function hmToMinutes(s) {
    if (!s) return 0;
    const [h, m] = s.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  // Given a series event and a date, returns the effective instance fields
  // (after applying any per-instance exception). Returns null if skipped.
  function resolveInstance(ev, dateStr) {
    if (ev.exceptions && Object.prototype.hasOwnProperty.call(ev.exceptions, dateStr)) {
      const ex = ev.exceptions[dateStr];
      if (ex === null) return null; // skipped
      return Object.assign({}, ev, ex);
    }
    return ev;
  }

  // Returns an array of {event, date, startMin, endMin, instanceDate, isException}
  // for all instances within [windowStart, windowEnd] (both Dates, inclusive of date).
  function expandSchedule(windowStart, windowEnd) {
    const out = [];
    const ws = new Date(windowStart); ws.setHours(0, 0, 0, 0);
    const we = new Date(windowEnd); we.setHours(23, 59, 59, 999);

    for (const ev of state.scheduleEvents) {
      if (ev.recurrence === 'once' || !ev.recurrence) {
        const d = new Date(ev.date + 'T00:00:00');
        if (d >= ws && d <= we) {
          const resolved = resolveInstance(ev, ev.date);
          if (resolved) {
            out.push({
              event: ev,
              date: new Date(ev.date + 'T00:00:00'),
              startMin: hmToMinutes(resolved.startTime),
              endMin: hmToMinutes(resolved.endTime),
              instanceDate: ev.date,
              title: resolved.title,
              location: resolved.location,
              notes: resolved.notes,
              isOneTime: true,
            });
          }
        }
      } else if (ev.recurrence === 'weekly') {
        const seriesStart = new Date(ev.startDate + 'T00:00:00');
        const seriesEnd = ev.untilDate ? new Date(ev.untilDate + 'T23:59:59') : we;
        const iterStart = seriesStart > ws ? seriesStart : ws;
        const iterEnd = seriesEnd < we ? seriesEnd : we;
        const wds = ev.weekdays || [];
        const cursor = new Date(iterStart);
        cursor.setHours(0, 0, 0, 0);
        while (cursor <= iterEnd) {
          if (wds.includes(cursor.getDay())) {
            const ds = isoDate(cursor);
            const resolved = resolveInstance(ev, ds);
            if (resolved) {
              out.push({
                event: ev,
                date: new Date(cursor),
                startMin: hmToMinutes(resolved.startTime),
                endMin: hmToMinutes(resolved.endTime),
                instanceDate: ds,
                title: resolved.title,
                location: resolved.location,
                notes: resolved.notes,
                isOneTime: false,
              });
            }
          }
          cursor.setDate(cursor.getDate() + 1);
        }
      }
    }
    return out;
  }

  function renderSchedule() {
    const isMobile = window.innerWidth <= 900;
    const wstart = weekStart(state.weekDate);
    const wend = new Date(wstart); wend.setDate(wend.getDate() + 6);
    const days = weekDays(state.weekDate);
    const todayStr = new Date().toDateString();

    const ranges = expandSchedule(wstart, wend);

    // Group by [dayIndex][ownerId] so overlapping events from the same person stack.
    const byDay = [[], [], [], [], [], [], []];
    for (const r of ranges) {
      const idx = Math.floor((r.date - wstart) / 86400000);
      if (idx >= 0 && idx < 7) byDay[idx].push(r);
    }

    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(h);

    const monthLabel = wstart.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Mobile: show one day at a time
    const activeDayIdx = isMobile ? state.mobileScheduleDay : -1;

    const headers = '<div class="sched-day-headers">' +
      '<div class="sched-day-header"></div>' +
      days.map((d, i) => {
        const isToday = d.toDateString() === todayStr;
        const isActive = i === activeDayIdx;
        return '<div class="sched-day-header ' + (isToday ? 'today' : '') + ' ' + (isMobile && !isActive ? '' : 'mobile-active') + '">' +
          '<span class="day-name">' + d.toLocaleDateString('en-US', { weekday: 'short' }) + '</span>' +
          '<span class="day-num">' + d.getDate() + '</span>' +
        '</div>';
      }).join('') +
    '</div>';

    // Build hour rows
    let gridRows = '';
    for (const h of hours) {
      const hourLabel = h === 0 ? '12 AM' : h === 12 ? '12 PM' : h < 12 ? h + ' AM' : (h - 12) + ' PM';
      gridRows += '<div class="sched-hour-label">' + hourLabel + '</div>';
      for (let di = 0; di < 7; di++) {
        const d = days[di];
        const isToday = d.toDateString() === todayStr;
        const isActiveMobile = di === activeDayIdx;
        const hideClass = isMobile && !isActiveMobile ? 'hide-mobile' : '';
        gridRows += '<div class="sched-cell ' + (isToday ? 'today-col' : '') + ' ' + hideClass + '" ' +
          'data-day="' + di + '" data-hour="' + h + '" ' +
          'onclick="openSchedModalAt(\'' + isoDate(d) + '\', \'' + String(h).padStart(2, '0') + ':00\')"></div>';
      }
    }

    // Position event blocks absolutely over the grid.
    // Each cell is 48px tall, hour label column is 56px wide.
    // We'll render events as absolutely positioned divs inside .sched-grid.
    let eventBlocks = '';
    for (let di = 0; di < 7; di++) {
      const dayEvents = byDay[di].slice().sort((a, b) => a.startMin - b.startMin);

      // Compute overlap groups: assign each event a "column index" within its overlap cluster.
      // Simple algorithm: walk events sorted by start; track active columns and free slots.
      const placed = [];
      for (const r of dayEvents) {
        let col = 0;
        while (placed.some(p => p.col === col && p.endMin > r.startMin)) col++;
        placed.push({ r, col, endMin: r.endMin });
      }
      // Total columns used for this day = max col + 1
      const usedCols = placed.reduce((m, p) => Math.max(m, p.col), 0) + 1;

      const isActiveMobile = di === activeDayIdx;
      if (isMobile && !isActiveMobile) continue;

      for (const p of placed) {
        const r = p.r;
        const owner = MEMBERS.find(m => m.id === r.event.ownerId) || MEMBERS[0];
        const startPx = (r.startMin / 60) * 48;
        const heightPx = Math.max(20, ((r.endMin - r.startMin) / 60) * 48);

        // Position horizontally: hour label column is 56px (44 mobile),
        // each day takes (100% - that) / 7 width on desktop, full remaining on mobile day view.
        // We'll use CSS calc with custom properties.
        const labelW = isMobile ? 44 : 56;
        const dayWidthExpr = isMobile
          ? 'calc(100% - ' + labelW + 'px)'
          : 'calc((100% - ' + labelW + 'px) / 7)';
        const dayLeftExpr = isMobile
          ? labelW + 'px'
          : 'calc(' + labelW + 'px + ' + dayWidthExpr + ' * ' + di + ')';

        // Split within a day's column: column p.col of usedCols total.
        const eventLeftInDay = '(' + dayWidthExpr + ' * ' + (p.col / usedCols) + ')';
        const eventWidthInDay = '(' + dayWidthExpr + ' * ' + (1 / usedCols) + ' - 2px)';
        const leftStyle = 'calc(' + dayLeftExpr + ' + ' + eventLeftInDay + ')';

        const recurIcon = !r.isOneTime ? '↻' : '';
        const timeLabel = formatTime12(r.startMin) + ' – ' + formatTime12(r.endMin);

        eventBlocks += '<div class="sched-event" ' +
          'style="top:' + startPx + 'px; height:' + heightPx + 'px; ' +
                 'left:' + leftStyle + '; ' +
                 'width:calc(' + eventWidthInDay + '); ' +
                 'background:' + owner.color + ';" ' +
          'onclick="event.stopPropagation(); openSchedModalEdit(\'' + r.event.id + '\', \'' + r.instanceDate + '\')">' +
          (recurIcon ? '<span class="ev-recur-icon">' + recurIcon + '</span>' : '') +
          '<div class="ev-title">' + escapeHtml(r.title) + '</div>' +
          '<div class="ev-time">' + timeLabel + '</div>' +
        '</div>';
      }
    }

    // Now line (only if today is in this week)
    let nowLine = '';
    const now = new Date();
    if (now >= wstart && now <= new Date(wend.getTime() + 86400000)) {
      const minutesNow = now.getHours() * 60 + now.getMinutes();
      const topPx = (minutesNow / 60) * 48;
      nowLine = '<div class="sched-now-line" style="top:' + topPx + 'px"></div>';
    }

    const weekRangeLabel = wstart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                          ' – ' + new Date(wend).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    const legend = '<div class="sched-legend">' +
      '<span>Owners:</span>' +
      MEMBERS.map(m =>
        '<span class="sched-legend-item">' +
          '<span class="sched-legend-swatch" style="background:' + m.color + '"></span>' +
          escapeHtml(m.name) +
        '</span>'
      ).join('') +
      '<span style="margin-left:auto; opacity: 0.7;">Click an empty slot to add an event</span>' +
    '</div>';

    const mobileDay = days[activeDayIdx >= 0 ? activeDayIdx : 0];
    const mobilePager = '<div class="sched-mobile-pager">' +
      '<button class="btn btn-icon" onclick="schedMobileDay(-1)">‹</button>' +
      '<div class="sched-mobile-day-label">' +
        mobileDay.toLocaleDateString('en-US', { weekday: 'long' }) +
        ' <em>' + mobileDay.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</em>' +
      '</div>' +
      '<button class="btn btn-icon" onclick="schedMobileDay(1)">›</button>' +
    '</div>';

    return '' +
      '<div class="sched-header">' +
        '<div>' +
          '<div class="sched-title">' + monthLabel.split(' ')[0] + ' <em>' + monthLabel.split(' ')[1] + '</em></div>' +
          '<div style="font-family: \'JetBrains Mono\', monospace; font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;">' + weekRangeLabel + '</div>' +
        '</div>' +
        '<div class="sched-nav">' +
          '<button class="btn btn-icon" onclick="schedNav(-1)">‹</button>' +
          '<button class="btn" onclick="schedToday()">This week</button>' +
          '<button class="btn btn-icon" onclick="schedNav(1)">›</button>' +
          '<button class="btn primary" onclick="openSchedModalAt()" style="margin-left:6px">+ Add event</button>' +
        '</div>' +
      '</div>' +
      mobilePager +
      legend +
      '<div class="sched-grid-wrap">' +
        headers +
        '<div class="sched-body">' +
          '<div class="sched-grid">' +
            gridRows +
            eventBlocks +
            nowLine +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function formatTime12(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const ampm = h < 12 ? 'a' : 'p';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    const mStr = m === 0 ? '' : ':' + String(m).padStart(2, '0');
    return h12 + mStr + ampm;
  }

    const d = new Date(state.weekDate);
    d.setDate(d.getDate() + dir * 7);
