  };

  window.removeEventCategory = async function(id) {
    if (!confirm('Remove this category? Events using it will move to "Rush".')) return;
    state.eventCategories = state.eventCategories.filter(c => c.id !== id);
    state.events.forEach(e => { if (e.categoryId === id) e.categoryId = 'rush'; });
    if (state.editingEvent.categoryId === id) state.editingEvent.categoryId = 'rush';
    await persist('event_cats', state.eventCategories);
    await persist('events', state.events);
    renderEventCategoryChips();
  };

  window.saveEvent = async function() {
    const title = document.getElementById('eventTitle').value.trim();
    const dateStr = document.getElementById('eventDate').value;
    const startStr = document.getElementById('eventStart').value;
    const endStr = document.getElementById('eventEnd').value;
    const location = document.getElementById('eventLocation').value.trim();
    const notes = document.getElementById('eventNotes').value.trim();

    if (!title) { toast('Please enter an event name.', 'error'); document.getElementById('eventTitle').focus(); return; }
    if (!dateStr) { toast('Please pick a date.', 'error'); document.getElementById('eventDate').focus(); return; }

    const hasTime = !!startStr;
    const startISO = hasTime
      ? new Date(dateStr + 'T' + startStr).toISOString()
      : new Date(dateStr + 'T00:00:00').toISOString();
    const endISO = (hasTime && endStr) ? new Date(dateStr + 'T' + endStr).toISOString() : null;

    if (state.editingEventId) {
      const ev = state.events.find(e => e.id === state.editingEventId);
      if (ev) Object.assign(ev, { title, startISO, endISO, hasTime, location, notes, categoryId: state.editingEvent.categoryId, updatedAt: Date.now() });
    } else {
      state.events.push({
        id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title, startISO, endISO, hasTime, location, notes,
        categoryId: state.editingEvent.categoryId,
        createdBy: state.currentUser,
        createdAt: Date.now(), updatedAt: Date.now(),
      });
    }
    await persist('events', state.events);
    toast('Event saved', 'success');
    closeEventModal();
    render();
  };

  window.deleteCurrentEvent = async function() {
    if (!state.editingEventId) return;
    if (!confirm('Delete this event?')) return;
    state.events = state.events.filter(e => e.id !== state.editingEventId);
    await persist('events', state.events);
    toast('Event deleted', 'default');
    closeEventModal();
    render();
  };

  // ============================================================
  // TASKS
  // ============================================================
  function renderTasks() {
    const filteredTasks = state.tasks.filter(t => {
      if (state.taskFilterAssignee !== 'all' && t.assigneeId !== state.taskFilterAssignee) return false;
      if (state.taskFilterCategory !== 'all' && t.categoryId !== state.taskFilterCategory) return false;
      return true;
    });

    const columns = [
      { id: 'todo', title: 'To do', filter: t => t.status === 'todo' },
      { id: 'progress', title: 'In progress', filter: t => t.status === 'progress' },
      { id: 'done', title: 'Done', filter: t => t.status === 'done' },
    ];

    return '' +
      '<div class="toolbar">' +
        '<button class="btn primary" onclick="openTaskModal()">+ New task</button>' +
      '</div>' +
      '<div class="legend">' +
        '<span>Assignee:</span>' +
        '<button class="chip ' + (state.taskFilterAssignee === 'all' ? 'selected' : '') + '" onclick="setTaskFilter(\'assignee\',\'all\')">All</button>' +
        MEMBERS.map(m =>
          '<button class="chip ' + (state.taskFilterAssignee === m.id ? 'selected' : '') + '" onclick="setTaskFilter(\'assignee\',\'' + m.id + '\')" style="' + (state.taskFilterAssignee === m.id ? 'background:' + m.color + '; border-color:' + m.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.taskFilterAssignee === m.id ? 'var(--paper)' : m.color) + '"></span>' + escapeHtml(m.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="legend">' +
        '<span>Category:</span>' +
        '<button class="chip ' + (state.taskFilterCategory === 'all' ? 'selected' : '') + '" onclick="setTaskFilter(\'category\',\'all\')">All</button>' +
        state.taskCategories.map(c =>
          '<button class="chip ' + (state.taskFilterCategory === c.id ? 'selected' : '') + '" onclick="setTaskFilter(\'category\',\'' + c.id + '\')" style="' + (state.taskFilterCategory === c.id ? 'background:' + c.color + '; border-color:' + c.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.taskFilterCategory === c.id ? 'var(--paper)' : c.color) + '"></span>' + escapeHtml(c.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="tasks-layout">' +
        columns.map(col => {
          const items = filteredTasks.filter(col.filter).sort((a, b) => {
            const prio = { high: 0, normal: 1, low: 2 };
            return (prio[a.priority || 'normal'] - prio[b.priority || 'normal']) || (b.createdAt - a.createdAt);
          });
          return '<div class="task-column">' +
            '<div class="task-column-header">' +
              '<div class="task-column-title">' + col.title + '</div>' +
              '<div class="task-count">' + items.length + '</div>' +
            '</div>' +
            items.map(t => renderTaskCard(t, col.id)).join('') +
            (items.length === 0 ? '<div style="color:var(--fg-muted); font-style:italic; font-family:Playfair Display,serif; font-size:14px; padding:16px 0; text-align:center;">Nothing here.</div>' : '') +
          '</div>';
        }).join('') +
      '</div>';
  }

  function renderTaskCard(t, colId) {
    const assignee = MEMBERS.find(m => m.id === t.assigneeId);
    const cat = state.taskCategories.find(c => c.id === t.categoryId) || state.taskCategories[0];
    const accentColor = cat ? cat.color : '#6B7280';

    let dueChip = '';
    if (t.dueISO && t.status !== 'done') {
      const due = new Date(t.dueISO);
      const now = new Date();
      const diffDays = Math.round((due - now) / 86400000);
      const dueLabel = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      if (diffDays < 0) dueChip = '<span class="task-chip overdue">⚠ Overdue · ' + dueLabel + '</span>';
      else if (diffDays <= 2) dueChip = '<span class="task-chip due-soon">Due ' + dueLabel + '</span>';
      else dueChip = '<span class="task-chip">Due ' + dueLabel + '</span>';
    }

    const priorityChip = t.priority === 'high' ? '<span class="task-chip priority-high">‼ High</span>' : '';

    return '<div class="task-item ' + (t.status === 'done' ? 'done' : '') + '">' +
      '<div class="task-accent" style="background:' + accentColor + '"></div>' +
      '<div class="task-checkbox" onclick="toggleTaskDone(\'' + t.id + '\')">' + (t.status === 'done' ? '✓' : '') + '</div>' +
      '<div class="task-content">' +
        '<div class="task-text" onclick="openTaskModal(\'' + t.id + '\')">' + escapeHtml(t.text) + '</div>' +
        '<div class="task-meta-row">' +
          (assignee ? '<span class="task-chip assignee" style="background:' + assignee.color + '">' + escapeHtml(assignee.name) + '</span>' : '') +
          (cat ? '<span class="task-chip"><span style="width:7px;height:7px;border-radius:50%;background:' + cat.color + ';display:inline-block"></span>' + escapeHtml(cat.name) + '</span>' : '') +
          priorityChip +
          dueChip +
        '</div>' +
        '<div class="task-footer">' +
          '<span>' + timeAgo(t.createdAt) + '</span>' +
          '<div style="display:flex; gap:4px;">' +
            (colId === 'todo' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'progress\')">Start</button>' : '') +
            (colId === 'progress' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'todo\')">← Back</button><button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'done\')">Done ✓</button>' : '') +
            (colId === 'done' ? '<button class="task-action-btn" onclick="moveTask(\'' + t.id + '\', \'progress\')">Reopen</button>' : '') +
            '<button class="task-action-btn" onclick="openTaskModal(\'' + t.id + '\')">Edit</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  window.setTaskFilter = function(kind, val) {
    if (kind === 'assignee') state.taskFilterAssignee = val;
    else state.taskFilterCategory = val;
    render();
  };

  window.toggleTaskDone = async function(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.status = t.status === 'done' ? 'todo' : 'done';
    await persist('tasks', state.tasks);
    render();
  };

  window.moveTask = async function(id, status) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.status = status;
    await persist('tasks', state.tasks);
    render();
  };

  window.openTaskModal = function(taskId) {
    const existing = taskId ? state.tasks.find(t => t.id === taskId) : null;
    state.editingTaskId = taskId || null;
    document.getElementById('taskModalTitle').innerHTML = existing ? 'Edit <em>task</em>' : 'New <em>task</em>';
    document.getElementById('deleteTaskBtn').style.display = existing ? 'inline-flex' : 'none';
    document.getElementById('taskText').value = existing?.text || '';
    document.getElementById('taskDue').value = existing?.dueISO ? toDateInputValue(new Date(existing.dueISO)) : '';
    document.getElementById('taskPriority').value = existing?.priority || 'normal';

      assigneeId: existing?.assigneeId || state.currentUser,
      categoryId: existing?.categoryId || 'rush_ops',

    };

    renderTaskCategoryChips();
    renderTaskStatusChips();
    renderNewTaskCatColors();
    document.getElementById('newTaskCatName').value = '';

    document.getElementById('taskModal').classList.add('active');
    setTimeout(() => document.getElementById('taskText').focus(), 50);
  };

  window.closeTaskModal = function() {

    state.editingTaskId = null;

  function renderTaskAssigneeChips() {
    const container = document.getElementById('taskAssigneeChips');
    container.innerHTML = MEMBERS.map(m =>
      '<button class="chip ' + (state.editingTask.assigneeId === m.id ? 'selected' : '') + '" onclick="pickTaskAssignee(\'' + m.id + '\')" style="' + (state.editingTask.assigneeId === m.id ? 'background:' + m.color + '; border-color:' + m.color : '') + '">' +
        '<span class="chip-dot" style="background:' + (state.editingTask.assigneeId === m.id ? 'var(--paper)' : m.color) + '"></span>' + escapeHtml(m.name) +

      '<button class="chip ' + (state.editingTask.categoryId === c.id ? 'selected' : '') + '" onclick="pickTaskCategory(\'' + c.id + '\')" style="' + (state.editingTask.categoryId === c.id ? 'background:' + c.color + '; border-color:' + c.color : '') + '">' +
        '<span class="chip-dot" style="background:' + (state.editingTask.categoryId === c.id ? 'var(--paper)' : c.color) + '"></span>' + escapeHtml(c.name) +

    const container = document.getElementById('taskStatusChips');
    container.innerHTML = statuses.map(s =>
      '<button class="chip ' + (state.editingTask.status === s.id ? 'selected' : '') + '" onclick="pickTaskStatus(\'' + s.id + '\')">' + s.label + '</button>'

    ).join('');

  window.pickTaskCategory = function(id) { state.editingTask.categoryId = id; renderTaskCategoryChips(); };
  window.pickTaskStatus = function(id) { state.editingTask.status = id; renderTaskStatusChips(); };
  window.pickNewTaskCatColor = function(c) { state.newTaskCatColor = c; renderNewTaskCatColors(); };

  window.addTaskCategory = async function() {
    const input = document.getElementById('newTaskCatName');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (state.taskCategories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      toast('Category "' + name + '" already exists', 'error');
      input.select();
      return;
    }
    const newCat = { id: 'tc_' + Date.now(), name, color: state.newTaskCatColor, builtin: false };
    state.taskCategories.push(newCat);
    state.editingTask.categoryId = newCat.id;
    await persist('task_cats', state.taskCategories);
    input.value = '';
    renderTaskCategoryChips();
    toast('Added "' + name + '"', 'success');
  };

  window.removeTaskCategory = async function(id) {
    if (!confirm('Remove this category? Tasks using it will move to "Rush Ops".')) return;
    state.taskCategories = state.taskCategories.filter(c => c.id !== id);
    state.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = 'rush_ops'; });
    if (state.editingTask.categoryId === id) state.editingTask.categoryId = 'rush_ops';
    await persist('task_cats', state.taskCategories);
    await persist('tasks', state.tasks);
    renderTaskCategoryChips();
  };

  window.saveTask = async function() {
    const text = document.getElementById('taskText').value.trim();
    if (!text) { toast('Please enter the task.', 'error'); document.getElementById('taskText').focus(); return; }
    const dueStr = document.getElementById('taskDue').value;
    const priority = document.getElementById('taskPriority').value;
    const notes = document.getElementById('taskNotes').value.trim();

    if (state.editingTaskId) {
      const t = state.tasks.find(x => x.id === state.editingTaskId);
      if (t) Object.assign(t, {
        text,
        assigneeId: state.editingTask.assigneeId,
        categoryId: state.editingTask.categoryId,
        status: state.editingTask.status,
        priority, notes,
        dueISO: dueStr ? new Date(dueStr + 'T23:59:59').toISOString() : null,
        updatedAt: Date.now(),
      });
    } else {
      state.tasks.push({
        id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        text,
        assigneeId: state.editingTask.assigneeId,
        categoryId: state.editingTask.categoryId,
        status: state.editingTask.status,
        priority, notes,
        dueISO: dueStr ? new Date(dueStr + 'T23:59:59').toISOString() : null,
        authorId: state.currentUser,
        createdAt: Date.now(), updatedAt: Date.now(),
      });

    await persist('tasks', state.tasks);
    toast('Task saved', 'success');

    await persist('tasks', state.tasks);
    toast('Task deleted', 'default');
    closeTaskModal();
    render();
  };

  // ============================================================
  // CANDIDATES
  // ============================================================
  function renderCandidates() {
    const statusCounts = {};
    CANDIDATE_STATUSES.forEach(s => { statusCounts[s.id] = state.candidates.filter(c => c.status === s.id).length; });
    const filtered = state.candidateFilter === 'all'
      ? state.candidates
      : state.candidates.filter(c => c.status === state.candidateFilter);

    return '' +
      '<div class="toolbar">' +
        '<button class="btn primary" onclick="openCandidateModal()">+ Add candidate</button>' +
      '</div>' +
      '<div class="legend">' +
        '<span>Status:</span>' +
        '<button class="chip ' + (state.candidateFilter === 'all' ? 'selected' : '') + '" onclick="setCandFilter(\'all\')">All · ' + state.candidates.length + '</button>' +
        CANDIDATE_STATUSES.map(s =>
          '<button class="chip ' + (state.candidateFilter === s.id ? 'selected' : '') + '" onclick="setCandFilter(\'' + s.id + '\')" style="' + (state.candidateFilter === s.id ? 'background:' + s.color + '; border-color:' + s.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.candidateFilter === s.id ? 'var(--paper)' : s.color) + '"></span>' + s.label + ' · ' + statusCounts[s.id] +
          '</button>'
        ).join('') +
      '</div>' +
      (filtered.length === 0
        ? '<div class="empty-state">' +
            '<div class="ornament">★</div>' +
            '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; margin-bottom:8px;">No candidates yet</div>' +
            '<div style="font-size:13px;">Start tracking the PNMs you meet this rush.</div>' +
          '</div>'
        : '<div class="candidates-grid">' + filtered.map(renderCandidateCard).join('') + '</div>');
  }

  function renderCandidateCard(c) {
    const initials = ((c.firstName || '?')[0] + (c.lastName || '?')[0]).toUpperCase();
    const status = CANDIDATE_STATUSES.find(s => s.id === c.status) || CANDIDATE_STATUSES[0];
    const votes = c.votes || {};
    const yesCount = Object.values(votes).filter(v => v === 'yes').length;
    const maybeCount = Object.values(votes).filter(v => v === 'maybe').length;
    const noCount = Object.values(votes).filter(v => v === 'no').length;
    const myVote = votes[state.currentUser];

    return '<div class="candidate-card" onclick="openCandidateModal(\'' + c.id + '\')">' +
      '<div class="candidate-status-bar" style="background:' + status.color + '"></div>' +
      '<div class="candidate-head">' +
        '<div class="candidate-avatar">' + escapeHtml(initials) + '</div>' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="candidate-name">' + escapeHtml(c.firstName || '') + ' ' + escapeHtml(c.lastName || '') + '</div>' +
          '<div class="candidate-major">' + escapeHtml(c.year || '') + (c.major ? ' · ' + escapeHtml(c.major) : '') + '</div>' +
        '</div>' +
        '<span class="status-pill ' + status.cls + '">' + status.label + '</span>' +
      '</div>' +
      (c.referrer ? '<div style="font-size:11px; color:var(--fg-muted); margin-bottom:8px; font-family:\'JetBrains Mono\',monospace; text-transform:uppercase; letter-spacing:0.08em;">ref: ' + escapeHtml(c.referrer) + '</div>' : '') +
      (c.notes ? '<div style="font-size:12px; color:var(--fg-soft); line-height:1.4; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">' + escapeHtml(c.notes) + '</div>' : '') +
      '<div class="vote-buttons" onclick="event.stopPropagation()">' +
        '<button class="vote-btn ' + (myVote === 'yes' ? 'picked-yes' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'yes\')">✓ Yes</button>' +
        '<button class="vote-btn ' + (myVote === 'maybe' ? 'picked-maybe' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'maybe\')">? Maybe</button>' +
        '<button class="vote-btn ' + (myVote === 'no' ? 'picked-no' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'no\')">✕ No</button>' +
      '</div>' +
      '<div class="candidate-meta">' +
        '<div class="vote-display">' +
          '<span class="vote-count vote-yes">✓ ' + yesCount + '</span>' +
          '<span class="vote-count vote-maybe">? ' + maybeCount + '</span>' +
          '<span class="vote-count vote-no">✕ ' + noCount + '</span>' +
        '</div>' +
        '<div style="font-family:\'JetBrains Mono\',monospace; font-size:9px; color:var(--fg-muted); text-transform:uppercase; letter-spacing:0.08em;">' + timeAgo(c.updatedAt) + '</div>' +
      '</div>' +
    '</div>';
  }

  window.setCandFilter = function(id) { state.candidateFilter = id; render(); };

  window.voteCandidate = async function(candId, vote) {
    const c = state.candidates.find(x => x.id === candId);
    if (!c) return;
    c.votes = c.votes || {};
    if (c.votes[state.currentUser] === vote) delete c.votes[state.currentUser];
    else c.votes[state.currentUser] = vote;
    c.updatedAt = Date.now();
    await persist('candidates', state.candidates);
    render();
  };

  window.openCandidateModal = function(candId) {
    const existing = candId ? state.candidates.find(c => c.id === candId) : null;
    state.editingCandId = candId || null;
    document.getElementById('candidateModalTitle').innerHTML = existing ? 'Edit <em>candidate</em>' : 'New <em>candidate</em>';
    document.getElementById('deleteCandBtn').style.display = existing ? 'inline-flex' : 'none';

    document.getElementById('candFirst').value = existing?.firstName || '';
    document.getElementById('candLast').value = existing?.lastName || '';
    document.getElementById('candYear').value = existing?.year || 'Freshman';
    document.getElementById('candMajor').value = existing?.major || '';
    document.getElementById('candContact').value = existing?.contact || '';
    document.getElementById('candReferrer').value = existing?.referrer || '';
    document.getElementById('candNotes').value = existing?.notes || '';
    state.editingCandStatus = existing?.status || 'prospect';

    renderCandidateStatusChips();

    document.getElementById('candidateModal').classList.add('active');
    setTimeout(() => document.getElementById('candFirst').focus(), 50);
  };

  window.closeCandidateModal = function() {
    document.getElementById('candidateModal').classList.remove('active');
    state.editingCandId = null;
  };

  function renderCandidateStatusChips() {
    const container = document.getElementById('candStatusChips');
    container.innerHTML = CANDIDATE_STATUSES.map(s =>
      '<button class="chip ' + (state.editingCandStatus === s.id ? 'selected' : '') + '" onclick="pickCandStatus(\'' + s.id + '\')" style="' + (state.editingCandStatus === s.id ? 'background:' + s.color + '; border-color:' + s.color + '; color:var(--paper)' : '') + '">' + s.label + '</button>'
    ).join('');
  }

  window.pickCandStatus = function(id) { state.editingCandStatus = id; renderCandidateStatusChips(); };

  window.saveCandidate = async function() {
    const firstName = document.getElementById('candFirst').value.trim();
    const lastName = document.getElementById('candLast').value.trim();
    if (!firstName && !lastName) { toast('Please enter at least a first or last name.', 'error'); return; }

    const data = {
      firstName, lastName,
      year: document.getElementById('candYear').value,
      major: document.getElementById('candMajor').value.trim(),
      contact: document.getElementById('candContact').value.trim(),
      referrer: document.getElementById('candReferrer').value.trim(),
      notes: document.getElementById('candNotes').value.trim(),
      status: state.editingCandStatus,
      updatedAt: Date.now(),
    };

    if (state.editingCandId) {
      const c = state.candidates.find(x => x.id === state.editingCandId);
      if (c) Object.assign(c, data);
    } else {
      state.candidates.unshift(Object.assign({
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        votes: {}, createdAt: Date.now(), createdBy: state.currentUser,
      }, data));
    }
    await persist('candidates', state.candidates);
    toast('Candidate saved', 'success');
    closeCandidateModal();
    render();
  };

  window.deleteCurrentCandidate = async function() {
    if (!state.editingCandId) return;
    if (!confirm('Remove this candidate from tracking?')) return;
    state.candidates = state.candidates.filter(c => c.id !== state.editingCandId);
    await persist('candidates', state.candidates);
    toast('Candidate removed', 'default');
    closeCandidateModal();
    render();
  };

  // ============================================================
  // UTILS
  // ============================================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    const day = Math.floor(hr / 24);
    if (day < 7) return day + 'd ago';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function toDateInputValue(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  function toTimeInputValue(d) {
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  function eventEndTime(e) { return new Date(e.endISO || e.startISO).getTime(); }

  function formatEventShort(e) {
    if (!e.hasTime) return e.title;
    const d = new Date(e.startISO);
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(':00', '').toLowerCase().replace(' ', '');
    return timeStr + ' ' + e.title;
  }

  function formatEventTime(e) {
    const d = new Date(e.startISO);
    const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (!e.hasTime) return dateStr.toUpperCase();
    const startStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let timeStr = startStr;
    if (e.endISO) {
      const endStr = new Date(e.endISO).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      timeStr = startStr + ' – ' + endStr;
    }
    return (dateStr + ' · ' + timeStr).toUpperCase();
  }

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      state.editingNoteId = null;
      state.editingEventId = null;
      state.editingTaskId = null;
      state.editingCandId = null;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      if (document.getElementById('noteModal').classList.contains('active')) { e.preventDefault(); saveNote(); }
      else if (document.getElementById('eventModal').classList.contains('active')) { e.preventDefault(); saveEvent(); }
      else if (document.getElementById('taskModal').classList.contains('active')) { e.preventDefault(); saveTask(); }
      else if (document.getElementById('candidateModal').classList.contains('active')) { e.preventDefault(); saveCandidate(); }
    }
  });

  if (sb) init();
</script>
</body>
</html>
