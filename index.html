    box-shadow: 0 0 0 0 rgba(63, 138, 92, 0.6);
    animation: syncPulse 2.4s ease-out infinite;
  }
  @keyframes syncPulse {
    0%   { box-shadow: 0 0 0 0 rgba(63, 138, 92, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(63, 138, 92, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 138, 92, 0); }
  }
  .centerpiece-phase { margin-bottom: 32px; }
  .phase-name {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--navy);
    margin-bottom: 4px;
  }
  [data-theme="dark"] .phase-name { color: var(--gold); }
  .phase-sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--fg-soft);
  }
  /* ── Phase-segmented progress bar with chip row + connectors ──── */
  .rush-bar-stack {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .rush-segments {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    padding: 0 4px;
  }

  .rush-segment {
    position: relative;
    /* No padding-bottom — labels live in the chip row, not under each segment */
  }

  .rush-segment-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .seg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--fg-muted);
    font-weight: 600;
  }
  .rush-segment.status-current .seg-label { color: var(--navy); }
  .rush-segment.status-past .seg-label { color: var(--fg-muted); opacity: 0.7; }

  .seg-meta-current,
  .seg-meta-past,
  .seg-meta-future {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .seg-meta-current {
    color: var(--paper);
    background: var(--navy);
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 600;
  }
  .seg-meta-past   { color: var(--fg-muted); opacity: 0.6; }
  .seg-meta-future { color: var(--fg-muted); }

  /* The actual bar segment */
  .rush-segment-bar {
    position: relative;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    margin-top: 18px; /* room for TODAY pill */
  }
  .rush-segment.status-current .rush-segment-bar {
    background: color-mix(in srgb, var(--gold) 18%, var(--surface));
  }

  .rush-segment-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(to right, var(--navy), var(--gold-dark));
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .rush-segment.status-past .rush-segment-fill {
    background: var(--navy);
    opacity: 0.55;
  }

  /* Milestone dots on the bar — no labels, labels are in the chip row */
  .seg-milestone {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 2;
  }
  .seg-milestone-marker {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--navy);
    box-shadow: 0 0 0 3px var(--surface);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .seg-milestone:hover .seg-milestone-marker,
  .seg-milestone.is-hover .seg-milestone-marker {
    transform: scale(1.3);
    box-shadow: 0 0 0 4px var(--surface), 0 0 0 5px var(--gold);
  }
  .seg-milestone-marker.past {
    background: var(--navy);
    border-color: var(--navy);
  }
  .seg-milestone-marker.bfc {
    background: var(--gold);
    border-color: var(--gold-dark);
  }
  .seg-milestone-marker.bfc.past {
    background: var(--gold-dark);
  }

  /* TODAY marker: vertical line + pill */
  .seg-today-line {
    position: absolute;
    top: -18px;
    bottom: -8px;
    width: 2px;
    background: var(--danger);
    transform: translateX(-50%);
    z-index: 3;
    border-radius: 1px;
  }
  .seg-today-pill {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    white-space: nowrap;
  }

  /* Connector layer: SVG strip linking each dot to its chip below */
  .rush-connectors {
    display: block;
    width: 100%;
    height: 28px;
    margin: 6px 4px 0;
    overflow: visible;
  }
  .rush-connectors .connector {
    fill: none;
    stroke: var(--line-strong);
    stroke-width: 1;
    stroke-linejoin: round;
    transition: stroke 0.15s ease, stroke-width 0.15s ease;
  }
  .rush-connectors .connector.past { stroke: var(--line); }
  .rush-connectors .connector.is-hover {
    stroke: var(--gold-dark);
    stroke-width: 1.6;
  }

  /* Chip row: equal-width grid cells, one chip per milestone, centered */
  .rush-chip-row {
    display: grid;
    gap: 4px;
    padding: 0 4px;
    margin-top: 2px;
  }
  .rush-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 6px 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
    min-width: 0;
  }
  .rush-chip:hover,
  .rush-chip.is-hover {
    background: var(--surface-2);
  }
  .rush-chip .chip-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--navy);
    margin-bottom: 6px;
    transition: transform 0.15s ease;
  }
  .rush-chip.past .chip-dot { background: var(--fg-muted); opacity: 0.55; }
  .rush-chip.bfc .chip-dot { background: var(--gold); }
  .rush-chip.bfc.past .chip-dot { background: var(--gold-dark); }
  .rush-chip.is-hover .chip-dot,
  .rush-chip:hover .chip-dot { transform: scale(1.35); }
  .rush-chip .chip-text { min-width: 0; width: 100%; }
  .rush-chip .chip-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rush-chip.past .chip-label { color: var(--fg-soft); }
  .rush-chip:hover .chip-label,
  .rush-chip.is-hover .chip-label { color: var(--gold-dark); }
  .rush-chip .chip-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--fg-muted);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* When a segment has no milestones, give it a low-key placeholder feel */
  .rush-segment.status-future .seg-label { opacity: 0.6; }

  @media (max-width: 900px) {
    .rush-segments { grid-template-columns: 1fr 1fr; gap: 20px 14px; }
    .rush-chip-row { grid-template-columns: repeat(2, 1fr) !important; gap: 6px; }
    .rush-connectors { display: none; } /* connectors don't map sensibly across wrapped rows */
  }

  /* KPI row — relabeled, lighter weight than countdown hero */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.18s ease, transform 0.18s ease;
    position: relative;
    overflow: hidden;
  }
  .kpi-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-1px);
  }
  .kpi-card::after {
    content: '→';
    position: absolute;
    top: 16px; right: 18px;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--fg-muted);
    opacity: 0;
    transition: opacity 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  .kpi-card:hover::after {
    opacity: 1;
    color: var(--gold-dark);
    transform: translateX(2px);
  }
  .kpi-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }
  .kpi-value {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--navy);
  }
  [data-theme="dark"] .kpi-value { color: var(--gold); }
  .kpi-value em {
    font-style: italic;
    color: var(--gold-dark);
    font-weight: 500;
  }
  [data-theme="dark"] .kpi-value em { color: var(--gold); }
  .kpi-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--fg-muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* Attention list (unchanged structure, polished spacing) */
  .attention-list { display: flex; flex-direction: column; gap: 7px; }
  .attention-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .attention-item:hover { border-color: var(--gold); transform: translateX(2px); }
  .attention-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .attention-dot.urgency-overdue { background: var(--danger); box-shadow: 0 0 0 3px rgba(184, 40, 50, 0.10); }
  .attention-dot.urgency-today   { background: var(--gold);   box-shadow: 0 0 0 3px rgba(212, 166, 74, 0.15); }
  .attention-dot.urgency-week    { background: var(--navy);   box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.10); }
  .attention-dot.urgency-future  { background: var(--fg-muted); }
  .attention-text { flex: 1; min-width: 0; font-size: 13px; }
  .attention-text .item-title { font-weight: 500; color: var(--fg); }
  .attention-text .item-meta  {
    font-size: 11px;
    color: var(--fg-muted);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  /* Empty states — Playfair italic + geometric anchor + hairline rule */
  .empty-state-polished {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 28px 16px;
    color: var(--fg-muted);
    position: relative;
  }
  .empty-state-polished::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--line-strong);
    margin-bottom: 14px;
  }
  .empty-state-polished .empty-glyph {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--line-strong);
    line-height: 1;
    margin-bottom: 10px;
  }
  .empty-state-polished .empty-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--fg-muted);
  }

  /* One-line inline empty state — for dashboard sections where the
     full polished empty card would dominate visually. */
  .empty-inline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--fg-muted);
    padding: 6px 2px 4px;
    line-height: 1.5;
  }

  /* Activity grid — unified surface with internal dividers */
  .activity-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    gap: 0;
    margin-top: 20px;
    overflow: hidden;
  }
  .activity-grid.two-col { grid-template-columns: 1fr 1fr; }
  .activity-column {
    background: transparent;
    border: none;
    border-radius: 0;
    border-right: 1px solid var(--line);
    padding: 18px 22px;
  }
  .activity-grid > .activity-column:last-child { border-right: none; }
  .activity-column .section-title {
    margin-bottom: 10px;
    font-size: 13px;
  }
  .activity-item {
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    cursor: pointer;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-item:hover .activity-item-title { color: var(--gold-dark); }
  .activity-item-title {
    font-weight: 500;
    color: var(--fg);
    transition: color 0.15s;
    line-height: 1.35;
  }
  .activity-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  /* Dashboard section card polish (scoped — does not affect other views) */
  .view-dashboard .section-card {
    padding: 20px 22px;
  }
  .view-dashboard .section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.01em;
    margin-bottom: 14px;
  }
  [data-theme="dark"] .view-dashboard .section-title { color: var(--gold); }
  .view-dashboard .section-title .btn.small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.15s;
  }
  .view-dashboard .section-title .btn.small:hover { color: var(--gold-dark); }

  @media (max-width: 900px) {
    .countdown-row { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .activity-grid { grid-template-columns: 1fr; }
    .rush-centerpiece { padding: 20px 18px 24px; }
    .phase-name { font-size: 24px; }
    .hero-value { font-size: 34px; }
    .kpi-value { font-size: 30px; }
  }

  /* ========== PHASE 0 #4 v2 — TASK SYSTEM REDESIGN ========== */

  /* §1 — Active Tasks header + scope toggle */
  .tasks-header-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .tasks-scope-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface);
  }
  .scope-pill {
    border: none;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .scope-pill:hover { color: var(--fg); }
  .scope-pill.active { background: var(--navy); color: var(--paper); }
  [data-theme="dark"] .scope-pill.active { background: var(--gold); color: var(--navy-dark); }
  .tasks-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
  }

  /* §2 — Task list rows */
  .task-list { display: flex; flex-direction: column; }
  .task-list.secondary { opacity: 0.85; margin-top: 4px; }
  .task-group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px 6px;
    margin-top: 6px;
  }
  .task-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--fg-muted);
    font-weight: 600;
  }
  .task-group-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--fg-muted);
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--line);
  }
  .task-group-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fg-muted);
  }
  .task-group-dot.urgency-overdue  { background: var(--danger); }
  .task-group-dot.urgency-today    { background: var(--gold); }
  .task-group-dot.urgency-tomorrow { background: var(--gold-dark); }
  .task-group-dot.urgency-week     { background: var(--navy); }
  [data-theme="dark"] .task-group-dot.urgency-week { background: var(--gold); }
  .task-group-dot.urgency-future   { background: var(--fg-muted); }
  .task-group-dot.urgency-done     { background: var(--success); }
  /* §1D urgency tier spectrum: lighter navy / gray dots */
  .task-group-dot.urgency-thismonth { background: rgba(10, 36, 99, 0.55); }
  .task-group-dot.urgency-laterrush { background: var(--fg-muted); }
  [data-theme="dark"] .task-group-dot.urgency-thismonth { background: rgba(212, 166, 74, 0.55); }
  [data-theme="dark"] .task-group-dot.urgency-laterrush { background: var(--fg-muted); }

  .task-row {
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .task-row:hover { background: var(--parchment); }
  [data-theme="dark"] .task-row:hover { background: rgba(212, 166, 74, 0.06); }
  .task-row-main {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .task-checkbox-inline {
    width: 16px; height: 16px;
    margin-top: 1px;
    accent-color: var(--navy);
    cursor: pointer;
    flex-shrink: 0;
  }
  [data-theme="dark"] .task-checkbox-inline { accent-color: var(--gold); }
  .task-row-body { flex: 1; min-width: 0; }
  .task-title {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--fg);
    line-height: 1.35;
  }
  .task-title.done { text-decoration: line-through; color: var(--fg-muted); }
  .task-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-muted);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }
  .task-row.urgency-overdue .task-title { color: var(--danger); }
  .task-row.urgency-overdue .task-meta { color: var(--danger); opacity: 0.75; }
  .task-row-expanded {
    padding: 0 12px 14px 40px;
  }
  .task-notes {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--fg-soft);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .task-notes.empty { font-style: italic; color: var(--fg-muted); }
  .task-row-actions { display: flex; gap: 8px; }
  .task-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .task-badge.priority-high   { background: rgba(184, 40, 50, 0.12);  color: var(--danger); }
  .task-badge.priority-low    { background: var(--line);                color: var(--fg-muted); }
  .task-badge.status-progress { background: rgba(10, 36, 99, 0.12);   color: var(--navy); }
  [data-theme="dark"] .task-badge.status-progress { color: var(--gold); }
  .task-badge.drifted {
    background: rgba(212, 166, 74, 0.22);
    color: var(--gold-dark);
    cursor: pointer;
  }
  .task-badge.drifted:hover { background: rgba(212, 166, 74, 0.38); }

  .task-section-toggle {
    padding: 10px 12px;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
    cursor: pointer;
    border-top: 1px solid var(--line);
    transition: color 0.15s;
  }
  .task-section-toggle:hover { color: var(--fg); }
  .task-section-toggle.open { color: var(--fg); }

  /* §3 — Banners */
  .task-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .task-banner .banner-icon  { font-size: 16px; }
  .task-banner .banner-text  { flex: 1; }
  .task-banner .banner-action {
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .task-banner .banner-action:hover { background: rgba(255,255,255,0.12); }
  .task-banner .banner-dismiss {
    background: transparent;
    border: none;
    color: inherit;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
    cursor: pointer;
    opacity: 0.7;
  }
  .task-banner .banner-dismiss:hover { opacity: 1; }
  .drift-banner       { background: rgba(212, 166, 74, 0.14); color: var(--gold-dark); }
  .duplicates-banner  { background: rgba(184, 40, 50, 0.10);   color: var(--danger); }
  .what-changed-banner{ background: rgba(63, 138, 92, 0.12);  color: #2c6b46; }
  [data-theme="dark"] .drift-banner { color: var(--gold); }
  [data-theme="dark"] .what-changed-banner { color: #6aa884; }

  /* §4 — Quick-add floating button */
  .quick-add-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--paper);
    border: none;
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    line-height: 0;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(3, 16, 46, 0.25);
    transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    z-index: 50;
  }
  .quick-add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(3, 16, 46, 0.32);
    background: var(--navy-dark);
  }
  [data-theme="dark"] .quick-add-btn { background: var(--gold); color: var(--navy-dark); }
  [data-theme="dark"] .quick-add-btn:hover { background: var(--gold-light); }

  /* §5 — Calendar task chips + day detail */
  .cal-task-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(232, 198, 112, 0.30);
    color: var(--navy-dark);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    margin: 2px 2px 0 0;
    cursor: pointer;
    max-width: 100%;
    transition: opacity 0.32s ease, background 0.15s;
  }
  [data-theme="dark"] .cal-task-chip { background: rgba(212, 166, 74, 0.30); color: var(--gold-light); }
  .cal-task-chip:hover { background: rgba(212, 166, 74, 0.55); }
  .cal-task-chip.fading { opacity: 0; pointer-events: none; }
  .cal-task-chip.done { opacity: 0.55; text-decoration: line-through; }
  .cal-task-chip.overdue { background: rgba(184, 40, 50, 0.18); color: var(--danger); }

  /* Phase 0 #5 — Marketing Calendar: pink post chips */
  .cal-post-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(232, 196, 208, 0.55);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    margin: 2px 2px 0 0;
    cursor: pointer;
    max-width: 100%;
    transition: background 0.15s;
  }
  .cal-post-chip:hover { background: rgba(232, 196, 208, 0.75); }
  [data-theme="dark"] .cal-post-chip { background: rgba(232, 196, 208, 0.30); color: var(--fg); }
  [data-theme="dark"] .cal-post-chip:hover { background: rgba(232, 196, 208, 0.45); }
  .cal-post-chip .post-channel {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    text-transform: uppercase;
  }
  .cal-post-chip .post-title {
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .marketing-view .marketing-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .marketing-view .marketing-header-actions { display: flex; gap: 8px; }
  /* Inline post-channel pill in the list table also uses cal-post-chip styling */
  .marketing-view .post-channel {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(232, 196, 208, 0.55);
    color: var(--fg);
    margin-right: 6px;
  }
  [data-theme="dark"] .marketing-view .post-channel { background: rgba(232, 196, 208, 0.30); }
  @media (max-width: 900px) {
    .marketing-view .marketing-header-row { flex-direction: column; align-items: stretch; }
    .marketing-view .marketing-header-actions { justify-content: flex-end; }
  }
  .cal-task-chip .cal-task-check {
    width: 12px; height: 12px;
    accent-color: var(--navy);
    cursor: pointer;
    margin: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .cal-task-chip:hover .cal-task-check { opacity: 1; }
  .cal-task-chip .cal-task-text {
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cal-day-detail-overlay {
    position: fixed; inset: 0;
    background: rgba(3, 16, 46, 0.45);
    z-index: 100;
    display: flex;
    justify-content: flex-end;
    backdrop-filter: blur(4px);
  }
  .cal-day-detail {
    width: 420px;
    max-width: 90vw;
    background: var(--surface);
    padding: 28px 32px;
    overflow-y: auto;
    position: relative;
  }
  .cal-day-detail-close {
    position: absolute;
    top: 14px; right: 18px;
    border: none; background: transparent;
    font-size: 20px; cursor: pointer;
    color: var(--fg-muted);
  }
  .cal-day-detail-head {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }
  [data-theme="dark"] .cal-day-detail-head { color: var(--gold); }
  .cal-day-section { margin-bottom: 22px; }
  .cal-day-section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }
  .cal-day-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .cal-day-item:hover { background: var(--parchment); }
  [data-theme="dark"] .cal-day-item:hover { background: rgba(212, 166, 74, 0.06); }
  .cal-day-item-title { font-weight: 500; }
  .cal-day-item-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-muted);
  }

  /* §6 — Templates CRUD inline edit form */
  .template-edit-form {
    background: var(--parchment);
    border-left: 3px solid var(--navy);
    padding: 14px 18px;
    margin-top: 6px;
    margin-bottom: 4px;
    border-radius: 4px;
  }
  [data-theme="dark"] .template-edit-form { background: rgba(212, 166, 74, 0.06); }
  .template-edit-form .form-row { margin-bottom: 10px; }
  .template-edit-form .form-row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .template-edit-form .form-row-grid label { margin: 0; }
  .template-edit-form .field-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    margin-bottom: 4px;
  }
  .template-edit-form .field-input,
  .template-edit-form .field-select,
  .template-edit-form .field-textarea {
    width: 100%;
    font-size: 13px;
    padding: 6px 10px;
  }
  .template-edit-form .form-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 14px;
  }
  .add-template-btn {
    margin: 6px 0 0 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    background: transparent;
    border: 1px dashed var(--line-strong);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .add-template-btn:hover { color: var(--navy); border-color: var(--navy); }
  [data-theme="dark"] .add-template-btn:hover { color: var(--gold); border-color: var(--gold); }

  /* §7 — Mobile */
  @media (max-width: 900px) {
    .quick-add-btn { bottom: 20px; right: 20px; width: 48px; height: 48px; }
    .cal-day-detail { padding: 20px 22px; }
    .template-edit-form .form-row-grid { grid-template-columns: 1fr; }

  /* §2A — Quick-add task bar (Templates tab) */
  .quick-add-task-bar {
    background: var(--parchment);
    border-left: 3px solid var(--gold);
    padding: 14px 18px;
    margin-bottom: 20px;
    border-radius: 4px;
  }
  [data-theme="dark"] .quick-add-task-bar { background: rgba(212, 166, 74, 0.06); }
  .quick-add-task-bar .qa-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 10px;
  }
  .quick-add-task-bar .qa-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 0.8fr 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .quick-add-task-bar .qa-title { min-width: 0; }
  .quick-add-task-bar .qa-select { min-width: 0; }
  .quick-add-task-bar .qa-add { white-space: nowrap; }
  @media (max-width: 900px) {
    .quick-add-task-bar .qa-row { grid-template-columns: 1fr 1fr; }
    .quick-add-task-bar .qa-add { grid-column: 1 / -1; }
  }
  }


  /* ============================================================
     ███  SP'26 REDESIGN — cool palette + reference UI
     Appended override layer. All original CSS above is untouched,
     so this can be removed wholesale to revert. Pure presentation.
     ============================================================ */
  :root {
    --navy: #0D1B2A;
    --navy-dark: #0A1422;
    --navy-darker: #060D18;
    --navy-sidebar: #142035;
    --navy-active: #1C2E45;
    --gold: #C9A84C;
    --gold-light: #E6CE86;
    --gold-dark: #A6852E;
    --gold-tile: #F5EDD6;
    --cream: #F4F5F8;
    --parchment: #EDEFF4;
    --ink: #0D1B2A;
    --ink-soft: #2E3645;
    --ink-muted: #8A8FA8;
    --paper: #FFFFFF;
    --line: #E8E9EE;
    --line-strong: #D7DAE3;
    --danger: #D94F4F;
    --success: #2DB87A;
    --text-sidebar: #B0BAD0;
    --live-badge-bg: #EBF9F3;

    --bg: var(--cream);
    --fg: var(--ink);
    --fg-soft: var(--ink-soft);
    --fg-muted: var(--ink-muted);
    --surface: var(--paper);
    --surface-2: var(--parchment);
  }

  body, [data-theme="dark"] body { background-image: none; background: var(--bg); }

  /* ---- shell ---- */
  .app { grid-template-columns: 265px 1fr; }
  .main { padding: 32px 40px 64px; max-width: none; }

  /* ---- sidebar ---- */
  .sidebar { background: var(--navy-sidebar); border-right: none; padding: 26px 16px 20px; }
  .brand-block { border-bottom: none; padding: 0 6px 4px; margin-bottom: 22px; }
  .brand-head { gap: 12px; margin-bottom: 0; align-items: center; }
  .akpsi-shield {
    width: 46px; height: 50px; flex-shrink: 0; padding: 0;
    /* Clean filled hexagon fallback (no border points) for screens that
       render the shield as plain text (login/loading). */
    background: linear-gradient(160deg, #1b2a44, #13213a);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: none;
    position: relative; display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 13px;
  }
  /* When the SVG hexagon is present (sidebar), it overlays the fallback. */
  .akpsi-shield svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .akpsi-shield span { position: relative; z-index: 1; }
  .brand-text { color: var(--gold); font-size: 24px; }
  .brand-text em { color: var(--gold); font-style: normal; }
  .brand-sub {
    padding-left: 0; margin-top: 5px; opacity: 0.75;
    color: var(--text-sidebar); font-family: 'Inter', sans-serif;
    font-size: 9.5px; letter-spacing: 0.14em;
  }
  .nav-label { color: var(--text-sidebar); opacity: 0.6; font-family: 'Inter', sans-serif; letter-spacing: 0.14em; margin-left: 14px; }
  .nav-item { color: var(--text-sidebar); border: none; border-radius: 9px; padding: 11px 14px; gap: 12px; font-size: 14px; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: #e7ecf6; }
  .nav-item.active { background: var(--navy-active); color: #fff; font-weight: 600; }
  .nav-item .nav-icon { width: 18px; height: 18px; color: var(--text-sidebar); display: flex; align-items: center; justify-content: center; font-size: 0; }
  .nav-item.active .nav-icon { color: var(--gold); }
  .nav-item .nav-icon svg { width: 17px; height: 17px; }
  .nav-item .nav-count {
    margin-left: auto; opacity: 1; background: #24344f; color: #fff;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    min-width: 22px; height: 20px; padding: 0 7px; border-radius: 100px;
    display: flex; align-items: center; justify-content: center;
  }
  .team-block { border-top: 1px solid rgba(255,255,255,0.07); background: var(--navy-sidebar); }
  .member-row { color: #d6ddec; padding: 8px 10px; border-radius: 8px; }
  .member-row:hover { background: rgba(255,255,255,0.05); }
  .theme-toggle { color: var(--text-sidebar); border-color: rgba(255,255,255,0.10); background: transparent; }
  .theme-toggle:hover { background: rgba(255,255,255,0.05); color: #e7ecf6; }

  /* ---- page header ---- */
  .page-header { border-bottom: none; padding-bottom: 0; align-items: flex-start; margin-bottom: 26px; }
  .page-header::after { display: none; }
  .page-title { color: var(--navy); }
  .page-title em { color: var(--navy); font-style: normal; }
  .page-sub { color: var(--fg-muted); font-size: 15px; margin-top: 10px; font-family: 'Inter', sans-serif; }
  .page-meta { font-family: 'Inter', sans-serif; }
  .live { color: var(--fg-muted); }
  .live-dot { background: var(--success); }

  /* ---- cards ---- */
  .stat-card, .section-card, .kpi-card, .countdown-hero, .rush-centerpiece {
    border-color: var(--line); box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .rush-centerpiece::before, .stat-card::after { display: none; }

  /* ---- KPI / stat cards with gold icon tiles ---- */
  .kpi-row { gap: 24px; }
  .kpi-card { display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 12px; }
  .kpi-card::after { display: none; }
  .kpi-icon {
    width: 46px; height: 46px; flex: 0 0 46px; background: var(--gold-tile);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--gold);
  }
  .kpi-icon svg { width: 22px; height: 22px; }
  .kpi-body { min-width: 0; }
  .kpi-label { font-family: 'Inter', sans-serif; font-size: 10.5px; letter-spacing: 0.06em; color: var(--fg-muted); margin-bottom: 3px; }
  .kpi-value { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 700; color: var(--navy); }
  .kpi-value em { font-family: 'Inter', sans-serif; color: var(--danger); font-style: normal; }
  .kpi-meta { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--fg-muted); margin-top: 2px; }

  /* ---- timeline recolor (gold TODAY, navy fills) ---- */
  .seg-today-line { background: var(--gold); }
  .seg-today-pill { background: var(--gold); color: var(--navy); font-family: 'Inter', sans-serif; }
  .rush-segment-fill { background: var(--navy); }
  .rush-segment.status-past .rush-segment-fill { background: var(--navy); opacity: 0.5; }
  .rush-segment.status-current .rush-segment-bar { background: var(--gold-tile); }
  .seg-milestone-marker { border-color: var(--navy); box-shadow: 0 0 0 3px var(--surface); }
  .seg-milestone-marker.bfc { background: var(--gold); border-color: var(--gold); }
  .centerpiece-eyebrow, .seg-label, .seg-meta-future, .seg-meta-past,
  .rush-chip .chip-label, .rush-chip .chip-date { font-family: 'Inter', sans-serif; }
  .seg-meta-current { background: var(--navy); color: #fff; font-family: 'Inter', sans-serif; }
  .centerpiece-sync { color: var(--success); font-family: 'Inter', sans-serif; }
  .phase-name { color: var(--navy); }
  .phase-sub { color: var(--fg-muted); }

  /* ---- lower grids -> separate white cards ---- */
  .dash-grid { background: transparent; border: none; gap: 24px; grid-template-columns: 1fr 1fr; overflow: visible; margin-bottom: 24px; }
  .dash-grid > .section-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .activity-grid { background: transparent; border: none; gap: 24px; overflow: visible; }
  .activity-grid.two-col { grid-template-columns: 1fr 1fr; }
  .activity-column { background: var(--surface); border: 1px solid var(--line) !important; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 20px 22px; }

  /* ---- section titles + buttons ---- */
  .section-title, .view-dashboard .section-title { color: var(--navy); }
  .btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); border-radius: 8px; }
  .btn.primary:hover { background: var(--navy-dark); border-color: var(--navy-dark); color: #fff; }

  /* Preserve dark mode (toggle still works). Defined AFTER the :root override
     above so it wins when data-theme="dark" is set on <html>. */
  [data-theme="dark"] {
    --bg: #0B1422;
    --surface: #121E30;
    --surface-2: #18263B;
    --fg: #EAEEF6;
    --fg-soft: #C2CADB;
    --fg-muted: #7E889E;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --gold-tile: rgba(201,168,76,0.16);
  }
  [data-theme="dark"] .stat-card, [data-theme="dark"] .section-card,
  [data-theme="dark"] .kpi-card, [data-theme="dark"] .rush-centerpiece,
  [data-theme="dark"] .dash-grid > .section-card, [data-theme="dark"] .activity-column {
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  [data-theme="dark"] .page-title, [data-theme="dark"] .page-title em,
  [data-theme="dark"] .kpi-value, [data-theme="dark"] .phase-name,
  [data-theme="dark"] .section-title, [data-theme="dark"] .view-dashboard .section-title { color: var(--gold); }
  [data-theme="dark"] .kpi-icon { color: var(--gold); }
</style>

<body>
<div id="root"></div>
<div class="toast-stack" id="toastStack"></div>

<!-- ================ SCHEDULE EVENT MODAL ================ -->
<div class="modal-overlay" id="schedModal">
  <div class="modal">
    <button class="modal-close" onclick="closeSchedModal()">✕</button>
    <div class="modal-title" id="schedModalTitle">New <em>event</em></div>
    <div class="modal-sub" id="schedModalSub">Block off your time</div>
    <div class="form-grid">
      <div>
        <label class="field-label">What is it?</label>
        <input type="text" class="field-input serif" id="schedTitle" placeholder="e.g. Calc 141 lecture" />
      </div>
      <div class="form-row">
        <div>
          <label class="field-label">Start time</label>
          <input type="time" class="field-input" id="schedStart" />
        </div>
        <div>
          <label class="field-label">End time</label>
          <input type="time" class="field-input" id="schedEnd" />
        </div>
      </div>
      <div>
        <label class="field-label">Repeats</label>
        <div class="chip-row" id="schedRecurChips"></div>
      </div>
      <div id="schedOnceRow">
        <label class="field-label">Date</label>
        <input type="date" class="field-input" id="schedOnceDate" />
      </div>
      <div id="schedWeeklyRow" style="display:none">
        <label class="field-label">On which days?</label>
        <div class="weekday-row" id="schedWeekdayChips"></div>
        <div class="form-row" style="margin-top: 10px;">
          <div>
            <label class="field-label">First date</label>
            <input type="date" class="field-input" id="schedStartDate" />
          </div>
          <div>
            <label class="field-label">Until</label>
            <input type="date" class="field-input" id="schedUntilDate" />
          </div>
        </div>
      </div>
      <div>
        <label class="field-label">Location (optional)</label>
        <input type="text" class="field-input" id="schedLocation" placeholder="Willard 075, home, etc." />
      </div>
      <div>
        <label class="field-label">Notes (optional)</label>
        <textarea class="field-textarea" id="schedNotes" placeholder="Anything else…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="deleteSchedBtn" onclick="deleteCurrentSched()" style="display:none">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeSchedModal()">Cancel</button>
        <button class="btn primary" onclick="saveSched()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ================ RECUR EDIT CHOICE MODAL ================ -->
<div class="modal-overlay" id="recurChoiceModal">
  <div class="modal narrow">
    <button class="modal-close" onclick="closeRecurChoice()">✕</button>
    <div class="recur-choice">
      <div class="recur-choice-title" id="recurChoiceTitle">Edit recurring event</div>
      <div class="recur-choice-sub" id="recurChoiceSub">This event repeats weekly. What do you want to change?</div>
      <div class="recur-choice-buttons">
        <button class="btn primary" onclick="recurChoicePicked('one')">Just this one occurrence</button>
        <button class="btn" onclick="recurChoicePicked('all')">All occurrences in the series</button>
        <button class="btn" onclick="closeRecurChoice()" style="margin-top:8px">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ================ NOTE EDITOR MODAL ================ -->
<div class="modal-overlay" id="noteModal">
  <div class="modal wide" id="noteModalInner">
    <button class="modal-close" onclick="closeNoteEditor()">✕</button>
    <div class="editor-accent-strip" id="editorAccentStrip"></div>
    <input type="text" class="editor-title-input" id="editorTitle" placeholder="Untitled note…" />
    <div class="editor-meta-rail" id="editorMetaRail"></div>
    <div class="editor-mode-bar">
      <div class="editor-mode-toggle">
        <button class="mode-btn" data-mode="read" onclick="setEditorMode('read')">Read</button>
        <button class="mode-btn" data-mode="edit" onclick="setEditorMode('edit')">Edit</button>
      </div>
      <div class="editor-mode-hint" id="editorModeHint"></div>
    </div>
    <div class="editor-surface" id="editorSurface">
      <textarea class="editor-body" id="editorBody" placeholder="Start writing… use # for headings, - for bullets"></textarea>
      <div class="editor-read" id="editorRead"></div>
    </div>
    <div class="editor-tag-row" id="editorTagRow"></div>
    <div class="tag-suggestions-row" id="editorTagSuggest" style="display:none;"></div>
    <div class="modal-footer">
      <button class="btn danger" onclick="deleteCurrentNote()" id="deleteNoteBtn" style="display:none">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeNoteEditor()">Cancel</button>
        <button class="btn primary" onclick="saveNote()">Save note</button>
      </div>
    </div>
  </div>
</div>

<!-- ================ EVENT MODAL ================ -->
<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <button class="modal-close" onclick="closeEventModal()">✕</button>
    <div class="modal-title" id="eventModalTitle">New <em>event</em></div>
    <div class="modal-sub">Shared with the rush committee</div>
    <div class="form-grid">
      <div>
        <label class="field-label">Event name</label>
        <input type="text" class="field-input serif" id="eventTitle" placeholder="What's happening?" />
      </div>
      <div>
        <label class="field-label">Date</label>
        <input type="date" class="field-input" id="eventDate" />
      </div>
      <div class="form-row">
        <div>
          <label class="field-label">Start time</label>
          <input type="time" class="field-input" id="eventStart" />
        </div>
        <div>
          <label class="field-label">End time</label>
          <input type="time" class="field-input" id="eventEnd" />
        </div>
      </div>
      <div id="eventConflictArea"></div>
      <div>
        <label class="field-label">Location</label>
        <input type="text" class="field-input" id="eventLocation" placeholder="e.g. Business Building 101" />
      </div>
      <div>
        <label class="field-label">Category</label>
        <div class="chip-row" id="eventCategoryChips"></div>
        <div class="chip-add-form">
          <input type="text" class="field-input" id="newEventCatName" placeholder="New category name" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addEventCategory();}" />
          <div class="color-mini-picker" id="newEventCatColors"></div>
          <button class="btn small primary" onclick="addEventCategory()">+ Add</button>
        </div>
      </div>
      <div>
        <label class="field-label">Notes</label>
        <textarea class="field-textarea" id="eventNotes" placeholder="Details, links, who's bringing what…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="deleteEventBtn" onclick="deleteCurrentEvent()" style="display:none">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeEventModal()">Cancel</button>
        <button class="btn primary" onclick="saveEvent()">Save event</button>
      </div>
    </div>
  </div>
</div>

<!-- ================ TASK MODAL ================ -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <button class="modal-close" onclick="closeTaskModal()">✕</button>
    <div class="modal-title" id="taskModalTitle">New <em>task</em></div>
    <div class="modal-sub">Delegate to the committee</div>
    <div class="form-grid">
      <div>
        <label class="field-label">Task</label>
        <input type="text" class="field-input serif" id="taskText" placeholder="What needs to get done?" />
      </div>
      <div class="form-row">
        <div>
          <label class="field-label">Due date</label>
          <input type="date" class="field-input" id="taskDue" />
        </div>
        <div>
          <label class="field-label">Priority</label>
          <select class="field-select" id="taskPriority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div>
        <label class="field-label">Assign to</label>
        <div class="chip-row" id="taskAssigneeChips"></div>
      </div>
      <div>
        <label class="field-label">Category</label>
        <div class="chip-row" id="taskCategoryChips"></div>
        <div class="chip-add-form">
          <input type="text" class="field-input" id="newTaskCatName" placeholder="New category name" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addTaskCategory();}" />
          <div class="color-mini-picker" id="newTaskCatColors"></div>

  // Map frontend "key" to Supabase table name. Changing keys here
  // would break existing data — keep them synced with schema.sql.
  const TABLE_MAP = {
    'notes': 'notes',
    'tasks': 'tasks',
    'events': 'events',

    'event_cats': 'event_cats',
    'task_cats': 'task_cats',

  // ============================================================
  // STORAGE LAYER — Supabase-backed
  // Each "key" (e.g. 'notes') maps to a table. Each array item
  // becomes one row keyed by its `id`. On set(), we upsert all
  // items and delete any rows in the DB not in the array.
  // ============================================================
  let connectionOK = true;

  const Storage = {
    async get(key) {
      const table = TABLE_MAP[key];
      if (!table) return null;
      try {
        const { data, error } = await sb.from(table).select('data');
        if (error) throw error;
        connectionOK = true;
        return (data || []).map(row => row.data);
      } catch (e) {
        console.error('Storage.get failed for', key, e);
        window._lastStorageError = e;
        connectionOK = false;
        return null;
      }
    },
    async set(key, arr) {
      const table = TABLE_MAP[key];
      if (!table || !Array.isArray(arr)) return false;
      try {
        // Upsert every item in the array
        if (arr.length > 0) {
          const rows = arr.map(item => ({ id: item.id, data: item }));
          const { error: upErr } = await sb.from(table).upsert(rows, { onConflict: 'id' });
          if (upErr) throw upErr;
        }
        // Delete any rows from the DB that aren't in the current array
        const idsInArr = arr.map(x => x.id);
        if (idsInArr.length > 0) {
          // quoted "not in" list
          const inList = '(' + idsInArr.map(id => '"' + id.replace(/"/g, '""') + '"').join(',') + ')';
          const { error: delErr } = await sb.from(table).delete().not('id', 'in', inList);
          if (delErr) throw delErr;
        } else {
          // array is empty: clear the whole table
          const { error: delErr } = await sb.from(table).delete().neq('id', '___never___');
          if (delErr) throw delErr;
        }
        connectionOK = true;
        return true;
      } catch (e) {
        console.error('Storage.set failed for', key, e);
        window._lastStorageError = e;
        connectionOK = false;
        return false;
      }
    },
    async deleteOne(key, id) {
      const table = TABLE_MAP[key];
      if (!table) return false;
      try {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) throw error;
        return true;
      } catch (e) {
        console.error('Storage.deleteOne failed', key, id, e);
        window._lastStorageError = e;
        return false;
      }
    }
  };

  // ============================================================
  // REALTIME: subscribe to every table so any change by any
  // teammate triggers a fresh load + re-render.
  // ============================================================
  let realtimeDebounce = null;
  function setupRealtime() {
    const channel = sb.channel('rush26-all');
    Object.values(TABLE_MAP).forEach(table => {
      channel.on('postgres_changes', { event: '*', schema: 'public', table }, () => {
        clearTimeout(realtimeDebounce);
        realtimeDebounce = setTimeout(async () => {
          // Save what the user is currently editing so we don't clobber open modals
          await loadAll();
          render();
          // Re-open modal content if open
          refreshOpenModal();
        }, 250);
      });
    });
    // Brothers table is not in TABLE_MAP (different storage shape).
    // Subscribe separately and refresh only the brothers slice.
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'brothers' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => {
        await loadBrothers();
        render();
      }, 250);
    });
    // Nametag prints — same pattern. Triggers when another chair runs
    // the generator so the printed-badge in our picker stays current.
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'nametag_prints' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => {
        await loadNametagPrints();
        render();
      }, 250);
    });
    // Phase 0 #4: task_templates + chapter_dates realtime. When another
    // chair re-seeds templates or edits an anchor date, our view re-renders.
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'task_templates' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => {
        await loadTaskTemplates();
        render();
      }, 250);
    });
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'chapter_dates' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => {
        await loadChapterDates();
        render();
      }, 250);
    });
    // Phase 0 #5: marketing_posts realtime
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'marketing_posts' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => {
        await loadMarketingPosts();
        render();
      }, 250);
    });
    // Phase 0 #6: budget realtime — isolated per-table loaders.
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'budget_categories' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => { await loadBudgetCategories(); render(); }, 250);
    });
    channel.on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, () => {
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async () => { await loadExpenses(); render(); }, 250);
    });
    channel.subscribe();
  }

  // ============================================================

    el.textContent = msg;

  }

  // ============================================================

        Storage.get('notes'),
        Storage.get('tasks'),
        Storage.get('events'),
        Storage.get('candidates'),
        Storage.get('event_cats'),
        Storage.get('task_cats'),
        Storage.get('schedule_events'),
      ]);

      // failure doesn't block the rest of the workspace from booting.

    }
    state.loading = false;
  }

  async function persist(key, value) {

      toast('Save failed (' + key + '): ' + reason, 'error');
    }
    return ok;
  }
