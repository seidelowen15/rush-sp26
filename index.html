  // ============================================================
  // Phase 0 #4: now a code-side fallback. Live anchors come from public.chapter_dates via getDashboardDates().
  const DASHBOARD_DATES_FALLBACK = {
    softLaunch:   { label: 'Soft launch',   iso: '2026-08-15', icon: '◴', sub: 'Forms open · outreach begins' },
    hardDeadline: { label: 'Hard deadline', iso: '2026-08-25', icon: '⬢', sub: 'Last day for submissions' },
    bfcMixer:     { label: 'BFC Mixer',     iso: '2026-09-08', icon: '✦', sub: 'Bid for Connection event' },
  };
  // Phase 0 #4 shim: callers still reference DASHBOARD_DATES.softLaunch.iso etc.
  // Object.defineProperty makes those reads live-merge with chapter_dates via getDashboardDates().
  const DASHBOARD_DATES = {};
  ['softLaunch', 'hardDeadline', 'bfcMixer'].forEach(function(k) {
    Object.defineProperty(DASHBOARD_DATES, k, {
      get: function() {
        try { return getDashboardDates()[k]; }
        catch (_) { return DASHBOARD_DATES_FALLBACK[k]; }
      }
    });
  });
  // Rush calendar timeline window: 6 months ending at BFC Mixer.
  // Frames the centerpiece progress bar so "today" sits visibly inside
  // the timeline even months out from the soft launch.
  const RUSH_TIMELINE_DAYS = 180;

  function getCountdownState(targetIso) {
    const target = new Date(targetIso + 'T00:00:00');
    const todayLocal = new Date();
    todayLocal.setHours(0, 0, 0, 0);
    const diffMs = target.getTime() - Date.now();
    const dayDiff = Math.round((target.getTime() - todayLocal.getTime()) / 86400000);

    if (dayDiff < 0)  return { value: 'PAST',  tone: 'past' };
    if (dayDiff === 0) return { value: 'TODAY', tone: 'today' };
    if (diffMs > 0 && diffMs <= 48 * 3600000) {
      const hours = Math.max(1, Math.ceil(diffMs / 3600000));
      return { value: hours + 'h', tone: 'red' };
    }
    let tone;
    if (dayDiff <= 7)       tone = 'red';
    else if (dayDiff <= 14) tone = 'gold';
    else                    tone = 'navy';
    return { value: dayDiff + 'd', tone };
  }

  function countdownSubtext(tone) {
    if (tone === 'past')  return 'Elapsed';
    if (tone === 'today') return 'Happening today';
    if (tone === 'red')   return 'Imminent';
    if (tone === 'gold')  return 'Approaching';
    return 'On the calendar';
  }

  function renderCountdownCard(label, iso, icon) {
    const st = getCountdownState(iso);
    const d = new Date(iso + 'T00:00:00');
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const sub = countdownSubtext(st.tone);
    return '<div class="countdown-hero tone-' + st.tone + '">' +
      '<div class="hero-icon">' + escapeHtml(icon) + '</div>' +
      '<div class="hero-body">' +
        '<div class="hero-label">' + escapeHtml(label) + '</div>' +
        '<div class="hero-value">' + escapeHtml(st.value) + '</div>' +
        '<div class="hero-date">' + escapeHtml(dateStr) + ' · <em>' + escapeHtml(sub) + '</em></div>' +
      '</div>' +
      '<div class="hero-affordance">→</div>' +
    '</div>';
  }

  function getRushPhase() {
    const now = Date.now();
    const sl  = new Date(DASHBOARD_DATES.softLaunch.iso   + 'T00:00:00').getTime();
    const hd  = new Date(DASHBOARD_DATES.hardDeadline.iso + 'T00:00:00').getTime();
    const bfc = new Date(DASHBOARD_DATES.bfcMixer.iso     + 'T00:00:00').getTime();
    if (now < sl)  return { id: 'pre-launch',    label: 'Pre-launch',           sub: 'Building the roster and groundwork before the soft launch.' };
    if (now < hd)  return { id: 'soft-launch',   label: 'Soft launch window',   sub: 'Open enrollment is live. Active outreach phase.' };
    if (now < bfc) return { id: 'final-stretch', label: 'Final stretch to BFC', sub: 'Hard deadline closing. Logistics locking down.' };
    return            { id: 'active-rush',  label: 'Active rush',          sub: 'Events underway. PNM evaluations in motion.' };
  }

  // §A dashboard polish: domain shifted from [bfc-180d, bfc] to [soft_launch, selection_start].
  // Spans the full rush arc. Fallbacks if chapter_dates not yet pinned.
  function getRushTimelinePct(t) {
    const byKey = getChapterDatesByKey();
    const slIso  = (byKey.soft_launch     && byKey.soft_launch.iso_date)     || null;
    const ssIso  = (byKey.selection_start && byKey.selection_start.iso_date) || null;
    const bfcIso = (byKey.bfc_mixer       && byKey.bfc_mixer.iso_date)       || DASHBOARD_DATES.bfcMixer.iso;
    const start = slIso ? new Date(slIso + 'T00:00:00').getTime() : (Date.now() - 30 * 86400000);
    const end   = ssIso ? new Date(ssIso + 'T00:00:00').getTime() : (new Date(bfcIso + 'T00:00:00').getTime() + 60 * 86400000);
    const ms = (typeof t === 'string') ? new Date(t + 'T00:00:00').getTime() : t;
    if (ms < start) return 0;
    if (ms > end)   return 100;
    return ((ms - start) / (end - start)) * 100;
  }

  // §B dashboard polish: template-derived milestone lookup with two silent-skip paths.
  function getMilestoneFromTemplate(titleSubstring, byKey) {
    if (!state.taskTemplatesLoaded) return null;  // suppress warnings during boot load
    const lower = titleSubstring.toLowerCase();
    const tmpl = (state.taskTemplates || []).find(function(t) {
      return (t.title || '').toLowerCase().indexOf(lower) !== -1;
    });
    if (!tmpl) {
      console.warn('[dashboard] milestone template containing "' + titleSubstring + '" not found in state.taskTemplates - was it renamed?');
      return null;
    }
    const calc = getTemplateCalculatedDue(tmpl, byKey);
    if (!calc) {
      console.warn('[dashboard] milestone "' + tmpl.title + '" anchor "' + tmpl.anchor_date_key + '" has no iso_date - not yet pinned');
      return null;
    }
    const isoDate = calc.toISOString().slice(0, 10);
    return { id: tmpl.id, label: tmpl.title, iso: isoDate };
  }

  // §C dashboard polish: full rewrite. 8 candidate milestones:
  //   5 chapter_dates: soft_launch, hard_deadline, bfc_mixer, rush_week_start, selection_start
  //   2 template-derived: Brother Mingle (BM), Run interviews (INT)
  //   1 explicit omit: Bid Delivery (no template/chapter_date source yet)
  // Short codes shown on bar; full label+date in title="" attribute for hover.
  // Labels stagger: even index -> below, odd index -> above (§F).
  // Returns the four rush-cycle phase segments with their boundaries and status.
  // Each segment has equal visual weight in the bar regardless of actual calendar length.
  function getRushPhaseSegments() {
    const byKey = getChapterDatesByKey();
    const now = Date.now();
    const toMs = function(iso) { return iso ? new Date(iso + 'T00:00:00').getTime() : null; };

    const slIso  = byKey.soft_launch     && byKey.soft_launch.iso_date;
    const rwsIso = byKey.rush_week_start && byKey.rush_week_start.iso_date;
    const ssIso  = byKey.selection_start && byKey.selection_start.iso_date;

    // Fallbacks if chapter_dates haven't been pinned yet
    const sl  = toMs(slIso)  || (now - 30 * 86400000);
    const rws = toMs(rwsIso) || (sl + 120 * 86400000);
    const ss  = toMs(ssIso)  || (rws + 14 * 86400000);
    const cycleStart = sl - 120 * 86400000; // Pre-launch spans ~4 months before soft launch
    const cycleEnd   = ss + 14 * 86400000;  // Selection wraps ~2 weeks after selection start

    const segments = [
      { id: 'pre_launch',  label: 'Pre-launch',  start: cycleStart, end: sl,  short: 'Pre-launch' },
      { id: 'soft_launch', label: 'Soft launch', start: sl,         end: rws, short: 'Soft launch' },
      { id: 'rush_week',   label: 'Rush week',   start: rws,        end: ss,  short: 'Rush week' },
      { id: 'selection',   label: 'Selection',   start: ss,         end: cycleEnd, short: 'Selection' },
    ];

    segments.forEach(function(s) {
      const dur = s.end - s.start;
      s.durDays = Math.max(1, Math.round(dur / 86400000));
      if (now < s.start)      s.status = 'future';
      else if (now >= s.end)  s.status = 'past';
      else                    s.status = 'current';
      // Today's % within this segment (0..100). Only meaningful when current.
      s.todayPct = (s.status === 'current') ? Math.max(0, Math.min(100, ((now - s.start) / dur) * 100)) : null;
      // Days remaining if this is the current segment
      s.daysRemaining = (s.status === 'current') ? Math.max(0, Math.ceil((s.end - now) / 86400000)) : null;
    });

    return segments;
  }

  // Place a milestone into the segment whose date range covers it.
  // Returns { segmentIndex, pctWithinSegment } or null if outside cycle.
  function placeMilestoneInSegments(isoDate, segments) {
    const ms = new Date(isoDate + 'T00:00:00').getTime();
    for (let i = 0; i < segments.length; i++) {
      const s = segments[i];
      if (ms >= s.start && ms <= s.end) {
        const pct = ((ms - s.start) / (s.end - s.start)) * 100;
        return { segmentIndex: i, pctWithinSegment: Math.max(0, Math.min(100, pct)) };
      }
    }
    return null;
  }

  function renderRushCenterpiece() {
    const phase = getRushPhase();
    const byKey = getChapterDatesByKey();
    const segments = getRushPhaseSegments();
    const now = Date.now();

    // Build milestone list from chapter_dates + templates
    const milestones = [];
    ['soft_launch', 'hard_deadline', 'bfc_mixer', 'rush_week_start', 'selection_start'].forEach(function(k) {
      const cd = byKey[k];
      if (cd && cd.iso_date) {
        milestones.push({ key: k, iso: cd.iso_date, label: cd.label });
      }
    });
    const bm = getMilestoneFromTemplate('brother mingle', byKey);
    if (bm) milestones.push({ key: 'tpl:' + bm.id, iso: bm.iso, label: bm.label });
    const ri = getMilestoneFromTemplate('run interviews', byKey);
    if (ri) milestones.push({ key: 'tpl:' + ri.id, iso: ri.iso, label: ri.label });

    milestones.sort(function(a, b) { return new Date(a.iso) - new Date(b.iso); });

    // Compute placement: each milestone gets a segment index, within-segment % (for the dot),
    // and a chip index (its position in the chip row, 0..N-1 left-to-right by date)
    const placed = [];
    milestones.forEach(function(m) {
      const placement = placeMilestoneInSegments(m.iso, segments);
      if (!placement) return;
      const ms = new Date(m.iso + 'T00:00:00').getTime();
      placed.push({
        milestone: m,
        segmentIndex: placement.segmentIndex,
        pctWithinSegment: placement.pctWithinSegment,
        isPast: ms < now,
      });
    });
    // Chip index = position in date-sorted list (already sorted)
    placed.forEach(function(p, i) { p.chipIndex = i; });
    const N = placed.length;

    // ── Render segment row (bars + dots, no labels) ──
    const segmentsHtml = segments.map(function(seg, segIdx) {
      const segMilestones = placed.filter(function(p) { return p.segmentIndex === segIdx; });

      const dotNodes = segMilestones.map(function(pm) {
        const m = pm.milestone;
        const dateStr = new Date(m.iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const markerClasses = ['seg-milestone-marker'];
        if (pm.isPast) markerClasses.push('past');
        if (m.key === 'bfc_mixer') markerClasses.push('bfc');
        return '<div class="seg-milestone" ' +
                'style="left:' + pm.pctWithinSegment.toFixed(1) + '%" ' +
                'data-mkey="' + escapeHtml(m.key) + '" ' +
                'onclick="event.stopPropagation(); openMilestoneDetail(\'' + m.key + '\')" ' +
                'title="' + escapeHtml(m.label + ' · ' + dateStr) + '">' +
          '<div class="' + markerClasses.join(' ') + '"></div>' +
        '</div>';
      }).join('');

      let headerMeta;
      if (seg.status === 'current') {
        headerMeta = '<span class="seg-meta-current">Now · ' + seg.daysRemaining + 'd left</span>';
      } else if (seg.status === 'past') {
        headerMeta = '<span class="seg-meta-past">Done</span>';
      } else {
        const daysUntil = Math.ceil((seg.start - now) / 86400000);
        headerMeta = '<span class="seg-meta-future">in ' + daysUntil + 'd</span>';
      }

      const todayMarker = seg.status === 'current'
        ? '<div class="seg-today-line" style="left:' + seg.todayPct.toFixed(1) + '%">' +
            '<div class="seg-today-pill">TODAY</div>' +
          '</div>'
        : '';

      let fillStyle = '';
      if (seg.status === 'past') fillStyle = 'width:100%';
      else if (seg.status === 'current') fillStyle = 'width:' + seg.todayPct.toFixed(1) + '%';
      else fillStyle = 'width:0%';

      return '<div class="rush-segment status-' + seg.status + '" data-segment="' + seg.id + '">' +
        '<div class="rush-segment-header">' +
          '<span class="seg-label">' + escapeHtml(seg.label) + '</span>' +
          headerMeta +
        '</div>' +
        '<div class="rush-segment-bar">' +
          '<div class="rush-segment-fill" style="' + fillStyle + '"></div>' +
          dotNodes +
          todayMarker +
        '</div>' +
      '</div>';
    }).join('');

    // ── Render chip row (one chip per milestone, equal-width cells via grid) ──
    const chipsHtml = placed.map(function(pm) {
      const m = pm.milestone;
      const dateStr = new Date(m.iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const classes = ['rush-chip'];
      if (pm.isPast) classes.push('past');
      if (m.key === 'bfc_mixer') classes.push('bfc');
      return '<div class="' + classes.join(' ') + '" ' +
              'data-mkey="' + escapeHtml(m.key) + '" ' +
              'onclick="event.stopPropagation(); openMilestoneDetail(\'' + m.key + '\')">' +
        '<div class="chip-dot"></div>' +
        '<div class="chip-text">' +
          '<div class="chip-label">' + escapeHtml(m.label) + '</div>' +
          '<div class="chip-date">' + escapeHtml(dateStr) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // ── Render connector layer (SVG polylines from each dot to its chip) ──
    // Connector geometry is computed at render time using known positions:
    //   - Dot X = (segIdx + pctWithinSegment/100) * (100 / 4)   (% of full row width)
    //   - Chip X = (chipIndex + 0.5) * (100 / N)                 (center of its grid cell, % of full row width)
    // The connector zone is a fixed height (28px). We draw a polyline:
    //   dotX,0 → dotX,8 → chipX,20 → chipX,28
    const connectorsHtml = N > 0
      ? '<svg class="rush-connectors" preserveAspectRatio="none" viewBox="0 0 1000 28">' +
          placed.map(function(pm) {
            const dotX = ((pm.segmentIndex + pm.pctWithinSegment / 100) / segments.length) * 1000;
            const chipX = ((pm.chipIndex + 0.5) / N) * 1000;
            const pts = dotX.toFixed(1) + ',0 ' +
                        dotX.toFixed(1) + ',8 ' +
                        chipX.toFixed(1) + ',20 ' +
                        chipX.toFixed(1) + ',28';
            const cls = 'connector' + (pm.isPast ? ' past' : '');
            return '<polyline class="' + cls + '" data-mkey="' + escapeHtml(pm.milestone.key) + '" points="' + pts + '" />';
          }).join('') +
        '</svg>'
      : '';

    return '<div class="rush-centerpiece phase-' + phase.id + '">' +
      '<div class="centerpiece-head">' +
        '<div class="centerpiece-eyebrow">Rush Cycle Progress</div>' +
        '<div class="centerpiece-sync"><span class="sync-dot"></span><span class="sync-text">Live · synced</span></div>' +
      '</div>' +
      '<div class="centerpiece-phase">' +
        '<div class="phase-name">' + escapeHtml(phase.label) + '</div>' +
        '<div class="phase-sub">' + escapeHtml(phase.sub) + '</div>' +
      '</div>' +
      '<div class="rush-bar-stack" onmouseover="handleMilestoneHover(event, true)" onmouseout="handleMilestoneHover(event, false)">' +
        '<div class="rush-segments">' + segmentsHtml + '</div>' +
        connectorsHtml +
        '<div class="rush-chip-row" style="grid-template-columns: repeat(' + Math.max(1, N) + ', 1fr);">' + chipsHtml + '</div>' +
      '</div>' +
    '</div>';
  }

  // Sync hover state between a dot and its chip (and the connector)
  window.handleMilestoneHover = function(event, isEnter) {
    const target = event.target.closest('[data-mkey]');
    if (!target) return;
    const key = target.getAttribute('data-mkey');
    const root = event.currentTarget;
    root.querySelectorAll('[data-mkey="' + CSS.escape(key) + '"]').forEach(function(el) {
      el.classList.toggle('is-hover', isEnter);
    });
  };

  function getTaskUrgency(t) {
    if (!t.dueISO || t.status === 'done') return 'future';
    const due = new Date(t.dueISO).getTime();
    if (due < Date.now()) return 'overdue';
    const todayEnd = new Date(); todayEnd.setHours(23, 59, 59, 999);
    if (due <= todayEnd.getTime()) return 'today';
    if (due <= Date.now() + 7 * 86400000) return 'week';
    return 'future';
  }

  function renderAttentionItem(label, meta, urgency, onclick) {
    return '<div class="attention-item" onclick="' + onclick + '">' +
      '<div class="attention-dot urgency-' + urgency + '"></div>' +
      '<div class="attention-text">' +
        '<div class="item-title">' + escapeHtml(label) + '</div>' +
        (meta ? '<div class="item-meta">' + escapeHtml(meta) + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  function renderEmptyState(glyph, text) {
    return '<div class="empty-state-polished">' +
      '<div class="empty-glyph">' + escapeHtml(glyph) + '</div>' +
      '<div class="empty-text">' + escapeHtml(text) + '</div>' +
    '</div>';
  }

  // One-line inline empty — much smaller than empty-state-polished. For dashboard sections
  // where a 120px-tall empty card would dominate when there happens to be no data.
  function renderEmptyInline(text) {
    return '<div class="empty-inline">' + escapeHtml(text) + '</div>';
  }

  function renderDashboard() {
    const me = MEMBERS.find(m => m.id === state.currentUser);
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const now = Date.now();

    // ----- Pinned notes (preserved) -----
    const pinnedNotes = state.notes.filter(n => n.pinned).slice(0, 2);
    const pinnedBanner = pinnedNotes.length > 0
      ? '<div class="pinned-banner">' +
          '<div class="pinned-banner-title">✦ Pinned · ' + pinnedNotes.length + ' note' + (pinnedNotes.length > 1 ? 's' : '') + '</div>' +
          pinnedNotes.map(n =>
            '<div style="cursor:pointer; padding:4px 0;" onclick="openNoteEditor(\'' + n.id + '\')">' +
              '<h3>' + escapeHtml(n.title || 'Untitled') + '</h3>' +
              '<p>' + escapeHtml((n.body || '').slice(0, 120)) + ((n.body || '').length > 120 ? '…' : '') + '</p>' +
            '</div>'
          ).join('') +
        '</div>'
      : '';

    // ----- Hero: timeline centerpiece (countdown row removed — timeline shows same data) -----
    const centerpiece = renderRushCenterpiece();

    // ----- KPI row (4 cards, relabeled, 7-day window) -----
    const activeBrothers = state.brothers.filter(b => (b.status || 'active') === 'active').length;
    const activeCands = state.candidates.filter(c => c.status !== 'rejected').length;
    const openTasks = state.tasks.filter(t => t.status !== 'done').length;
    const upcomingEventsCount = state.events.filter(e => {
      const s = new Date(e.startISO).getTime();
      return s >= now && s <= now + 7 * 86400000;
    }).length;

    // §D dashboard polish: gold-italic em wrap only when threshold met.
    // Rule: overdueCount >= 1 OR (assignedToCurrentUser AND dueWithin24h >= 1)
    const overdueCount = state.tasks.filter(function(t) {
      return t.status !== 'done' && t.dueISO && new Date(t.dueISO).getTime() < Date.now();
    }).length;
    const myTasks24h = state.tasks.filter(function(t) {
      if (t.status === 'done' || !t.dueISO || t.assigneeId !== state.currentUser) return false;
      const due = new Date(t.dueISO).getTime();
      return due > Date.now() && due - Date.now() <= 24 * 3600000;
    }).length;
    const needsAttentionUrgent = overdueCount >= 1 || myTasks24h >= 1;
    const openTasksDisplay = needsAttentionUrgent ? ('<em>' + openTasks + '</em>') : String(openTasks);

    // SP'26 redesign: gold icon tiles per KPI card.
    const KPI_ICONS = {
      members: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8" r="3"/><path d="M3.5 19c0-3 2.2-4.6 5-4.6s5 1.6 5 4.6"/><path d="M16 5.3a3 3 0 0 1 0 5.4"/><path d="M16.8 14.6c2 .5 3.4 1.9 3.4 4.4"/></svg>',
      pipeline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>',
      attention: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>',
    };
    const kpiRow = '<div class="kpi-row">' +
      '<div class="kpi-card" onclick="switchView(\'brothers\')">' +
        '<div class="kpi-icon">' + KPI_ICONS.members + '</div>' +
        '<div class="kpi-body">' +
          '<div class="kpi-label">Active members</div>' +
          '<div class="kpi-value">' + activeBrothers + '</div>' +
          '<div class="kpi-meta">in chapter</div>' +
        '</div>' +
      '</div>' +
      '<div class="kpi-card" onclick="switchView(\'candidates\')">' +
        '<div class="kpi-icon">' + KPI_ICONS.pipeline + '</div>' +
        '<div class="kpi-body">' +
          '<div class="kpi-label">In pipeline</div>' +
          '<div class="kpi-value">' + activeCands + '</div>' +
          '<div class="kpi-meta">candidates tracked</div>' +
        '</div>' +
      '</div>' +
      // §H: Needs Attention card sets tasksView=all before switching (surface all open tasks).
      '<div class="kpi-card" onclick="state.tasksView = \'all\'; switchView(\'tasks\')">' +
        '<div class="kpi-icon">' + KPI_ICONS.attention + '</div>' +
        '<div class="kpi-body">' +
          '<div class="kpi-label">Needs attention</div>' +
          '<div class="kpi-value">' + openTasksDisplay + '</div>' +
          '<div class="kpi-meta">open tasks</div>' +
        '</div>' +
      '</div>' +
      '<div class="kpi-card" onclick="switchView(\'calendar\')">' +
        '<div class="kpi-icon">' + KPI_ICONS.calendar + '</div>' +
        '<div class="kpi-body">' +
          '<div class="kpi-label">Next 7 days</div>' +
          '<div class="kpi-value">' + upcomingEventsCount + '</div>' +
          '<div class="kpi-meta">events scheduled</div>' +
        '</div>' +
      '</div>' +
    '</div>';

    // ----- Needs attention -----
    const openTasksWithDue = state.tasks.filter(t => t.status !== 'done' && t.dueISO);
    const overdue = openTasksWithDue
      .filter(t => getTaskUrgency(t) === 'overdue')
      .sort((a, b) => new Date(a.dueISO) - new Date(b.dueISO))
      .slice(0, 5);
    const dueSoon = openTasksWithDue
      .filter(t => { const u = getTaskUrgency(t); return u === 'today' || u === 'week'; })
      .sort((a, b) => new Date(a.dueISO) - new Date(b.dueISO))
      .slice(0, 5);
    const eventsThisWeek = state.events
      .filter(e => {
        const s = new Date(e.startISO).getTime();
        return s >= now && s <= now + 7 * 86400000;
      })
      .sort((a, b) => new Date(a.startISO) - new Date(b.startISO));

    const taskMeta = (t) => {
      const due = new Date(t.dueISO);
      const dueStr = due.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const assignee = MEMBERS.find(m => m.id === t.assigneeId);
      return dueStr + (assignee ? ' · ' + assignee.name : '');
    };

    const attentionTasks = (overdue.length === 0 && dueSoon.length === 0)
      ? renderEmptyInline('Nothing on fire. Catch your breath.')
      : '<div class="attention-list">' +
          overdue.map(t => renderAttentionItem(t.text || '(untitled task)', taskMeta(t), 'overdue', 'openTaskModal(\'' + t.id + '\')')).join('') +
          dueSoon.map(t => renderAttentionItem(t.text || '(untitled task)', taskMeta(t), getTaskUrgency(t), 'openTaskModal(\'' + t.id + '\')')).join('') +
        '</div>';

    const attentionEvents = eventsThisWeek.length === 0
      ? renderEmptyInline('Nothing on the calendar this week.')
      : '<div class="attention-list">' +
          eventsThisWeek.map(e => {
            const d = new Date(e.startISO);
            const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const isToday = d.toDateString() === new Date().toDateString();
            const urgency = isToday ? 'today' : 'week';
            return renderAttentionItem(e.title, dateStr + ' · ' + formatEventTime(e), urgency, 'openEventModal(null, \'' + e.id + '\')');
          }).join('') +
        '</div>';

    const attentionGrid = '<div class="dash-grid">' +
      '<div class="section-card">' +
        '<div class="section-title">Needs attention <button class="btn small" onclick="switchView(\'tasks\')">view tasks →</button></div>' +
        attentionTasks +
      '</div>' +
      '<div class="section-card">' +
        '<div class="section-title">Events this week <button class="btn small" onclick="switchView(\'calendar\')">view calendar →</button></div>' +
        attentionEvents +
      '</div>' +
    '</div>';

    // ----- Recent activity (2-column feed — nametag prints removed as ambient noise) -----
    const recentNotes = state.notes
      .filter(n => !n.pinned)
      .slice()
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
      .slice(0, 5);
    const completedTasks = state.tasks
      .filter(t => t.status === 'done')
      .slice()
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
      .slice(0, 5);

    const recentNotesCol = '<div class="activity-column">' +
      '<div class="section-title">Recent notes</div>' +
      (recentNotes.length === 0
        ? renderEmptyInline('No notes yet.')
        : recentNotes.map(n => {
            const author = MEMBERS.find(m => m.id === n.authorId);
            return '<div class="activity-item" onclick="openNoteEditor(\'' + n.id + '\')">' +
              '<div class="activity-item-title">' + escapeHtml(n.title || 'Untitled') + '</div>' +
              '<div class="activity-item-meta">' + (author ? escapeHtml(author.name) : '—') + ' · ' + timeAgo(n.updatedAt) + '</div>' +
            '</div>';
          }).join('')) +
    '</div>';

    const completedTasksCol = '<div class="activity-column">' +
      '<div class="section-title">Recently completed</div>' +
      (completedTasks.length === 0
        ? renderEmptyInline('Nothing completed yet.')
        : completedTasks.map(t => {
            const assignee = MEMBERS.find(m => m.id === t.assigneeId);
            return '<div class="activity-item" onclick="openTaskModal(\'' + t.id + '\')">' +
              '<div class="activity-item-title">' + escapeHtml(t.text || '(untitled)') + '</div>' +
              '<div class="activity-item-meta">' + (assignee ? escapeHtml(assignee.name) : '—') + ' · ' + timeAgo(t.updatedAt || t.createdAt) + '</div>' +
            '</div>';
          }).join('')) +
    '</div>';

    const activityGrid = '<div class="activity-grid two-col">' + recentNotesCol + completedTasksCol + '</div>';

    return '<div class="view-dashboard">' +
      pinnedBanner +
      centerpiece +
      kpiRow +
      attentionGrid +
      activityGrid +
      (state.milestoneDetail ? renderMilestoneDetail() : '') +
    '</div>';
  }

  // ============================================================
  // NOTES
  // ============================================================

  // ============================================================
  // MARKETING CALENDAR (Phase 0 #5)
  // Top-level tab. Fixed-date posts (no anchor system).
  // Calendar/List subviews. PDF export. Reused calendar grid CSS.
  // ============================================================
  async function loadMarketingPosts() {
    try {
      const { data, error } = await sb.from('marketing_posts').select('*').order('post_date', { ascending: true });
      if (error) throw error;
      state.marketingPosts = data || [];
      state.marketingPostsLoaded = true;
    } catch (e) {
      console.error('loadMarketingPosts failed', e);
      state.marketingPosts = [];
      state.marketingPostsLoaded = true;
    }
  }

  function getChannelLabel(channel) {
    if (channel === 'instagram_post')  return 'IG';
    if (channel === 'instagram_story') return 'IG/ST';
    if (channel === 'instagram_reel')  return 'IG/RL';
    if (channel === 'tiktok')          return 'TT';
    return channel || '?';
  }

  function getChannelFullLabel(channel) {
    if (channel === 'instagram_post')  return 'Instagram Post';
    if (channel === 'instagram_story') return 'Instagram Story';
    if (channel === 'instagram_reel')  return 'Instagram Reel';
    if (channel === 'tiktok')          return 'TikTok';
    return channel || '(unknown)';
  }

  function formatMcDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ============================================================
  // BUDGET TRACKING (Phase 0 #6)
  // Typed tables: budget_categories (approved per cat) + expenses
  // (line items, est + actual). Cap derived = SUM(approved_amount).
  // Isolated realtime; reuses dashboard segment-bar visual language.
  // ============================================================
  async function loadBudgetCategories() {
    try {
      const { data, error } = await sb.from('budget_categories').select('*').order('sort_order', { ascending: true });
      if (error) throw error;
      state.budgetCategories = data || [];
      state.budgetCategoriesLoaded = true;
    } catch (e) {
      console.error('loadBudgetCategories failed', e);
      state.budgetCategories = [];
      state.budgetCategoriesLoaded = true;
    }
  }

  async function loadExpenses() {
    try {
      const { data, error } = await sb.from('expenses').select('*').order('spent_on', { ascending: true, nullsFirst: false });
      if (error) throw error;
      state.expenses = data || [];
      state.expensesLoaded = true;
    } catch (e) {
      console.error('loadExpenses failed', e);
      state.expenses = [];
      state.expensesLoaded = true;
    }
  }

  function computeBudgetTotals() {
    const cats = state.budgetCategories || [];
    const exps = state.expenses || [];
    const cap       = cats.reduce(function(s, c) { return s + Number(c.approved_amount || 0); }, 0);
    const estimated = exps.reduce(function(s, e) { return s + Number(e.estimated_amount || 0); }, 0);
    const actual    = exps.reduce(function(s, e) { return s + Number(e.actual_amount || 0); }, 0);
    return {
      cap: cap, estimated: estimated, actual: actual,
      remaining: cap - actual,
      pctActual: cap > 0 ? Math.min(100, (actual / cap) * 100) : 0,
      overCap: cap > 0 && actual > cap
    };
  }

  function fmtMoney(n) {
    return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function budgetCategoryActual(catId) {
    return (state.expenses || []).reduce(function(s, e) {
      return e.category_id === catId ? s + Number(e.actual_amount || 0) : s;
    }, 0);
  }

  function renderBudgetCategoryBars() {
    const cats = (state.budgetCategories || []).slice().sort(function(a, b) {
      return (a.sort_order || 0) - (b.sort_order || 0);
    });
    const uncatActual = (state.expenses || []).reduce(function(s, e) {
      return !e.category_id ? s + Number(e.actual_amount || 0) : s;
    }, 0);
    const rows = cats.map(function(c) {
      const approved = Number(c.approved_amount || 0);
      const actual = budgetCategoryActual(c.id);
      const hasApproved = approved > 0;
      const over = hasApproved && actual > approved;
      const pct = hasApproved ? Math.min(100, (actual / approved) * 100) : 0;
      return '<div class="budget-cat-row">' +
        '<div class="budget-cat-head">' +
          '<span class="budget-cat-name">' + escapeHtml(c.name) + '</span>' +
          '<span class="budget-cat-figures">' + fmtMoney(actual) + ' <span class="budget-of">/ ' + (hasApproved ? fmtMoney(approved) : '—') + '</span></span>' +
        '</div>' +
        '<div class="budget-cat-bar">' +
          '<div class="budget-cat-fill' + (over ? ' over' : '') + (hasApproved ? '' : ' none') + '" style="width:' + pct + '%"></div>' +
        '</div>' +
      '</div>';
    });
    if (uncatActual > 0) {
      rows.push('<div class="budget-cat-row">' +
        '<div class="budget-cat-head">' +
          '<span class="budget-cat-name budget-cat-uncat">Uncategorized</span>' +
          '<span class="budget-cat-figures">' + fmtMoney(uncatActual) + ' <span class="budget-of">/ —</span></span>' +
        '</div>' +
        '<div class="budget-cat-bar"><div class="budget-cat-fill none" style="width:0%"></div></div>' +
      '</div>');
    }
    return '<div class="budget-cat-section">' +
      '<div class="budget-section-header">By category</div>' +
      rows.join('') +
    '</div>';
  }

  function renderBudgetView() {
    const t = computeBudgetTotals();
    const hasCap = t.cap > 0;
    return '' +
      '<div class="budget-view">' +
        '<div class="budget-summary-card">' +
          '<div class="budget-summary-head">' +
            '<span class="budget-summary-label">Actual spend vs approved budget</span>' +
            '<span class="budget-summary-figures">' + fmtMoney(t.actual) + ' <span class="budget-of">/ ' + (hasCap ? fmtMoney(t.cap) : '—') + '</span></span>' +
          '</div>' +
          '<div class="budget-cap-bar">' +
            '<div class="budget-cap-fill' + (t.overCap ? ' over' : '') + '" style="width:' + (hasCap ? t.pctActual : 0) + '%"></div>' +
          '</div>' +
          '<div class="budget-summary-meta">' +
            (hasCap
              ? '<span class="' + (t.overCap ? 'budget-over' : 'budget-under') + '">' +
                  (t.overCap ? fmtMoney(t.actual - t.cap) + ' over budget' : fmtMoney(t.remaining) + ' remaining') + '</span>'
              : '<span class="budget-cap-pending">No approved budget set yet</span>') +
          '</div>' +
        '</div>' +
        '<div class="budget-figure-row">' +
          '<div class="budget-figure-tile">' +
            '<div class="budget-figure-label">Estimated</div>' +
            '<div class="budget-figure-value">' + fmtMoney(t.estimated) + '</div>' +
          '</div>' +
          '<div class="budget-figure-tile">' +
            '<div class="budget-figure-label">Actual</div>' +
            '<div class="budget-figure-value">' + fmtMoney(t.actual) + '</div>' +
          '</div>' +
          '<div class="budget-figure-tile">' +
            '<div class="budget-figure-label">Approved</div>' +
            '<div class="budget-figure-value">' + (hasCap ? fmtMoney(t.cap) : '—') + '</div>' +
          '</div>' +
        '</div>' +
        renderBudgetCategoryBars() +
      '</div>';
  }

  function renderMarketingView() {
    const mode = state.marketingViewMode || 'calendar';
    return '<div class="marketing-view">' +
      '<div class="marketing-header-row">' +
        '<div class="tasks-scope-toggle">' +
          '<button class="scope-pill' + (mode === 'calendar' ? ' active' : '') + '" onclick="setMarketingViewMode(\'calendar\')">Calendar</button>' +
          '<button class="scope-pill' + (mode === 'list' ? ' active' : '') + '" onclick="setMarketingViewMode(\'list\')">List</button>' +
        '</div>' +
        '<div class="marketing-header-actions">' +
          '<button class="btn small" onclick="exportMarketingCalendarPDF()">Export to PDF</button>' +
          '<button class="btn primary small" onclick="openMarketingPostModal()">+ Add post</button>' +
        '</div>' +
      '</div>' +
      (mode === 'list' ? renderMarketingListSubview() : renderMarketingCalendarSubview()) +
    '</div>';
  }

  function renderMarketingCalendarSubview() {
    const posts = state.marketingPosts || [];
    if (posts.length === 0) {
      return '<div class="empty-state-polished" style="margin-top:32px;">' +
        '<div class="empty-glyph">◭</div>' +
        '<div class="empty-text" style="font-family:\'Playfair Display\',serif; font-style:italic;">No posts on the calendar yet. Tap + Add post.</div>' +
      '</div>';
    }
    const d = state.calendarDate || new Date();
    const year = d.getFullYear();
    const month = d.getMonth();
    const monthName = d.toLocaleDateString('en-US', { month: 'long' });
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const todayStr = new Date().toDateString();
    const cells = [];
    for (let i = startWeekday - 1; i >= 0; i--) cells.push({ date: new Date(year, month - 1, daysInPrev - i), otherMonth: true });
    for (let i = 1; i <= daysInMonth; i++) cells.push({ date: new Date(year, month, i), otherMonth: false });
    while (cells.length % 7 !== 0 || cells.length < 42) {
      const last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getTime() + 86400000), otherMonth: true });
      if (cells.length >= 42) break;
    }
    const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return '<div class="calendar-header">' +
        '<div class="calendar-month">' + monthName + ' <em>' + year + '</em></div>' +
        '<div class="calendar-nav">' +
          '<button class="btn btn-icon" onclick="calNav(-1)">‹</button>' +
          '<button class="btn" onclick="calToday()">Today</button>' +
          '<button class="btn btn-icon" onclick="calNav(1)">›</button>' +
        '</div>' +
      '</div>' +
      '<div class="calendar-grid">' +
        dayHeaders.map(function(h) { return '<div class="cal-day-header">' + h + '</div>'; }).join('') +
        cells.map(function(c) {
          const dateKey = c.date.toDateString();
          const dateIso = c.date.toISOString().slice(0,10);
          const dayPosts = posts.filter(function(p) { return new Date(p.post_date + 'T00:00:00').toDateString() === dateKey; })
                                .sort(function(a,b){ return (a.post_time || '99:99').localeCompare(b.post_time || '99:99'); });
          const isToday = dateKey === todayStr;
          const visiblePosts = dayPosts.slice(0, 4);
          const overflow = dayPosts.length - visiblePosts.length;
          return '<div class="cal-cell ' + (c.otherMonth ? 'other-month' : '') + ' ' + (isToday ? 'today' : '') + '">' +
            '<div class="cal-date">' + c.date.getDate() + '</div>' +
            visiblePosts.map(function(p) {
              return '<div class="cal-post-chip" onclick="event.stopPropagation(); openMarketingPostModal(\'' + p.id + '\')" title="' + escapeHtml(p.title + ' · ' + getChannelFullLabel(p.channel)) + '">' +
                '<span class="post-channel">' + escapeHtml(getChannelLabel(p.channel)) + '</span>' +
                '<span class="post-title">' + escapeHtml(p.title) + '</span>' +
              '</div>';
            }).join('') +
            (overflow > 0 ? '<div style="font-size:9px; color:var(--fg-muted); font-family:\'JetBrains Mono\',monospace;">+' + overflow + '</div>' : '') +
          '</div>';
        }).join('') +
      '</div>';
  }

    const titleEl    = document.getElementById('mcModalTitle');

    const timeEl     = document.getElementById('mcModalTime');
    const channelEl  = document.getElementById('mcModalChannel');
    const assetEl    = document.getElementById('mcModalAsset');

    const post_time = timeEl && timeEl.value ? timeEl.value : null;
    const channel = channelEl ? channelEl.value : 'instagram_post';
    const asset_link = assetEl && assetEl.value ? assetEl.value.trim() : null;
    const notes = notesEl && notesEl.value ? notesEl.value.trim() : null;

      asset_link: asset_link, notes: notes,
      updated_at: new Date().toISOString(), updated_by: state.currentUser

        const { error } = await sb.from('marketing_posts').update(payload).eq('id', state.editingMarketingPostId);

      } else {
        payload.created_by = state.currentUser;

        if (error) throw error;
      }
      await loadMarketingPosts();
      toast(state.editingMarketingPostId ? 'Post updated.' : 'Post added.', 'success');
      closeMarketingPostModal();

      console.error('saveMarketingPost failed', e);
      toast('Save failed — check console.', 'error');

  window.exportMarketingCalendarPDF = function() {
    const posts = (state.marketingPosts || []).slice().sort(function(a,b){

      const bd = (b.post_date || '') + ' ' + (b.post_time || '99:99');
      return ad < bd ? -1 : ad > bd ? 1 : 0;
    });

    if (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined') {
      toast('PDF library not loaded.', 'error');
      console.error('jsPDF not available on window');
      return;
    }
    const jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'landscape' });
    const now = new Date();
    const monthLabel = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).toLowerCase().replace(/\s+/g, '_');
    const today = now.toISOString().slice(0,10);
    const filename = 'marketing_calendar_' + monthLabel + '_' + today + '.pdf';

    // Header
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Marketing Calendar', 40, 40);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text('Generated ' + now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }), 40, 58);
    doc.text(String(posts.length) + ' post' + (posts.length === 1 ? '' : 's'), 40, 72);

    // Table
    const startY = 96;
    const colX = { title: 40, date: 220, time: 340, channel: 400, asset: 510, notes: 640 };
    const rowH = 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('Title', colX.title, startY);
    doc.text('Date', colX.date, startY);
    doc.text('Time', colX.time, startY);
    doc.text('Channel', colX.channel, startY);
    doc.text('Asset', colX.asset, startY);
    doc.text('Notes', colX.notes, startY);
    doc.setLineWidth(0.5);
    doc.line(40, startY + 4, 780, startY + 4);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    let y = startY + rowH;
    const pageHeight = 612;  // letter landscape = 792 x 612 — height is 612
    posts.forEach(function(p, i) {
      if (y > pageHeight - 40) { doc.addPage(); y = 40; }
      const dateStr = formatMcDate(p.post_date);
      const timeStr = p.post_time ? p.post_time.slice(0,5) : '-';
      const channelStr = getChannelFullLabel(p.channel);
      const assetStr = p.asset_link ? p.asset_link.slice(0, 24) + (p.asset_link.length > 24 ? '...' : '') : '-';
      const notesStr = p.notes ? p.notes.slice(0, 36) + (p.notes.length > 36 ? '...' : '') : '-';
      doc.text((p.title || '').slice(0, 30), colX.title, y);
      doc.text(dateStr, colX.date, y);
      doc.text(timeStr, colX.time, y);
      doc.text(channelStr, colX.channel, y);
      doc.text(assetStr, colX.asset, y);
      doc.text(notesStr, colX.notes, y);
      y += rowH;
    });
    doc.save(filename);
    toast('PDF exported: ' + filename, 'success');
  };

  // Primary tag taxonomy. First match (in this order) wins as a note's section.
  const NOTE_PRIMARY_TAGS = [
    { id: 'rush-ops',    label: 'Rush Ops',   desc: 'The operational core of rush week itself — schedules, room assignments, event mechanics, day-of run-of-show.', example: 'e.g. Rush Week Rooms & Times, Speed Dating flow' },
    { id: 'candidates',  label: 'Candidates', desc: 'PNM tracking, evaluations, ranking discussions, bid lists, deliberation notes.', example: 'e.g. Tuesday eval recap, bid list draft' },
    { id: 'meetings',    label: 'Meetings',   desc: 'Recaps from any meeting — onboarding, exec, PR sync, chapter, alumni, 1-on-1s.', example: 'e.g. Rush x PR Meeting, Mikayla Meeting' },
    { id: 'pr',          label: 'PR',         desc: 'Post ideas, captions, branding, themes, content calendar, social strategy.', example: 'e.g. IG announcement copy, theme brainstorm' },
    { id: 'exec',        label: 'Exec',       desc: 'Chair-level decisions, policy, agreements, conflicts, big-picture planning.', example: 'e.g. Rush Agreement, takeover notes' },
    { id: 'logistics',   label: 'Logistics',  desc: 'Stuff supporting rush but not rush itself — budgets, vendors, merch, food, supplies, transport.', example: 'e.g. T-shirt order, food vendor list' },
    { id: 'archive',     label: 'Archive',    desc: 'Done, superseded, or inactive. Kept for reference. Collapsed by default.', example: 'e.g. last semester\'s schedule, old policy draft' },
  ];
  const NOTE_PRIMARY_TAG_IDS = NOTE_PRIMARY_TAGS.map(t => t.id);

  function getNoteSection(note) {
    const tags = (note.tags || []).map(t => String(t).toLowerCase().trim());
    for (const tag of tags) {
      if (NOTE_PRIMARY_TAG_IDS.includes(tag)) return tag;
    }
    return 'untagged';
  }

  function groupNotesBySection(notes) {
    const buckets = { pinned: [] };
    NOTE_PRIMARY_TAG_IDS.forEach(id => { buckets[id] = []; });
    buckets.untagged = [];

    notes.forEach(n => {
      if (n.pinned) { buckets.pinned.push(n); return; }
      buckets[getNoteSection(n)].push(n);
    });

    Object.keys(buckets).forEach(k => buckets[k].sort((a, b) => b.updatedAt - a.updatedAt));

    const order = [
      { id: 'pinned',     label: 'Pinned',     cls: 'pinned' },
      { id: 'rush-ops',   label: 'Rush Ops',   cls: '' },
      { id: 'candidates', label: 'Candidates', cls: '' },
      { id: 'meetings',   label: 'Meetings',   cls: '' },
      { id: 'pr',         label: 'PR',         cls: '' },
      { id: 'exec',       label: 'Exec',       cls: '' },
      { id: 'logistics',  label: 'Logistics',  cls: '' },
      { id: 'untagged',   label: 'Untagged',   cls: 'untagged' },
      { id: 'archive',    label: 'Archive',    cls: 'archive' },
    ];
    return order
      .map(s => Object.assign({}, s, { notes: buckets[s.id] }))
      .filter(s => s.notes.length > 0);
  }

  function renderNoteCard(n) {
    const author = MEMBERS.find(m => m.id === n.authorId);
    const authorColor = author ? author.color : 'var(--navy)';
    const tags = (n.tags || []).slice(0, 3);

    return sections.map(section => {
      const isArchive = section.id === 'archive';

      const headerClick = isArchive ? ' onclick="toggleArchiveSection()"' : '';

  // ── Lightweight markdown: # / ## headings, - or * bullets, blank lines = paragraphs ──
  function renderNoteMarkdown(src) {
    const raw = (src || '').trim();
    if (!raw) return '<em class="empty-doc">No content yet. Switch to Edit to write.</em>';

    const lines = raw.split(/\r?\n/);
    const out = [];
    let listOpen = false;
    let paraBuf = [];

    function flushPara() {
      if (paraBuf.length === 0) return;
      out.push('<p>' + paraBuf.map(escapeHtml).join('<br/>') + '</p>');
      paraBuf = [];
    }
    function closeList() {
      if (listOpen) { out.push('</ul>'); listOpen = false; }
    }

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();
      if (!line.trim()) { flushPara(); closeList(); continue; }

      const h1 = line.match(/^#\s+(.+)$/);
      const h2 = line.match(/^##\s+(.+)$/);
      const bullet = line.match(/^\s*[-*]\s+(.+)$/);

      if (h2) { flushPara(); closeList(); out.push('<h2>' + escapeHtml(h2[1]) + '</h2>'); continue; }
      if (h1) { flushPara(); closeList(); out.push('<h1>' + escapeHtml(h1[1]) + '</h1>'); continue; }
      if (bullet) {
        flushPara();
        if (!listOpen) { out.push('<ul>'); listOpen = true; }
        out.push('<li>' + escapeHtml(bullet[1]) + '</li>');
        continue;
      }
      closeList();
      paraBuf.push(line);
    }
    flushPara();
    closeList();
    return out.join('');
  }

  window.setEditorMode = function(mode) {
    state.editorMode = mode;
    applyEditorMode();

  function applyEditorMode() {
    const inner = document.getElementById('noteModalInner');
    if (!inner) return;
    inner.setAttribute('data-mode', state.editorMode);
    document.querySelectorAll('#noteModalInner .mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === state.editorMode);
    });
    const hint = document.getElementById('editorModeHint');
    if (hint) {
      hint.textContent = state.editorMode === 'edit'
        ? 'Use # heading · ## section · - bullet'
        : '';
    }
    if (state.editorMode === 'read') {
      const body = document.getElementById('editorBody').value;
      document.getElementById('editorRead').innerHTML = renderNoteMarkdown(body);
    } else {
      setTimeout(() => document.getElementById('editorBody')?.focus(), 30);
    }
  }

  function renderEditorMetaRail(note) {
    const rail = document.getElementById('editorMetaRail');
    if (!rail) return;
    if (!note) {
      const me = MEMBERS.find(m => m.id === state.currentUser);
      const myColor = me ? me.color : 'var(--navy)';
      rail.innerHTML =
        '<div class="meta-avatar" style="background:' + myColor + '">' + (me ? me.name[0] : '?') + '</div>' +
        '<span class="meta-strong">New briefing</span>' +
        '<span class="meta-sep">·</span>' +
        '<span>by ' + (me ? escapeHtml(me.name) : 'you') + '</span>';
      return;
    }
    const author = MEMBERS.find(m => m.id === note.authorId);
    const editor = MEMBERS.find(m => m.id === note.lastEditedBy);
    const authorColor = author ? author.color : 'var(--navy)';
    const parts = [];
    parts.push('<div class="meta-avatar" style="background:' + authorColor + '">' + (author ? author.name[0] : '?') + '</div>');
    parts.push('<span class="meta-strong">' + (author ? escapeHtml(author.name) : 'Unknown') + '</span>');
    parts.push('<span class="meta-sep">·</span>');
    parts.push('<span>Created ' + timeAgo(note.createdAt) + '</span>');
    if (note.updatedAt && note.updatedAt !== note.createdAt) {
      parts.push('<span class="meta-sep">·</span>');
      const editorName = editor ? editor.name : (author ? author.name : '');
      parts.push('<span>Updated ' + timeAgo(note.updatedAt) + (editorName ? ' by ' + escapeHtml(editorName) : '') + '</span>');
    }
    rail.innerHTML = parts.join('');
  }

  window.openNoteEditor = function(id) {
    state.editingNoteId = id || null;
    const note = id ? state.notes.find(n => n.id === id) : null;
    document.getElementById('editorTitle').value = note?.title || '';
    document.getElementById('editorBody').value = note?.body || '';
    state.editingNoteTags = (note?.tags || []).slice();

    // Author-color: existing note → original author; new note → current user
    const authorId = note ? note.authorId : state.currentUser;
    const author = MEMBERS.find(m => m.id === authorId);
    const authorColor = author ? author.color : 'var(--navy)';
    const inner = document.getElementById('noteModalInner');
    if (inner) inner.style.setProperty('--author-color', authorColor);

    // Smart mode default: Read for existing, Edit for new
    state.editorMode = note ? 'read' : 'edit';

    renderEditorMetaRail(note);
    renderEditorTags();
    document.getElementById('deleteNoteBtn').style.display = id ? 'inline-flex' : 'none';
    document.getElementById('noteModal').classList.add('active');
    applyEditorMode();
    if (state.editorMode === 'edit') {
      setTimeout(() => document.getElementById('editorTitle').focus(), 50);
    }

  function renderEditorTags() {
    const row = document.getElementById('editorTagRow');
    row.innerHTML = '<span class="toolbar-label">Tags:</span>' +
      state.editingNoteTags.map((t, i) =>
        '<span class="tag removable" onclick="removeNoteTag(' + i + ')">' + escapeHtml(t) + '<span class="chip-remove">✕</span></span>'
      ).join('') +
      '<input type="text" class="tag-input" id="newTagInput" placeholder="+ tag" maxlength="20" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addNoteTag();}" />' +
      '<button class="btn small" onclick="addNoteTag()">Add</button>';

          ).join('');

  window.addSuggestedTag = function(tagId) {
    if (state.editingNoteTags.includes(tagId)) return;
    state.editingNoteTags.push(tagId);
    renderEditorTags();
  };

  window.addNoteTag = function() {
    const input = document.getElementById('newTagInput');
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    if (state.editingNoteTags.includes(val)) {
      toast('Tag already added', 'default');
      input.value = '';
      return;
    }
    state.editingNoteTags.push(val);
    input.value = '';
    renderEditorTags();
    setTimeout(() => document.getElementById('newTagInput')?.focus(), 10);
  };

  window.removeNoteTag = function(i) {
    state.editingNoteTags.splice(i, 1);
    renderEditorTags();
  };

  window.closeNoteEditor = function() {
    document.getElementById('noteModal').classList.remove('active');
    state.editingNoteId = null;
  };

  window.saveNote = async function() {
    const title = document.getElementById('editorTitle').value.trim();
    const body = document.getElementById('editorBody').value.trim();
    if (!title && !body) { closeNoteEditor(); return; }

    if (state.editingNoteId) {
      const note = state.notes.find(n => n.id === state.editingNoteId);
      if (note) {
        note.title = title;
        note.body = body;
        note.tags = state.editingNoteTags.slice();
        note.updatedAt = Date.now();
        note.lastEditedBy = state.currentUser;
      }
    } else {
      state.notes.unshift({
        id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title, body,
        tags: state.editingNoteTags.slice(),
        pinned: false,
        authorId: state.currentUser,
        lastEditedBy: state.currentUser,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
    }
    await persist('notes', state.notes);
    toast('Note saved', 'success');
    closeNoteEditor();
    render();
  };

  window.deleteCurrentNote = async function() {
    if (!state.editingNoteId) return;
    if (!confirm('Delete this note? It will be removed for the committee.')) return;
    state.notes = state.notes.filter(n => n.id !== state.editingNoteId);
    await persist('notes', state.notes);
    toast('Note deleted', 'default');
    closeNoteEditor();
    render();
  };

  // ============================================================
  // CALENDAR
  // ============================================================
  function renderCalendar() {
    const d = state.calendarDate;
    const year = d.getFullYear();
    const month = d.getMonth();
    const monthName = d.toLocaleDateString('en-US', { month: 'long' });
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const todayStr = new Date().toDateString();

    const cells = [];
    for (let i = startWeekday - 1; i >= 0; i--) {
      cells.push({ date: new Date(year, month - 1, daysInPrev - i), otherMonth: true });
    }
    for (let i = 1; i <= daysInMonth; i++) {
      cells.push({ date: new Date(year, month, i), otherMonth: false });
    }
    while (cells.length % 7 !== 0 || cells.length < 42) {
      const last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getTime() + 86400000), otherMonth: true });
      if (cells.length >= 42) break;
    }

    const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const filteredEvents = state.calendarFilterCategory === 'all'
      ? state.events
      : state.events.filter(e => e.categoryId === state.calendarFilterCategory);

    return '' +
      '<div class="calendar-header">' +
        '<div class="calendar-month">' + monthName + ' <em>' + year + '</em></div>' +
        '<div class="calendar-nav">' +
          '<button class="btn btn-icon" onclick="calNav(-1)">‹</button>' +
          '<button class="btn" onclick="calToday()">Today</button>' +
          '<button class="btn btn-icon" onclick="calNav(1)">›</button>' +
          '<button class="btn primary" onclick="openEventModal()" style="margin-left:6px">+ Event</button>' +
        '</div>' +
      '</div>' +
      '<div class="legend">' +
        '<span>Filter:</span>' +
        '<button class="chip ' + (state.calendarFilterCategory === 'all' ? 'selected' : '') + '" onclick="setCalFilter(\'all\')">All</button>' +
        state.eventCategories.map(c =>
          '<button class="chip ' + (state.calendarFilterCategory === c.id ? 'selected' : '') + '" onclick="setCalFilter(\'' + c.id + '\')" style="' + (state.calendarFilterCategory === c.id ? 'background:' + c.color + '; border-color:' + c.color + '; color:var(--paper)' : '') + '">' +
            '<span class="chip-dot" style="background:' + (state.calendarFilterCategory === c.id ? 'var(--paper)' : c.color) + '"></span>' + escapeHtml(c.name) +
          '</button>'
        ).join('') +
      '</div>' +
      '<div class="calendar-grid">' +
        dayHeaders.map(h => '<div class="cal-day-header">' + h + '</div>').join('') +
        cells.map(c => {
          const dateKey = c.date.toDateString();
          const dayEvents = filteredEvents.filter(e => new Date(e.startISO).toDateString() === dateKey)
                             .sort((a, b) => new Date(a.startISO) - new Date(b.startISO));
          // v2 (Diff 4): task chips on day cells; open tasks only.
          const dayTasks = state.tasks
            .filter(t => t.dueISO && t.status !== 'done' && new Date(t.dueISO).toDateString() === dateKey)
            .sort((a, b) => (a.priority === 'high' ? -1 : 1) - (b.priority === 'high' ? -1 : 1));
          // Phase 0 #5: marketing posts on day cells (pink chips).
          const dayPosts = (state.marketingPosts || [])
            .filter(p => new Date(p.post_date + 'T00:00:00').toDateString() === dateKey)
            .sort((a, b) => (a.post_time || '99:99').localeCompare(b.post_time || '99:99'));
          const itemBudget = 4;
          // Order: events first, tasks second, posts third (per Phase 0 #5 spec).
          const visibleEvents = dayEvents.slice(0, itemBudget);
          let remainingBudget = Math.max(0, itemBudget - visibleEvents.length);
          const visibleTasks = dayTasks.slice(0, remainingBudget);
          remainingBudget = Math.max(0, remainingBudget - visibleTasks.length);
          const visiblePosts = dayPosts.slice(0, remainingBudget);
          const overflowCount =
            (dayEvents.length - visibleEvents.length) +
            (dayTasks.length - visibleTasks.length) +
            (dayPosts.length - visiblePosts.length);
          const isToday = dateKey === todayStr;
          const dateIso = c.date.toISOString();
          // v2 (Diff 4): empty cells keep v1 quick-add; populated cells route to day-detail.
          const cellOnClick = (dayEvents.length + dayTasks.length + dayPosts.length) === 0
            ? 'openEventModal(\'' + dateIso + '\')'
            : 'openCalDayDetail(\'' + dateIso + '\')';
          return '<div class="cal-cell ' + (c.otherMonth ? 'other-month' : '') + ' ' + (isToday ? 'today' : '') + '" onclick="' + cellOnClick + '">' +
            '<div class="cal-date">' + c.date.getDate() + '</div>' +
            visibleEvents.map(e => {
              const cat = state.eventCategories.find(cc => cc.id === e.categoryId) || state.eventCategories[0];
              return '<div class="cal-event" style="background:' + (cat ? cat.color : '#0A2463') + '" onclick="event.stopPropagation(); openEventModal(null, \'' + e.id + '\')">' + escapeHtml(formatEventShort(e)) + '</div>';
            }).join('') +
            visibleTasks.map(t => {
              const isOverdue = new Date(t.dueISO).getTime() < Date.now();
              const chipClasses = 'cal-task-chip' + (isOverdue ? ' overdue' : '');
              return '<div class="' + chipClasses + '" onclick="event.stopPropagation(); openTaskModal(\'' + t.id + '\')">' +
                '<input type="checkbox" class="cal-task-check" onclick="event.stopPropagation(); toggleTaskDoneFromChip(\'' + t.id + '\')">' +
                '<span class="cal-task-text">' + escapeHtml(t.title) + '</span>' +
              '</div>';
            }).join('') +
            visiblePosts.map(p => {
              return '<div class="cal-post-chip" onclick="event.stopPropagation(); openMarketingPostModal(\'' + p.id + '\')" title="' + escapeHtml(p.title + ' \u00b7 ' + getChannelFullLabel(p.channel)) + '">' +
                '<span class="post-channel">' + escapeHtml(getChannelLabel(p.channel)) + '</span>' +
                '<span class="post-title">' + escapeHtml(p.title) + '</span>' +
              '</div>';
            }).join('') +
            (overflowCount > 0 ? '<div style="font-size:9px; color:var(--fg-muted); font-family:\'JetBrains Mono\',monospace;">+' + overflowCount + '</div>' : '') +
          '</div>';
        }).join('') +
      '</div>' +
      (state.calendarDayDetail ? renderCalDayDetail() : '') +
      '<div style="margin-top: 14px; font-family:\'JetBrains Mono\',monospace; font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.12em;">Empty day click to add · populated day click to inspect · chip checkbox toggles done</div>';
  }

  window.setCalFilter = function(id) { state.calendarFilterCategory = id; render(); };
  window.calNav = function(dir) { state.calendarDate = new Date(state.calendarDate.getFullYear(), state.calendarDate.getMonth() + dir, 1); render(); };
  window.calToday = function() { state.calendarDate = new Date(); render(); };

  // ============================================================
  // CAL DAY DETAIL PANEL (Diff 4)
  // Slide-from-right panel showing all events + tasks for one day.
  // CSS shipped in Diff 1. Body scroll lock applied explicitly.
  // ============================================================
  function renderCalDayDetail() {
    const iso = state.calendarDayDetail;
    if (!iso) return '';
    const d = new Date(iso);
    const dateKey = d.toDateString();
    const headLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const dayEvents = state.events
      .filter(function(e) { return new Date(e.startISO).toDateString() === dateKey; })
      .sort(function(a, b) { return new Date(a.startISO) - new Date(b.startISO); });
    const dayTasks = state.tasks
      .filter(function(t) { return t.dueISO && new Date(t.dueISO).toDateString() === dateKey; })
      .sort(function(a, b) { return (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0); });
    return '<div class="cal-day-detail-overlay" onclick="if (event.target === this) closeCalDayDetail()">' +
      '<div class="cal-day-detail">' +
        '<button class="cal-day-detail-close" onclick="closeCalDayDetail()">&times;</button>' +
        '<div class="cal-day-detail-head">' + escapeHtml(headLabel) + '</div>' +
        '<div class="cal-day-section">' +
          '<div class="cal-day-section-label">Events (' + dayEvents.length + ')</div>' +
          (dayEvents.length === 0
            ? '<div style="font-size:13px; color:var(--fg-muted); padding:6px 0;">No events scheduled.</div>'
            : dayEvents.map(function(e) {
                const cat = state.eventCategories.find(function(cc) { return cc.id === e.categoryId; });
                const timeStr = new Date(e.startISO).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                return '<div class="cal-day-item" onclick="closeCalDayDetail(); openEventModal(null, \'' + e.id + '\')">' +
                  '<div class="cal-day-item-title">' +
                    (cat ? '<span class="chip-dot" style="background:' + cat.color + '; margin-right:6px;"></span>' : '') +
                    escapeHtml(e.title || e.name || '(untitled)') +
                  '</div>' +
                  '<div class="cal-day-item-time">' + escapeHtml(timeStr) + '</div>' +
                '</div>';
              }).join('')
          ) +
          '<button class="btn small" style="margin-top:8px;" onclick="closeCalDayDetail(); openEventModal(\'' + iso + '\')">+ Event</button>' +
        '</div>' +
        '<div class="cal-day-section">' +
          '<div class="cal-day-section-label">Tasks (' + dayTasks.length + ')</div>' +
          (dayTasks.length === 0
            ? '<div style="font-size:13px; color:var(--fg-muted); padding:6px 0;">No tasks due.</div>'
            : dayTasks.map(function(t) {
                const isDone = t.status === 'done';

  // Slide-from-right panel showing tasks anchored to a milestone.
  // Reuses .cal-day-detail-overlay styling (shipped Diff 1).
  // Mutually exclusive with state.calendarDayDetail.
  // ============================================================
  function renderMilestoneDetail() {
    const key = state.milestoneDetail;
    if (!key) return '';
    const byKey = getChapterDatesByKey();
    let milestoneLabel, milestoneIso, matchingTasks;
    if (key.indexOf('tpl:') === 0) {
      const templateId = key.slice(4);
      const tmpl = (state.taskTemplates || []).find(function(t) { return t.id === templateId; });
      if (!tmpl) return '';
      milestoneLabel = tmpl.title;
      const calc = getTemplateCalculatedDue(tmpl, byKey);
      milestoneIso = calc ? calc.toISOString().slice(0, 10) : null;
      matchingTasks = (state.tasks || []).filter(function(t) { return t.templateId === templateId; });
    } else {
      const cd = byKey[key];
      if (!cd) return '';
      milestoneLabel = cd.label;
      milestoneIso = cd.iso_date;
      const templateIds = (state.taskTemplates || []).filter(function(t) { return t.anchor_date_key === key; }).map(function(t) { return t.id; });
      matchingTasks = (state.tasks || []).filter(function(t) { return templateIds.indexOf(t.templateId) !== -1; });
    }
    matchingTasks = matchingTasks.slice().sort(function(a, b) {
      const ad = a.dueISO ? new Date(a.dueISO).getTime() : Infinity;
      const bd = b.dueISO ? new Date(b.dueISO).getTime() : Infinity;
      return ad - bd;
    });
    const dateStr = milestoneIso ? new Date(milestoneIso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : 'Date not pinned';
    return '<div class="cal-day-detail-overlay" onclick="if (event.target === this) closeMilestoneDetail()">' +
      '<div class="cal-day-detail">' +
        '<button class="cal-day-detail-close" onclick="closeMilestoneDetail()">&times;</button>' +
        '<div class="cal-day-detail-head">' + escapeHtml(milestoneLabel) + '</div>' +
        '<div style="font-family:\'JetBrains Mono\',monospace; font-size:11px; color:var(--fg-muted); margin-bottom:14px;">' + escapeHtml(dateStr) + '</div>' +
        '<div class="cal-day-section">' +
          '<div class="cal-day-section-label">Tasks anchored here (' + matchingTasks.length + ')</div>' +
          (matchingTasks.length === 0
            ? '<div style="font-size:13px; color:var(--fg-muted); padding:6px 0;">No tasks anchored to this milestone.</div>'
            : matchingTasks.map(function(t) {
                const isDone = t.status === 'done';
                const due = t.dueISO ? new Date(t.dueISO).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '-';
                const assignee = MEMBERS.find(function(m) { return m.id === t.assigneeId; });
                const meta = due + (assignee ? ' · ' + assignee.name : '');
                return '<div class="cal-day-item' + (isDone ? ' done' : '') + '" onclick="closeMilestoneDetail(); openTaskModal(\'' + t.id + '\')" style="' + (isDone ? 'opacity:0.55; text-decoration:line-through;' : '') + '">' +
                  '<div class="cal-day-item-title">' + escapeHtml(t.text || t.title || '(untitled task)') + '</div>' +
                  '<div class="cal-day-item-time">' + escapeHtml(meta) + '</div>' +
                '</div>';
              }).join('')
          ) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  window.saveTask = async function() {

    const dueStr = document.getElementById('taskDue').value;
    const priority = document.getElementById('taskPriority').value;
    const notes = document.getElementById('taskNotes').value.trim();

    if (state.editingTaskId) {
      const t = state.tasks.find(x => x.id === state.editingTaskId);
      if (t) {
        // Phase 0 #4 v2: detect edits to flip task.edited (drift gate) and stamp dueISOMovedAt.
        // status changes alone don't count as edits; only structural fields (title, description,
        // assignee, dueISO) do. notes counted per Owen clarification 3.
        const newDueISO = dueStr ? new Date(dueStr + 'T23:59:59').toISOString() : null;
        const userEdited = (
          text                          !== (t.text || '') ||
          notes                         !== (t.notes || '') ||
          state.editingTask.assigneeId  !== (t.assigneeId || null) ||
          newDueISO                     !== (t.dueISO || null)
        );
        const dueChanged = newDueISO !== (t.dueISO || null);
        Object.assign(t, {
          text,
          assigneeId: state.editingTask.assigneeId,
          categoryId: state.editingTask.categoryId,
          status: state.editingTask.status,
          priority, notes,
          dueISO: newDueISO,
          updatedAt: Date.now(),
        });
        if (userEdited && t.templateId)     t.edited = true;
        if (dueChanged)                     t.dueISOMovedAt = Date.now();
        if (userEdited && t.driftFromAnchor) t.driftFromAnchor = false;  // explicit edit reconciles drift
      }
    } else {
      state.tasks.push({
        id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),

        assigneeId: state.editingTask.assigneeId,

        ? '<div class="empty-state">' +
            '<div class="ornament">★</div>' +
            '<div style="font-family:\'Playfair Display\',serif; font-size:22px; font-style:italic; margin-bottom:8px;">No candidates yet</div>' +
            '<div style="font-size:13px;">Start tracking the PNMs you meet this rush.</div>' +
          '</div>'
        : '<div class="candidates-grid">' + filtered.map(renderCandidateCard).join('') + '</div>');

  function renderCandidateCard(c) {
    const initials = ((c.firstName || '?')[0] + (c.lastName || '?')[0]).toUpperCase();
    const status = CANDIDATE_STATUSES.find(s => s.id === c.status) || CANDIDATE_STATUSES[0];
    const votes = c.votes || {};
    const yesCount = Object.values(votes).filter(v => v === 'yes').length;

      '<div class="vote-buttons" onclick="event.stopPropagation()">' +
        '<button class="vote-btn ' + (myVote === 'yes' ? 'picked-yes' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'yes\')">✓ Yes</button>' +
        '<button class="vote-btn ' + (myVote === 'maybe' ? 'picked-maybe' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'maybe\')">? Maybe</button>' +
        '<button class="vote-btn ' + (myVote === 'no' ? 'picked-no' : '') + '" onclick="voteCandidate(\'' + c.id + '\', \'no\')">✕ No</button>' +
      '</div>' +
      '<div class="candidate-meta">' +
        '<div class="vote-display">' +
          '<span class="vote-count vote-yes">✓ ' + yesCount + '</span>' +
          '<span class="vote-count vote-maybe">? ' + maybeCount + '</span>' +
          '<span class="vote-count vote-no">✕ ' + noCount + '</span>' +
        '</div>' +
        '<div style="font-family:\'JetBrains Mono\',monospace; font-size:9px; color:var(--fg-muted); text-transform:uppercase; letter-spacing:0.08em;">' + timeAgo(c.updatedAt) + '</div>' +
      '</div>' +
    '</div>';
  }
